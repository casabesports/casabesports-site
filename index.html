<style>
/*!
 * Casa Besports — thèmes (Clair, Sombre, Noir absolu, Papier journal, Automatique)
 * Toutes les couleurs de l’interface passent par ces variables : modifiez-les ici.
 * Direction « Le bandeau » (voir bandeau.css) : noir et blanc, comme le logo. --acc est la couleur d’action
 * (noir sur fond clair, blanc sur fond sombre) et --on-acc celle du texte posé dessus.
 */
/* ===== Thèmes Casa Besports : variables centralisées ===== */
[data-cb-theme="light"], [data-cb-theme="auto"], .cb-scope-light {
  color-scheme: light;
  --bg: #ffffff; --surface: #ffffff; --surface-2: #f2f2f2; --surface-3: #f7f7f7; --sand: #e9e9e9;
  --ink: #000000; --text: #121212; --text-2: #3b3b3b; --muted: #595959; --muted-2: #696969;
  --line: #e0e0e0; --line-2: #c2c2c2; --gold-text: #000000;
  --inv-bg: #000000; --inv-bg-2: #161616; --inv-line: #2e2e2e; --on-inv: #ffffff; --on-inv-2: #c4c4c4; --gold-on-inv: #ffffff;
  --acc: #000000; --on-acc: #ffffff; --success: #0d7a3e; --danger: #c8102e;
  --note-bg: #f2f2f2; --note-line: #d4d4d4; --note-fg: #1a1a1a; --danger-bg: #fff0f1; --danger-line: #f2c4ca;
  --glass: rgba(255,255,255,.96); --overlay: rgba(0,0,0,.5); --shadow: rgba(0,0,0,.35);
  --reader-bg: #000000; --place-filter: grayscale(1); --place-op: 1; --img-filter: none;
  --font-body: 'Mulish', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
[data-cb-theme="dark"] {
  color-scheme: dark;
  --bg: #0b0b0b; --surface: #141414; --surface-2: #1d1d1d; --surface-3: #181818; --sand: #262626;
  --ink: #ffffff; --text: #ededed; --text-2: #c4c4c4; --muted: #a0a0a0; --muted-2: #8d8d8d;
  --line: #272727; --line-2: #3b3b3b; --gold-text: #ffffff;
  --inv-bg: #ffffff; --inv-bg-2: #1d1d1d; --inv-line: #3b3b3b; --on-inv: #000000; --on-inv-2: #3d3d3d; --gold-on-inv: #000000;
  --acc: #ffffff; --on-acc: #000000; --success: #4ade80; --danger: #ff6b7a;
  --note-bg: #1d1d1d; --note-line: #333333; --note-fg: #ededed; --danger-bg: #3a1a20; --danger-line: #6b2a33;

  --acc: #ffffff; --on-acc: #000000; --success: #5ee69a; --danger: #ff7a86;
  --note-bg: #161616; --note-line: #3a3a3a; --note-fg: #ffffff; --danger-bg: #2c1316; --danger-line: #5b2a30;
  --glass: rgba(0,0,0,.96); --overlay: rgba(0,0,0,.7); --shadow: rgba(0,0,0,.85);
  --reader-bg: #000000; --place-filter: grayscale(1) brightness(.42) contrast(1.2); --place-op: .75; --img-filter: none;
  --font-body: 'Mulish', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
[data-cb-theme="paper"] {
  color-scheme: light;
  --bg: #f1eee7; --surface: #f8f6f1; --surface-2: #e7e3d9; --surface-3: #efebe3; --sand: #dfd9cc;
  --ink: #111111; --text: #1c1c1a; --text-2: #45433d; --muted: #5e5b53; --muted-2: #6b6860;
  --line: #d6d0c4; --line-2: #bdb6a7; --gold-text: #111111;
  --inv-bg: #111111; --inv-bg-2: #2a2926; --inv-line: #46443f; --on-inv: #f8f6f1; --on-inv-2: #cfc9bd; --gold-on-inv: #f8f6f1;
  --acc: #111111; --on-acc: #f8f6f1; --success: #2f6b4f; --danger: #9b2b25;

  --reader-bg: #1c1c1a; --place-filter: grayscale(1) sepia(.2); --place-op: 1; --img-filter: grayscale(.15);
  --font-body: Georgia, 'Times New Roman', serif;
}
@media (prefers-color-scheme: dark) {
  [data-cb-theme="auto"] {
    color-scheme: dark;
    --bg: #0b0b0b; --surface: #141414; --surface-2: #1d1d1d; --surface-3: #181818; --sand: #262626;

    --line: #272727; --line-2: #3b3b3b; --gold-text: #ffffff;
    --inv-bg: #ffffff; --inv-bg-2: #1d1d1d; --inv-line: #3b3b3b; --on-inv: #000000; --on-inv-2: #3d3d3d; --gold-on-inv: #000000;
    --acc: #ffffff; --on-acc: #000000; --success: #4ade80; --danger: #ff6b7a;
    --note-bg: #1d1d1d; --note-line: #333333; --note-fg: #ededed; --danger-bg: #3a1a20; --danger-line: #6b2a33;

    --reader-bg: #000000; --place-filter: grayscale(1) brightness(.5) contrast(1.1); --place-op: .7; --img-filter: brightness(.94);
  }
}
/* La page de magazine et les vignettes produits restent sur papier clair, quel que soit le thème */
.cb-scope-light { color: var(--text); }
html[data-cb-theme], body { background: var(--bg, #ffffff); }
.cb-theming, .cb-theming * { transition: background-color .3s ease, color .3s ease, border-color .3s ease, fill .3s ease, box-shadow .3s ease !important; }
@media (prefers-reduced-motion: reduce) { .cb-theming, .cb-theming * { transition: none !important; } }
:focus-visible { outline: 3px solid var(--ink, #000000); outline-offset: 2px; }
::placeholder { color: var(--muted-2); opacity: 1; }
/* Blocs « profonds » (pied de page, panneaux premium, en-tête de l’assistant…) : toujours noirs, comme le bandeau du logo */
.cb-deep { --inv-bg: #000000; --inv-bg-2: #161616; --inv-line: #2e2e2e; --on-inv: #ffffff; --on-inv-2: #c4c4c4; --gold-on-inv: #ffffff; --acc: #ffffff; --on-acc: #000000; }
[data-cb-theme="dark"] .cb-deep, [data-cb-theme="noir"] .cb-deep { --inv-bg: #000000; --inv-bg-2: #171717; --inv-line: #2e2e2e; --on-inv: #ffffff; --on-inv-2: #c4c4c4; --gold-on-inv: #ffffff; }
[data-cb-theme="paper"] .cb-deep { --inv-bg: #111111; --inv-bg-2: #2a2926; --inv-line: #46443f; --on-inv: #f8f6f1; --on-inv-2: #cfc9bd; --gold-on-inv: #f8f6f1; --acc: #f8f6f1; --on-acc: #111111; }
@media (prefers-color-scheme: dark) {
  [data-cb-theme="auto"] .cb-deep { --inv-bg: #000000; --inv-bg-2: #171717; --inv-line: #2e2e2e; --on-inv: #ffffff; --on-inv-2: #c4c4c4; --gold-on-inv: #ffffff; }
}

<style>
/* Casa Besports — styles globaux (utilisent les variables de theme.css) */
body{margin:0;background:var(--bg)}
a{color:var(--text)}a:hover{color:var(--gold-text)}
*{box-sizing:border-box}
button{font-family:inherit}
.wrap{max-width:1280px;margin:0 auto;padding-left:1.5rem;padding-right:1.5rem}
.eb{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:15px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold-text)}
.h1{font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;font-size:clamp(2.6rem,5.6vw,5.2rem);line-height:.98;letter-spacing:-.02em;margin:0;color:var(--ink)}
.h2{font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;font-size:clamp(2rem,4vw,3.2rem);line-height:1;margin:0;color:var(--ink)}
.ttl{font-family:'Cormorant Garamond',Georgia,serif;font-weight:700;line-height:1.08;color:var(--ink)}
.cond{font-family:'Barlow Condensed',sans-serif;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
.num{font-family:'Barlow Condensed',sans-serif;font-weight:700;letter-spacing:0;font-variant-numeric:tabular-nums}
.btn{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:17px;letter-spacing:.08em;text-transform:uppercase;min-height:48px;padding:0 1.35rem;border-radius:2px;border:0;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:.55rem;text-decoration:none}
.btn-gold{background:var(--acc);color:#080f1a}.btn-gold:hover{filter:brightness(1.06);color:#080f1a}.btn:active{transform:translateY(1px)}.btn:disabled,.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn-dark{background:var(--inv-bg);color:var(--on-inv)}.btn-dark:hover{filter:brightness(1.18);color:var(--on-inv)}
.btn-ghost{background:var(--surface);color:var(--ink);border:1.5px solid var(--ink)}.btn-ghost:hover{background:var(--surface-2);color:var(--ink)}
.lnk{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:17px;letter-spacing:.08em;text-transform:uppercase;background:none;border:0;border-bottom:2px solid var(--acc);padding:.2rem 0 .3rem;cursor:pointer;color:var(--ink);text-decoration:none;min-height:44px}
.chip{font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:16px;letter-spacing:.06em;text-transform:uppercase;min-height:44px;padding:0 1.05rem;border-radius:999px;cursor:pointer}
.card{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:4px;overflow:hidden;transition:transform .25s ease,box-shadow .25s ease}
.card:hover{transform:translateY(-4px);box-shadow:0 18px 40px -18px rgba(8,15,26,.35)}
.card:hover .zimg{transform:scale(1.04)}
.zimg{filter:var(--img-filter);transition:transform .6s ease;width:100%;height:100%;object-fit:cover;display:block}
.hit{display:flex;flex-direction:column;width:100%;height:100%;text-align:left;background:none;border:0;padding:0;cursor:pointer;color:var(--text)}
.mark{position:absolute;top:10px;right:10px;width:44px;height:44px;border-radius:50%;border:0;cursor:pointer;display:flex;align-items:center;justify-content:center;background:var(--glass);box-shadow:0 4px 14px rgba(8,15,26,.2)}
.grid3{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:1.6rem}
.grid4{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,220px),1fr));gap:1.25rem}
.veilL{background:linear-gradient(90deg,var(--bg) 0%,var(--bg) 38%,color-mix(in srgb,var(--bg) 75%,transparent) 55%,transparent 80%)}
.veilB{background:linear-gradient(0deg,rgba(8,15,26,.88) 0%,rgba(8,15,26,.2) 60%,rgba(8,15,26,0) 100%)}
.field{min-height:48px;border:1.5px solid var(--line-2);border-radius:2px;padding:0 .9rem;font-family:inherit;font-size:15px;color:var(--text);background:var(--surface);width:100%}
.field:focus{border-color:var(--acc);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 30%,transparent)}
.field:disabled{opacity:.65}
.lbl{font-size:13px;font-weight:700;color:var(--text-2);display:flex;flex-direction:column;gap:.35rem}
.crumb{background:none;border:0;padding:.5rem 0;cursor:pointer;color:var(--muted);font-size:14px;font-weight:600;min-height:44px}
.crumb:hover{color:var(--gold-text)}
.navb{font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:17px;letter-spacing:.07em;text-transform:uppercase;background:none;border:0;padding:.75rem .6rem;cursor:pointer;min-height:44px;white-space:nowrap}
@media (max-width:1360px){.navb{font-size:16px;padding:.75rem .45rem}}
.dot{position:absolute;transform:translate(-50%,-50%);border-radius:50%;border:2px solid var(--surface);cursor:pointer;box-shadow:0 4px 12px rgba(8,15,26,.3);display:flex;align-items:center;justify-content:center;font-family:'Barlow Condensed',sans-serif;font-weight:700}
.tbl{width:100%;border-collapse:collapse;font-size:15px}
.tbl th{font-family:'Barlow Condensed',sans-serif;font-weight:700;letter-spacing:.1em;text-transform:uppercase;font-size:13px;color:var(--muted);text-align:center;padding:.7rem .5rem;border-bottom:2px solid var(--ink)}
.tbl td{padding:.75rem .5rem;border-bottom:1px solid var(--line);text-align:center;color:var(--text);font-variant-numeric:tabular-nums}
.tbl tr:hover td{background:var(--surface-3)}
.tile{position:relative;overflow:hidden;border-radius:4px;text-align:left;cursor:pointer;border:0;padding:1.5rem;display:flex;flex-direction:column;justify-content:flex-end;min-height:220px;transition:transform .25s ease,box-shadow .25s ease}
.tile:hover{transform:translateY(-4px);box-shadow:0 18px 40px -18px rgba(8,15,26,.45)}
.run{animation:cbrun 40s linear forwards}
@keyframes cbrun{from{width:0}to{width:100%}}
.pulse{animation:cbpulse 1.6s ease-in-out infinite}
@keyframes cbpulse{0%,100%{opacity:1}50%{opacity:.35}}
.nav{display:flex}.burger{display:none}
@media (max-width:1060px){.nav{display:none}.burger{display:inline-flex}.hidesm{display:none !important}.veilL{background:linear-gradient(180deg,color-mix(in srgb,var(--bg) 55%,transparent) 0%,var(--bg) 70%)}}
@media (prefers-reduced-motion:reduce){.pulse,.run,.float-in{animation:none}html{scroll-behavior:auto}}
html{scroll-behavior:smooth}
.fab{position:fixed;z-index:50;border:0;cursor:pointer;box-shadow:0 14px 34px -10px rgba(8,15,26,.45);transition:transform .2s ease}
.fab:hover{transform:translateY(-2px)}
.float-in{animation:cbfloat .5s ease both}
@keyframes cbfloat{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.glass{background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.md p{margin:0 0 1.1em}.studio-in{font-family:inherit;font-size:15px;color:var(--text)}

@media (max-width:520px){.logo-mark{width:104px !important;height:45px !important}.logo-txt{font-size:22px !important}.logo-dot{font-size:26px !important}.hdr-ico{width:40px !important;height:40px !important}.hide-xs{display:none !important}.hdr-in{padding:0 .6rem !important;gap:.4rem !important}.thm-pop{position:fixed !important;left:12px !important;right:12px !important;top:84px !important;width:auto !important}}

.bento{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-auto-rows:minmax(190px,auto);gap:1rem}
.bento-item{min-width:0;display:flex}
.bento-item>*{flex:1;min-width:0}
.s2{grid-column:span 2}.r2{grid-row:span 2}
.b-card{position:relative;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:1.1rem 1.2rem;overflow:hidden;display:flex;flex-direction:column;color:var(--text);box-shadow:0 14px 34px -28px var(--shadow);font:inherit;transition:transform .25s ease,box-shadow .25s ease}
button.b-card{cursor:pointer}
button.b-card:hover{transform:translateY(-3px);box-shadow:0 20px 40px -26px var(--shadow)}
.b-img{min-height:260px;border:0}
.b-img:hover .zimg{transform:scale(1.04)}
.b-head{display:flex;justify-content:space-between;align-items:center;gap:.5rem;margin-bottom:.75rem}
.b-head .cond{font-size:13px}
.b-more{background:none;border:0;cursor:pointer;color:var(--muted);font-weight:700;font-size:13px;min-height:32px;padding:0;font-family:inherit}
.b-more:hover{color:var(--gold-text)}
.tabbar{display:none}
@media (max-width:1060px){.bento{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:640px){.bento{grid-template-columns:1fr;grid-auto-rows:auto}.s2{grid-column:span 1}.r2{grid-row:span 1}.b-img{min-height:320px}}
@media (max-width:760px){.tabbar{display:flex;position:fixed;left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom,0px));z-index:45;border:1px solid var(--line);border-radius:18px;box-shadow:0 16px 40px -18px var(--shadow);padding:2px 4px}.lift16{bottom:88px !important}.lift22{bottom:94px !important}.lift90{bottom:160px !important}.cb-root{padding-bottom:86px}}
@media (prefers-reduced-motion:reduce){.b-card{transition:none}button.b-card:hover{transform:none}}

.pv-btn{display:flex;align-items:center;gap:.6rem;width:100%;text-align:left;min-height:42px;padding:0 .6rem;border-radius:10px;border:0;cursor:pointer;font-weight:700;font-size:14px;font-family:inherit}
.pv-btn:hover{filter:brightness(.97)}
@media (max-width:860px){.pv-side{position:static !important;max-width:none !important;flex:1 1 100% !important;display:flex;gap:.3rem;overflow-x:auto;padding:.4rem !important}.pv-group{display:contents}.pv-gh{display:none}.pv-btn{flex:none;width:auto;white-space:nowrap}}
/* ===== La Gazette du Cotentin : la liseuse, édition « Le bandeau » =====
 * Le journal prend la direction artistique du site : noir et blanc, capitales League Spartan posées sur des bandeaux,
 * coins droits, filets francs ; le texte courant reste en Source Serif pour le confort de lecture.
 * La page est un objet imprimé : papier blanc et encre noire dans tous les thèmes, sur un bureau noir.
 * Une seule page passe en négatif : « Le détail choc 🔥 ». */
.gz-desk{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;background:#0b0b0b;color:#fff;font-family:var(--bn-font)}
.gz-bar{display:flex;align-items:center;gap:.45rem;flex-wrap:wrap;padding:.5rem .75rem;padding-top:calc(.5rem + env(safe-area-inset-top,0px));background:#000;border-bottom:1px solid #2e2e2e}
.gz-mast{font-family:var(--bn-font);font-weight:800;font-size:18px;line-height:1;letter-spacing:-.02em;text-transform:uppercase;color:#fff;white-space:nowrap}
.gz-mast span{font-weight:600;color:#bdbdbd}
.gz-folio{font-family:var(--bn-font);font-weight:600;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#9a9a9a;white-space:nowrap}
.gz-sp{flex:1}
.gz-tool{min-height:40px;padding:0 .8rem;border:1px solid #4a4a4a;border-radius:0;background:transparent;color:#fff;cursor:pointer;font-family:var(--bn-font);font-weight:700;font-size:13.5px;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.gz-tool:hover{border-color:#fff}
.gz-tool-choc{background:#fff;color:#000;border-color:#fff}
.gz-tool-choc:hover{background:#e6e6e6}
.gz-x{width:42px;padding:0;font-size:22px;line-height:1}
.gz-tool-aa{text-transform:none;letter-spacing:.02em}
.gz-prog{height:3px;background:#222;flex:none}
.gz-prog>div{height:3px;background:#fff;transition:width .25s ease}
.gz-scroll{flex:1;overflow-y:auto;padding:1.25rem .75rem 2rem;display:flex;justify-content:center;align-items:flex-start;-webkit-overflow-scrolling:touch}

/* ---------- la page ---------- */
.gz-page{--gz-ink:#0a0a0a;--gz-paper:#ffffff;--gz-mut:#555555;--gz-rule:#0a0a0a;--gz-hair:#d4d4d4;--gz-tint:#f1f1f1;
  width:100%;max-width:860px;min-height:min(1200px,calc((100vw - 1.5rem)*1.414));background:var(--gz-paper);color:var(--gz-ink);
  padding:clamp(1rem,4.6vw,2.9rem);font-family:'Source Serif 4',Georgia,serif;line-height:1.55;display:flex;flex-direction:column;position:relative}
.gz-page.is-noir{--gz-ink:#ffffff;--gz-paper:#000000;--gz-mut:#bdbdbd;--gz-rule:#ffffff;--gz-hair:#3a3a3a;--gz-tint:#151515;outline:1px solid #2e2e2e}
.gz-band{background:var(--gz-ink);color:var(--gz-paper);padding:.08em .22em 0;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.gz-run{display:flex;justify-content:space-between;gap:1em;align-items:baseline;font-family:var(--bn-font);font-weight:700;font-size:.62em;letter-spacing:.16em;text-transform:uppercase;padding-bottom:.6em;border-bottom:4px solid var(--gz-rule);margin-bottom:1.15em}
.gz-rubline{display:flex;flex-wrap:wrap;align-items:center;gap:.45em .8em;margin-bottom:.75em}
.gz-etiq{display:inline-block;font-family:var(--bn-font);font-weight:700;font-size:.64em;line-height:1;letter-spacing:.12em;text-transform:uppercase;background:var(--gz-ink);color:var(--gz-paper);padding:.45em .6em .32em}
.gz-sub{font-style:italic;color:var(--gz-mut);font-size:1.02em;line-height:1.3}
.gz-h{font-family:var(--bn-font);font-weight:800;text-transform:uppercase;letter-spacing:-.035em;line-height:1.13;font-size:clamp(1.85em,5.4vw,3.05em);margin:0 0 .8em;text-wrap:balance;overflow-wrap:break-word}
.gz-h3{font-family:var(--bn-font);font-weight:800;text-transform:uppercase;letter-spacing:-.03em;line-height:1.08;font-size:1.9em;margin:0 0 .35em;text-wrap:balance}
.gz-k{display:block;font-family:var(--bn-font);font-weight:800;text-transform:uppercase;letter-spacing:-.01em;line-height:1.12;font-size:1em;margin-bottom:.3em;text-wrap:balance}
.gz-kick{display:block;font-family:var(--bn-font);font-weight:700;font-size:.62em;letter-spacing:.14em;text-transform:uppercase;color:var(--gz-mut);margin:.35em 0}
.gz-lead{font-weight:600;font-size:1.18em;line-height:1.45;margin:0 0 1em}
.gz-txt{line-height:1.6;margin:0 0 .8em}
.gz-small{display:block;font-size:.8em;line-height:1.45;color:var(--gz-mut)}
.gz-cols{column-width:15em;column-gap:1.8em;column-rule:1px solid var(--gz-hair);line-height:1.62}
.gz-cols p{margin:0 0 .85em;text-align:justify;hyphens:auto;-webkit-hyphens:auto}
.gz-drop p:first-child::first-letter{float:left;font-family:var(--bn-font);font-weight:800;font-size:3.3em;line-height:.82;padding:.12em .14em .02em;margin:.05em .14em 0 0;background:var(--gz-ink);color:var(--gz-paper)}
.gz-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:1.4em;margin-bottom:1.2em;align-items:start}
.gz-g-16{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.gz-g-114{grid-template-columns:minmax(0,1fr) minmax(0,1.4fr)}
.gz-g-24{grid-template-columns:minmax(0,2.4fr) minmax(0,1fr)}
.gz-g-1115{grid-template-columns:minmax(0,1fr) minmax(0,1.15fr)}
.gz-g-15{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);align-items:center}
.gz-grid.is-wide{grid-template-columns:minmax(0,1fr);gap:.1em}
.gz-grid.is-wide .gz-lead{font-size:1.28em;max-width:36em}
.gz-grid.is-wide .gz-fig img{aspect-ratio:16/9}
.gz-fig{margin:0;min-width:0}
.gz-fig img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;background:#e9e9e9}
.gz-fig figcaption{display:flex;gap:.5em;align-items:center;font-family:var(--bn-font);font-weight:600;font-size:.6em;letter-spacing:.12em;text-transform:uppercase;color:var(--gz-mut);padding-top:.6em;line-height:1.3}
.gz-fig figcaption::before{content:'';width:.75em;height:.75em;background:var(--gz-ink);flex:none}
.gz-cadre{border:2px solid var(--gz-ink);padding:.45em .45em .1em}
.gz-wide{margin-bottom:1em}
.gz-quote{margin:1.1em 0;font-family:var(--bn-font);font-weight:800;text-transform:uppercase;letter-spacing:-.025em;line-height:1.22;font-size:1.6em;text-wrap:balance}
.gz-quote cite{display:block;margin-top:.75em;font-style:normal;font-weight:600;font-size:.4em;letter-spacing:.14em;color:var(--gz-mut)}
.gz-quote-sm{font-size:1.3em;margin:.6em 0}
.gz-card{display:block;background:var(--gz-ink);color:var(--gz-paper);padding:1em 1.15em;margin:1em 0;line-height:1.5}
.gz-three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1.2em;margin-top:1.2em}
.gz-three>div{display:flex;flex-direction:column;align-items:flex-start;gap:.15em;border-top:4px solid var(--gz-rule);padding-top:.6em;line-height:1.5;min-width:0}
.gz-trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.9em;margin:.4em 0 1.2em}
.gz-foot{margin-top:auto;padding-top:1.6em;display:flex;justify-content:space-between;align-items:flex-end;gap:1em}
.gz-foot-l{font-family:var(--bn-font);font-weight:700;font-size:.6em;letter-spacing:.14em;text-transform:uppercase;color:var(--gz-mut);border-top:1px solid var(--gz-hair);padding-top:.8em;flex:1}
.gz-pn{font-family:var(--bn-font);font-weight:800;font-size:1.05em;line-height:1;background:var(--gz-ink);color:var(--gz-paper);min-width:2.3em;padding:.45em .45em .3em;text-align:center}
.gz-lbl{display:inline-block;font-family:var(--bn-font);font-weight:700;font-size:.6em;line-height:1;letter-spacing:.12em;text-transform:uppercase;background:var(--gz-ink);color:var(--gz-paper);padding:.4em .55em .28em}
.gz-src{font-family:var(--bn-font);font-weight:600;font-size:.6em;letter-spacing:.1em;text-transform:uppercase;color:var(--gz-mut);border-top:1px solid var(--gz-hair);padding-top:.8em;margin:1.2em 0 0;line-height:1.5}
.gz-note{font-family:var(--bn-font);font-weight:700;font-size:.95em;line-height:1.4;border-left:6px solid var(--gz-ink);padding:.15em 0 .15em .7em;margin:1.2em 0 0}
.gz-note-big{font-weight:800;text-transform:uppercase;font-size:1.25em;line-height:1.15;margin:0}

/* ---------- couverture ---------- */
.gz-cv-head{display:flex;justify-content:space-between;align-items:flex-start;gap:1em}
.gz-cv-mast{font-family:var(--bn-font);font-weight:800;text-transform:uppercase;letter-spacing:-.045em;line-height:1.12;font-size:clamp(2.5em,9.4vw,4.7em);margin:0}
.gz-cv-side{font-family:var(--bn-font);font-weight:700;text-transform:uppercase;letter-spacing:.12em;font-size:.66em;line-height:1.55;text-align:right;padding-top:.4em;flex:none}
.gz-cv-folio{display:flex;flex-wrap:wrap;justify-content:space-between;gap:.25em 1em;border-top:4px solid var(--gz-rule);border-bottom:1px solid var(--gz-rule);padding:.55em 0 .45em;margin:1em 0 1.2em;font-family:var(--bn-font);font-weight:700;font-size:.62em;letter-spacing:.14em;text-transform:uppercase}
.gz-cv-t{font-family:var(--bn-font);font-weight:800;text-transform:uppercase;letter-spacing:-.035em;line-height:1.13;font-size:clamp(1.8em,5.2vw,2.9em);margin:.45em 0 .25em;text-wrap:balance}
.gz-cv-s{font-style:italic;font-size:1.12em;color:var(--gz-mut);margin:0 0 .9em}
.gz-cv-fig{position:relative}
.gz-cv-fig img{aspect-ratio:3/2}
.gz-sticker{position:absolute;top:.8em;right:.8em;max-width:14em;display:flex;flex-direction:column;align-items:flex-start;gap:.3em;text-align:left;background:#000;color:#fff;border:2px solid #fff;padding:.75em .85em .8em;cursor:pointer;font:inherit}
.gz-sticker:hover{background:#151515}
.gz-sticker-l{font-family:var(--bn-font);font-weight:800;font-size:.74em;letter-spacing:.1em;text-transform:uppercase}
.gz-sticker-t{font-family:var(--bn-font);font-weight:700;font-size:1.02em;line-height:1.2;letter-spacing:-.01em}
.gz-sticker-p{font-family:var(--bn-font);font-weight:700;font-size:.62em;letter-spacing:.12em;text-transform:uppercase;color:#cfcfcf}
.gz-strip{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:4px solid var(--gz-rule);margin-top:1.2em}
.gz-strip-it{display:flex;flex-direction:column;align-items:flex-start;gap:.3em;text-align:left;background:none;border:0;border-bottom:1px solid var(--gz-hair);padding:.75em .9em .85em 0;cursor:pointer;font:inherit;color:inherit;min-width:0}
.gz-strip-it:hover .gz-strip-t{text-decoration:underline;text-underline-offset:3px}
.gz-strip-r{font-family:var(--bn-font);font-weight:700;font-size:.6em;letter-spacing:.12em;text-transform:uppercase;color:var(--gz-mut)}
.gz-strip-t{font-family:var(--bn-font);font-weight:800;text-transform:uppercase;letter-spacing:-.015em;line-height:1.1;font-size:.98em}
.gz-strip-p{margin-top:auto;font-family:var(--bn-font);font-weight:700;font-size:.6em;letter-spacing:.12em}

/* ---------- sommaire ---------- */
.gz-toc{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1.4em 2.2em;align-items:start}
.gz-toc-h{font-family:var(--bn-font);font-weight:800;text-transform:uppercase;letter-spacing:-.02em;font-size:1.25em;line-height:1.15;margin:0 0 .55em}
.gz-toc-it{display:grid;grid-template-columns:2.5em minmax(0,1fr) 3.8em;gap:.75em;align-items:center;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--gz-hair);padding:.5em 0;cursor:pointer;color:inherit;font:inherit}
.gz-toc-it:hover .gz-toc-t{text-decoration:underline;text-underline-offset:3px}
.gz-toc-n{font-family:var(--bn-font);font-weight:800;font-size:.95em;background:var(--gz-ink);color:var(--gz-paper);text-align:center;padding:.4em 0 .25em}
.gz-toc-x{min-width:0}
.gz-toc-r{display:block;font-family:var(--bn-font);font-weight:700;font-size:.58em;letter-spacing:.12em;text-transform:uppercase;color:var(--gz-mut)}
.gz-toc-t{display:block;font-family:var(--bn-font);font-weight:700;font-size:.98em;line-height:1.18}
.gz-toc-im{display:block;width:3.8em;height:2.8em;object-fit:cover}
.gz-toc-g{display:flex;align-items:center;justify-content:center;background:var(--gz-ink);color:var(--gz-paper);font-family:var(--bn-font);font-weight:800}

/* ---------- scores, brèves ---------- */
.gz-score{display:flex;align-items:center;justify-content:center;gap:.7em;flex-wrap:wrap;background:var(--gz-ink);color:var(--gz-paper);padding:.75em 1em;margin:0 0 .5em}
.gz-team{font-family:var(--bn-font);font-weight:700;text-transform:uppercase;letter-spacing:.02em;font-size:.95em}
.gz-sc{font-family:var(--bn-font);font-weight:800;font-size:2em;line-height:1;letter-spacing:-.02em;white-space:nowrap}
.gz-crest{display:inline-flex;align-items:center;justify-content:center;width:2.4em;height:2.4em;border:2px solid currentColor;font-family:var(--bn-font);font-weight:800;font-size:.78em}
.gz-score-sm{justify-content:flex-start;padding:.4em .65em;margin:.55em 0 0;font-size:.85em;gap:.55em}
.gz-score-sm .gz-sc{font-size:1.35em}
.gz-cap{font-family:var(--bn-font);font-weight:600;font-size:.6em;letter-spacing:.12em;text-transform:uppercase;color:var(--gz-mut);text-align:center;margin:0 0 1em}
.gz-br{display:flex;flex-direction:column;gap:1em;min-width:0}
.gz-br-it{display:grid;grid-template-columns:6.5em minmax(0,1fr);gap:.85em;border-top:3px solid var(--gz-rule);padding-top:.65em}
.gz-br-it img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}
.gz-br-t{font-size:1.1em;margin:.4em 0 .25em}
.gz-br-x{display:block;line-height:1.5}
.gz-retenir{background:var(--gz-ink);color:var(--gz-paper);padding:1.1em 1.2em}
.gz-retenir-h{font-family:var(--bn-font);font-weight:800;text-transform:uppercase;letter-spacing:-.03em;font-size:1.8em;line-height:1;margin-bottom:.3em}
.gz-retenir-it{display:flex;gap:.75em;padding:.75em 0;border-bottom:1px solid rgba(255,255,255,.22)}
.gz-retenir-t{display:block;font-size:.93em;line-height:1.45;margin-top:.15em}
.gz-retenir-s{font-family:var(--bn-font);font-weight:700;font-size:.66em;letter-spacing:.14em;text-transform:uppercase;margin-top:.9em;opacity:.8}
.gz-dot{display:inline-flex;align-items:center;justify-content:center;width:1.9em;height:1.9em;background:var(--gz-paper);color:var(--gz-ink);font-family:var(--bn-font);font-weight:800;flex:none}

/* ---------- le détail choc 🔥 : la page noire et l’encadré ---------- */
.gz-ch-top{display:flex;align-items:center;gap:.7em;margin:-.2em 0 .3em}
.gz-ch-flame{font-size:3.6em;line-height:1}
.gz-ch-ver{font-family:var(--bn-font);font-weight:700;font-size:.66em;letter-spacing:.14em;text-transform:uppercase;line-height:1.5;color:var(--gz-mut)}
.gz-ch-big{font-family:var(--bn-font);font-weight:800;text-transform:uppercase;letter-spacing:-.035em;line-height:1.1;font-size:clamp(1.8em,5.6vw,3.2em);margin:.15em 0 .55em;text-wrap:balance}
.gz-ch-who{font-family:var(--bn-font);font-weight:700;letter-spacing:.12em;text-transform:uppercase;font-size:.68em;color:var(--gz-mut);margin-bottom:1.2em}
.gz-ch-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:4px solid var(--gz-rule);border-bottom:1px solid var(--gz-hair);margin-bottom:1.4em}
.gz-ch-st{padding:.75em .8em .85em 0;min-width:0}
.gz-ch-st+.gz-ch-st{border-left:1px solid var(--gz-hair);padding-left:.8em}
.gz-ch-k{display:block;font-family:var(--bn-font);font-weight:800;font-size:2.2em;line-height:1;letter-spacing:-.03em;white-space:nowrap}
.gz-ch-l{display:block;font-size:.84em;line-height:1.35;margin-top:.35em;color:var(--gz-mut)}
.gz-ch-grid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:1.6em;align-items:start}
.gz-ch-aside{border:2px solid var(--gz-ink);padding:1em 1.05em}
.gz-ch-aside p{margin:.55em 0 1.1em;line-height:1.5}
.gz-ch-aside p:last-child{margin-bottom:0}
.gz-choc{display:grid;grid-template-columns:auto minmax(0,1fr);gap:.8em;align-items:start;background:#000;color:#fff;padding:1em 1.15em 1.05em;margin:1.4em 0 .2em}
.gz-choc-f{font-size:2.1em;line-height:1}
.gz-choc-l{display:block;font-family:var(--bn-font);font-weight:800;font-size:.7em;letter-spacing:.12em;text-transform:uppercase;color:#cfcfcf}
.gz-choc-t{margin:.3em 0 0;font-family:var(--bn-font);font-weight:700;font-size:1.12em;line-height:1.3;letter-spacing:-.01em}
.gz-choc-src{display:block;margin-top:.6em;font-family:var(--bn-font);font-weight:600;font-size:.58em;letter-spacing:.1em;text-transform:uppercase;color:#a8a8a8;line-height:1.5}
.gz-choc-go{margin-top:.75em;min-height:40px;padding:0 .9em;border:2px solid #fff;background:#fff;color:#000;cursor:pointer;font-family:var(--bn-font);font-weight:700;font-size:.82em;letter-spacing:.04em}
.gz-choc-go:hover{background:#000;color:#fff}

/* ---------- vestiaire, chiffre, histoire, portrait ---------- */
.gz-who{font-family:var(--bn-font);font-weight:800;text-transform:uppercase;letter-spacing:-.03em;line-height:1.05;font-size:2em;margin:.1em 0}
.gz-idcard{border:2px solid var(--gz-ink);padding:.8em 1em;margin-top:1em}
.gz-idrow{display:grid;grid-template-columns:8em minmax(0,1fr);gap:.6em;padding:.45em 0;border-bottom:1px solid var(--gz-hair);align-items:baseline}
.gz-idrow:last-child{border-bottom:0}
.gz-idk{font-family:var(--bn-font);font-weight:700;font-size:.62em;letter-spacing:.12em;text-transform:uppercase;color:var(--gz-mut)}
.gz-idv{font-family:var(--bn-font);font-weight:700}
.gz-qa{display:flex;flex-direction:column;gap:1.3em;min-width:0}
.gz-qa-it{display:grid;grid-template-columns:auto minmax(0,1fr);gap:.85em}
.gz-qa-it p{margin:.35em 0 0;line-height:1.55}
.gz-qn{font-family:var(--bn-font);font-weight:800;font-size:2.4em;line-height:1;background:var(--gz-ink);color:var(--gz-paper);width:1.2em;text-align:center;padding:.12em 0 0;align-self:start}
.gz-bignum{font-family:var(--bn-font);font-weight:800;font-size:min(12em,34vw);line-height:.8;letter-spacing:-.06em;margin:.02em 0 .12em}
.gz-bignum-l{font-family:var(--bn-font);font-weight:800;text-transform:uppercase;letter-spacing:-.02em;font-size:1.5em;line-height:1.18;margin:0 0 1.2em}
.gz-enbref{border:2px solid var(--gz-ink);padding:.9em 1em}
.gz-enbref-h{font-size:1.35em}

/*!
 * Casa Besports — « Le bandeau » : la direction artistique tirée du logo.

.btn-dark:hover { filter: none; color: var(--on-inv); background: color-mix(in srgb, var(--inv-bg) 82%, var(--on-inv)); }
.btn-ghost { background: transparent; color: var(--ink); border: 2px solid var(--ink); }
.btn-ghost:hover { background: var(--ink); color: var(--bg); }
.bn-scope .btn-ghost:hover { color: var(--bn-noir); }
.lnk { font-family: var(--bn-font); letter-spacing: .03em; border-bottom-width: 3px; }
.chip { font-family: var(--bn-font); font-weight: 600; letter-spacing: .03em; border-radius: 0; }
.navb { font-family: var(--bn-font); font-weight: 600; letter-spacing: .04em; font-size: 15.5px; }
@media (max-width: 1360px) { .navb { font-size: 14.5px; } }
.field { border-radius: 0; }

:focus-visible { outline-color: var(--ink); }

/* ---------- Surfaces : coins droits, filets francs, pas d’ombre portée ---------- */
.card { border-radius: 0; border: 1px solid var(--line); }
.card:hover { transform: none; box-shadow: none; border-color: var(--ink); }
.b-card { border-radius: 0; border: 1px solid var(--line); box-shadow: none; }
button.b-card:hover { transform: none; box-shadow: none; border-color: var(--ink); }
.tile, .mark, .thm-opt, .thm-sw, .pv-btn { border-radius: 0; }
/* Choix du thème (Mon espace › Paramètres › Apparence) : vignettes d’aperçu */
.thm-opt { display: flex; flex-direction: column; align-items: flex-start; gap: .55rem; width: 100%; text-align: left; padding: .7rem; background: var(--surface); color: var(--text); border: 1.5px solid var(--line); cursor: pointer; font: inherit; transition: border-color .2s ease; }
.thm-opt:hover { border-color: var(--line-2); }
.thm-opt[aria-checked="true"] { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }

@media (max-width: 520px) { .thm-sw { max-height: 96px; } }
.tile:hover { transform: none; box-shadow: none; }
.glass { background: var(--surface); -webkit-backdrop-filter: none; backdrop-filter: none; }
.fab { box-shadow: none; }
.cb-bgp { filter: blur(3px) grayscale(1) !important; } /* photos de fond en noir et blanc */
.veilB { background: linear-gradient(0deg, rgba(0, 0, 0, .9) 0%, rgba(0, 0, 0, .25) 60%, rgba(0, 0, 0, 0) 100%); }

/* ---------- Étiquette : le bandeau en petit ---------- */
.bn-etiq { display: inline-flex; align-items: center; gap: .45em; align-self: flex-start; font-family: var(--bn-font); font-weight: 700; font-size: 12.5px; letter-spacing: .08em; text-transform: uppercase; line-height: 1; padding: .55em .75em .4em; background: var(--ink); color: var(--bg); }
.bn-etiq.inv, .bn-scope .bn-etiq { background: var(--bn-blanc); color: var(--bn-noir); }
.bn-etiq.noir { background: var(--bn-noir); color: var(--bn-blanc); }
.bn-sect { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: .5rem 1rem; margin: 0 0 1rem; }

/* ---------- En-tête : le bandeau noir du logo ---------- */
.bn-hdr-wrap { position: sticky; top: 0; z-index: 30; transition: transform .35s ease; }
.bn-hdr { border-bottom: 1px solid var(--bn-bord-noir); }
.bn-hdr .hdr-in { max-width: 1320px; margin: 0 auto; height: 64px; padding: 0 1rem 0 1.25rem; display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
.bn-logo-btn { background: none; border: 0; cursor: pointer; display: flex; align-items: center; padding: 6px 0; flex: none; }
.bn-logo { display: block; height: 40px; width: auto; } /* l’image du logo, cadre noir compris : le texte fait la moitié de la hauteur */
.bn-hdr .hdr-ico { border-radius: 0 !important; border-color: var(--line-2) !important; }
.bn-hdr .hdr-ico:hover { border-color: var(--bn-blanc) !important; }

.bn-progress { height: 3px; background: var(--surface-2); }

@media (max-width: 520px) { .bn-logo { height: 32px; } .bn-hdr .hdr-in { height: 58px; } }

/* ---------- Barre d’onglets mobile : le même bandeau, en bas ---------- */
@media (max-width: 760px) {
  .tabbar.bn-scope { left: 0 !important; right: 0 !important; bottom: 0 !important; border: 0 !important; border-top: 1px solid var(--bn-trait) !important; border-radius: 0 !important; box-shadow: none !important; padding: 0 4px env(safe-area-inset-bottom, 0px) !important; }
}
/* Dans l’application, la barre est toujours affichée : pleine largeur, posée en bas */
html.cb-app .tabbar.bn-scope { left: 0 !important; right: 0 !important; bottom: 0 !important; width: auto !important; transform: none !important; border: 0 !important; border-top: 1px solid var(--bn-trait) !important; border-radius: 0 !important; box-shadow: none !important; padding: 0 max(4px, calc((100% - 560px) / 2)) env(safe-area-inset-bottom, 0px) !important; }

/* ---------- Accueil ---------- */
.bn-accueil { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 1rem 1.5rem; margin-bottom: 1.4rem; }

/* À la une */

.bn-une-t { display: block; font-family: var(--bn-font); font-weight: 700; font-size: clamp(1.6rem, 2.8vw, 2.4rem); line-height: 1.04; letter-spacing: -.025em; color: #fff; text-wrap: balance; }
.bn-une-d { display: block; font-size: 14.5px; line-height: 1.5; color: #dedede; max-width: 40rem; }
/* Le rendez-vous et le grand match : un bloc noir */
.bn-noir { background: var(--bn-noir) !important; color: var(--bn-blanc); border: 1px solid var(--bn-bord-noir) !important; }
.bn-rdv { padding: 0 !important; }
.bn-rdv-in { display: flex; flex-direction: column; align-items: flex-start; gap: .8rem; padding: 1.1rem 1.15rem 1.15rem; flex: 1; }
.bn-teams { width: 100%; display: flex; flex-direction: column; align-items: flex-start; gap: .35rem; background: none; border: 0; padding: .2rem 0; cursor: pointer; color: inherit; font: inherit; text-align: left; }
.bn-team { font-family: var(--bn-font); font-weight: 700; text-transform: uppercase; letter-spacing: -.035em; line-height: .95; font-size: clamp(1.45rem, 2.3vw, 2rem); color: var(--bn-blanc); overflow-wrap: anywhere; }
.bn-vs { display: inline-flex; align-items: center; justify-content: center; font-family: var(--bn-font); font-weight: 800; text-transform: uppercase; font-size: 13px; letter-spacing: .06em; line-height: 1; padding: .45em .55em .32em; background: var(--bn-blanc); color: var(--bn-noir); }
.bn-credits { font-family: var(--bn-font); font-weight: 600; font-size: 13px; letter-spacing: .05em; text-transform: uppercase; color: var(--bn-gris); }
.bn-rdv .btn { margin-top: auto; width: 100%; min-height: 44px; font-size: 15px; }
/* La sélection boutique de l’accueil */
.bn-saga-t { font-family: var(--bn-font); font-weight: 700; text-transform: uppercase; letter-spacing: -.03em; line-height: 1.18; font-size: clamp(1.35rem, 2vw, 1.75rem); margin: .1rem 0 .9rem; }
.bn-saga-row { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: .6rem; margin-top: auto; }
.bn-saga-p { display: flex; flex-direction: column; gap: .3rem; background: none; border: 0; padding: 0; cursor: pointer; color: var(--text); text-align: left; font: inherit; min-width: 0; }
.bn-saga-p .im { display: block; aspect-ratio: 1 / 1; background: #f4f4f4; border: 1px solid var(--line); overflow: hidden; }
.bn-saga-p:hover .im { border-color: var(--ink); }
.bn-saga-p img { width: 100%; height: 100%; object-fit: cover; display: block; }
.bn-saga-p .nm { font-size: 12.5px; font-weight: 700; line-height: 1.25; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.bn-saga-p .pr { font-family: var(--bn-font); font-weight: 800; font-size: 14px; color: var(--ink); }

/* ---------- Le grand rendez-vous (vue magazine, Terrain) ---------- */
.bn-match-in { display: flex; flex-direction: column; align-items: flex-start; gap: 1rem; padding: clamp(1.5rem, 3.4vw, 2.6rem) clamp(1.2rem, 3vw, 2.6rem) clamp(1.2rem, 2.6vw, 1.8rem); }
.bn-teams2 { display: flex; flex-wrap: wrap; align-items: center; gap: .5rem 1.1rem; }
.bn-tbtn { background: none; border: 0; padding: 0; cursor: pointer; font: inherit; color: inherit; min-height: 44px; text-align: left; }
.bn-match .bn-team { font-size: clamp(2rem, 5vw, 3.9rem); }
.bn-match .bn-vs { font-size: clamp(14px, 1.6vw, 18px); }
.bn-match-p { font-size: 15.5px; line-height: 1.6; max-width: 38rem; margin: 0; color: #dcdcdc; }
.bn-match-pied { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: .8rem 1rem; padding: .95rem clamp(1.2rem, 3vw, 2.6rem); border-top: 1px solid var(--bn-trait); }

/* ---------- Bande boutique de l’accueil ---------- */
.bn-bande { border-top: 3px solid var(--ink); }
.bn-bande-in { padding-top: 2.6rem; padding-bottom: 3.6rem; }

/* ---------- Boutique ---------- */
.bn-shop-hero { border-bottom: 1px solid var(--bn-bord-noir); }
.bn-shop-hero-in { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, .8fr); align-items: center; gap: 2rem clamp(1.5rem, 4vw, 4rem); padding-top: clamp(2.4rem, 6vh, 4rem); padding-bottom: clamp(2.6rem, 6vh, 4rem); }
.bn-shop-hero .bn-titre { display: block; margin: 1rem 0 1.1rem; font-size: clamp(2.5rem, 5.6vw, 5rem); color: var(--bn-blanc); max-width: 13ch; }
.bn-shop-hero .sh-tag { font-size: 1.08rem; line-height: 1.6; max-width: 36rem; margin: 0 0 1.2rem; color: #e6e6e6; }
.bn-shop-hero .sh-perks { display: flex; flex-wrap: wrap; gap: .5rem; }
.bn-shop-hero .sh-perks span { display: inline-flex; align-items: center; font-family: var(--bn-font); font-weight: 600; letter-spacing: .04em; text-transform: uppercase; font-size: 13px; line-height: 1; color: var(--bn-blanc); border: 1.5px solid #5a5a5a; padding: .6em .75em .45em; }
.bn-shop-hero .sh-note { margin: 1.1rem 0 0; font-size: 13px; color: var(--bn-gris); max-width: 40rem; }
.bn-cadre { position: relative; display: block; margin: 0; background: var(--bn-blanc); padding: clamp(8px, 1.2vw, 12px); }
.bn-cadre > img { display: block; width: 100%; height: auto; }
.bn-cadre figcaption { position: absolute; left: clamp(8px, 1.2vw, 12px); bottom: clamp(8px, 1.2vw, 12px); }
.bn-shop-hero .bn-cadre { width: min(100%, 420px); justify-self: center; }
@media (max-width: 860px) { .bn-shop-hero-in { grid-template-columns: 1fr; } .bn-shop-hero .bn-cadre { order: -1; width: min(78%, 320px); } }
/* Les collections */
.bn-colls { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1rem; margin-bottom: 1.75rem; }
.bn-coll { position: relative; display: flex; flex-direction: column; text-align: left; padding: 0; border: 1px solid var(--line); background: var(--surface); cursor: pointer; color: var(--text); font: inherit; transition: border-color .2s ease; }
.bn-coll:hover { border-color: var(--ink); }
.bn-coll[aria-pressed="true"] { border-color: var(--ink); box-shadow: inset 0 0 0 2px var(--ink); }
.bn-coll-img { position: relative; display: block; aspect-ratio: 1 / 1; background: #f4f4f4; overflow: hidden; }
.bn-coll-img img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .6s ease; }
.bn-coll:hover .bn-coll-img img { transform: scale(1.04); }
.bn-coll-txt { display: flex; flex-direction: column; align-items: flex-start; gap: .4rem; padding: 0 .9rem 1rem; }
.bn-coll-t { margin-top: .1rem; font-family: var(--bn-font); font-weight: 700; text-transform: uppercase; letter-spacing: -.02em; font-size: clamp(1.1rem, 1.6vw, 1.4rem); line-height: 1.22; }
.bn-coll-t span { background: var(--ink); color: var(--bg); padding: .12em .3em 0; -webkit-box-decoration-break: clone; box-decoration-break: clone; }
.bn-coll-kick { margin-top: .8rem; font-family: var(--bn-font); font-weight: 700; font-size: 11.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.bn-coll-tag { font-size: 13px; line-height: 1.45; color: var(--text-2); }
.bn-coll-stat { font-family: var(--bn-font); font-weight: 600; font-size: 12.5px; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
.bn-coll-cta { margin-top: .2rem; font-family: var(--bn-font); font-weight: 700; font-size: 13px; letter-spacing: .05em; text-transform: uppercase; color: var(--ink); border-bottom: 2px solid var(--ink); padding-bottom: .1rem; }
.bn-coll[aria-pressed="true"] .bn-coll-cta { border-bottom-color: transparent; }
@media (max-width: 1100px) { .bn-colls { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 520px) { .bn-colls { gap: .6rem; } .bn-coll-tag { display: none; } .bn-coll-txt { padding: 0 .6rem .8rem; } }
/* L’édition limitée : un bloc noir */
.bn-edition { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, .8fr); align-items: center; gap: 1.5rem 2.5rem; padding: clamp(1.6rem, 4vw, 2.8rem); margin-bottom: 1.75rem; }
.bn-edition .ct-t { display: block; font-family: var(--bn-font); font-weight: 800; text-transform: uppercase; letter-spacing: -.045em; font-size: clamp(3.4rem, 9vw, 7rem); line-height: .86; color: var(--bn-blanc); margin: .8rem 0 .7rem; }
.bn-edition .ct-sub { color: #dcdcdc; font-size: 1.02rem; line-height: 1.6; max-width: 34rem; margin: 0 0 1.2rem; }
.bn-edition .ct-note { margin: 1rem 0 0; font-size: 12.5px; color: var(--bn-gris); letter-spacing: .03em; }
.bn-edition .ct-img { justify-self: center; width: min(100%, 320px); padding: 0; border: 0; background: none; cursor: pointer; }
@media (max-width: 760px) { .bn-edition { grid-template-columns: 1fr; } .bn-edition .ct-img { order: -1; width: min(72%, 260px); } }
/* Fiches produits */
.bn-sceau { position: absolute; z-index: 2; font-family: var(--bn-font); font-weight: 700; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; line-height: 1; color: var(--bn-blanc); background: var(--bn-noir); padding: .55em .65em .42em; }
.bn-vitrine { border: 1px solid var(--line) !important; border-radius: 0 !important; }
.bn-vitrine img { border-radius: 0 !important; }
.bn-etiquette { margin-top: 1.75rem; border: 2px solid var(--ink); }
.bn-etiquette .gk { display: block; font-family: var(--bn-font); font-weight: 700; text-transform: uppercase; letter-spacing: .02em; font-size: 1rem; line-height: 1; padding: .7rem 1rem .55rem; background: var(--ink); color: var(--bg); }
.bn-etiquette .gl { display: grid; gap: .35rem; padding: .9rem 1rem 1rem; }
.bn-etiquette .gr { display: flex; flex-wrap: wrap; gap: .2rem .6rem; font-size: 14px; line-height: 1.4; }
.bn-etiquette .gt { font-family: var(--bn-font); font-weight: 700; letter-spacing: .06em; text-transform: uppercase; font-size: 12px; color: var(--muted); min-width: 9.5rem; padding-top: .15em; }
.bn-etiquette .gd { color: var(--text); font-weight: 700; }
.bn-etiquette .gs { display: block; margin-top: .5rem; font-size: 13px; color: var(--text-2); }

/* ---------- Pied de page : le logo en grand, pour signer ---------- */
.bn-pied { margin-top: 4rem !important; border-top: 1px solid var(--bn-bord-noir); }
.bn-pied-logo { padding-top: .5rem; padding-bottom: 2.2rem; }
.bn-pied-logo img { display: block; width: 100%; height: auto; }
@media (max-width: 760px) { .bn-pied-logo { padding-bottom: calc(84px + env(safe-area-inset-bottom, 0px)); } }

/* ---------- Ouverture de l’application : le bandeau se lève sur le logo ---------- */
.bn-intro { position: fixed; inset: 0; z-index: 200; display: flex; align-items: center; justify-content: center; background: var(--bn-noir); color: var(--bn-blanc); cursor: pointer; animation: bnIntroOut .5s ease 2.9s forwards; }
.bn-intro-in { position: relative; display: flex; flex-direction: column; align-items: center; gap: 1.1rem; width: min(560px, 84vw); }
.bn-intro-mot { position: relative; display: block; width: 100%; overflow: hidden; }
.bn-intro-mot img { display: block; width: 100%; height: auto; clip-path: inset(0 100% 0 0); animation: bnDevoile .7s cubic-bezier(.7, 0, .2, 1) 1.05s forwards; }
.bn-intro-mot::after { content: ""; position: absolute; top: -6%; bottom: -6%; left: 0; width: 100%; background: var(--bn-blanc); transform: scaleX(0); transform-origin: left center; animation: bnBalaye 1.15s cubic-bezier(.7, 0, .2, 1) .6s forwards; }
.bn-intro-tag { font-family: var(--bn-font); font-weight: 600; letter-spacing: .12em; text-transform: uppercase; font-size: clamp(11px, 2.6vw, 14px); color: var(--bn-gris); text-align: center; opacity: 0; animation: bnApparait .5s ease 1.85s forwards; }
.bn-intro .ci-skip { position: absolute; right: 16px; top: calc(16px + env(safe-area-inset-top, 0px)); min-height: 40px; padding: 0 1rem; border: 1.5px solid #5a5a5a; border-radius: 0; background: transparent; color: var(--bn-blanc); cursor: pointer; font-family: var(--bn-font); font-weight: 700; letter-spacing: .06em; text-transform: uppercase; font-size: 13px; }
@keyframes bnBalaye { 0% { transform: scaleX(0); transform-origin: left center; } 45% { transform: scaleX(1); transform-origin: left center; } 55% { transform: scaleX(1); transform-origin: right center; } 100% { transform: scaleX(0); transform-origin: right center; } }
@keyframes bnDevoile { to { clip-path: inset(0 0 0 0); } }
@keyframes bnApparait { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@keyframes bnIntroOut { to { opacity: 0; visibility: hidden; } }
/* le symbole BE+ s’affiche d’abord, au centre du futur logo, puis s’efface sous le balayage */
.bn-intro-sym { position: absolute; left: 50%; top: calc(min(560px, 84vw) * 179 / 2088); width: calc(min(560px, 84vw) * .26); height: calc(min(560px, 84vw) * .26); transform: translate(-50%, -50%); opacity: 0; pointer-events: none; animation: bnSymIn .35s cubic-bezier(.2, .7, .2, 1) .05s forwards, bnSymOut .25s ease .62s forwards; }
.bn-intro-sym svg { display: block; width: 100%; height: 100%; }
@keyframes bnSymIn { from { opacity: 0; transform: translate(-50%, -50%) scale(.86); } to { opacity: 1; transform: translate(-50%, -50%) scale(1); } }
@keyframes bnSymOut { from { opacity: 1; transform: translate(-50%, -50%) scale(1); } to { opacity: 0; transform: translate(-50%, -50%) scale(1.06); } }

/* ---------- Le symbole BE+ : la variante courte du logo (pied de page, signature des articles, onglet Accueil) ---------- */
.bn-sym { display: block; flex: none; }
.bn-pied-marque { display: flex; flex-direction: column; align-items: flex-start; gap: .75rem; }
.bn-pied-marque .bn-sym { outline: 1px solid var(--inv-line); outline-offset: -1px; } /* sur le pied noir, un filet discret garde le carré lisible */
.bn-signe { display: flex; align-items: center; gap: .65rem; margin-top: 1.5rem; font-size: 14px; color: var(--muted); }
.bn-tab-sym { display: block; flex: none; }

/* ---------- Moins d’animations ---------- */
@media (prefers-reduced-motion: reduce) {
  .bn-intro { animation: bnIntroOut .3s ease 1s forwards; }
  .bn-intro-mot img { animation: none; clip-path: none; }
  .bn-intro-mot::after { display: none; }
  .bn-intro-tag { animation: none; opacity: 1; }
  .bn-intro-sym { display: none; }
  .bn-coll-img img, .bn-coll:hover .bn-coll-img img { transition: none; transform: none; }
}

/* Créations Casa : pièces dessinées dans l’Atelier (Studio Boutique) */
.bn-crea-band .ct-t { font-size: clamp(2.4rem, 6.4vw, 4.8rem); }
.bn-crea-thumbs { display: flex; gap: .6rem; justify-content: flex-end; align-self: center; min-width: 0; }
.bn-crea-th { position: relative; flex: 0 1 220px; min-width: 0; padding: 0; border: 1px solid #3a3a3a; background: #f2f1ed; cursor: pointer; aspect-ratio: 1 / 1; overflow: hidden; }
.bn-crea-th img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .5s ease; }
.bn-crea-th:hover img { transform: scale(1.05); }
.bn-crea-th span { position: absolute; left: 0; bottom: 0; background: var(--bn-noir); color: var(--bn-blanc); font: 700 13px/1 var(--bn-font); padding: .45em .55em .35em; }
.bn-crea { margin-top: 2.5rem; border-top: 1.5px solid var(--ink); padding-top: 1.5rem; }
.bn-crea-lead { font-size: 13px; color: var(--muted); }
.bn-crea-bar { display: flex; flex-wrap: wrap; gap: .6rem; align-items: center; }

<noscript>Casa Besports nécessite JavaScript pour fonctionner.</noscript>
<div id="app"></div>
<script>window.ASSET_DATA = {}; /* les images sont dans le dossier assets/ */;
(function () {
  function fix(n) {
    if (n.nodeType !== 1) return;
    var list = n.matches && n.matches('img[src^="assets/"],[style*="assets/"]') ? [n] : [];
    if (n.querySelectorAll) list = list.concat([].slice.call(n.querySelectorAll('img[src^="assets/"],[style*="assets/"]')));
    list.forEach(function (e) {
      var s = e.getAttribute('src'); if (s && s.indexOf('assets/') === 0) { var d = window.ASSET_DATA[s.slice(7)]; if (d) e.setAttribute('src', d); }
      var st = e.getAttribute('style'); if (st && st.indexOf('assets/') >= 0) e.setAttribute('style', st.replace(/assets\/([A-Za-z0-9_.\-]+)/g, function (m, f) { return window.ASSET_DATA[f] || m; }));
    });
  }
  new MutationObserver(function (ms) { ms.forEach(function (m) { if (m.type === 'attributes') fix(m.target); else m.addedNodes.forEach(fix); }); }).observe(document.documentElement, { childList: true, subtree: true, attributes: true, attributeFilter: ['src', 'style'] });
  document.addEventListener('DOMContentLoaded', function () { fix(document.body); });
})();
</script>

<!-- Gabarit de l’interface : syntaxe {{ }}, <sc-if>, <sc-for>. Interprété par js/dc-runtime.js -->
<template id="app-template">

      </sc-for>
      <button type="button" class="navb" onClick="{{toggleMore}}" aria-expanded="{{moreExp}}" style="color: var(--muted); display: inline-flex; align-items: center; gap: .3rem">Plus <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M6 9l6 6 6-6"></path></svg></button>
      <sc-if value="{{moreOpen}}" hint-placeholder-val="{{ false }}">

          <sc-if value="{{themeIconPaper}}" hint-placeholder-val="{{ false }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h11l3 3v13H5z"></path><path d="M8 9h8M8 13h8M8 17h5"></path></svg></sc-if>
          <sc-if value="{{themeIconAuto}}" hint-placeholder-val="{{ false }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="8"></circle><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"></path></svg></sc-if>

        <sc-if value="{{themeMenuOpen}}" hint-placeholder-val="{{ false }}">
          <div role="radiogroup" aria-label="Choisir le thème" class="glass float-in thm-pop" style="position: absolute; right: 0; top: 54px; z-index: 40; width: min(330px, calc(100vw - 32px)); border: 1px solid var(--line); border-radius: 0; box-shadow: 0 24px 60px -20px var(--shadow); padding: .6rem">

            <sc-for list="{{themes}}" as="th" hint-placeholder-count="5">
              <button type="button" role="radio" aria-checked="{{th.checked}}" onClick="{{th.pick}}" style="width: 100%; display: flex; align-items: center; gap: .7rem; text-align: left; background: {{th.rowBg}}; border: 0; border-radius: 0; padding: .5rem; cursor: pointer; min-height: 52px; color: var(--text)">
                <span style="width: 54px; height: 38px; border-radius: 0; overflow: hidden; flex: none; border: 1px solid var(--line-2); background: {{th.bg}}; position: relative; display: block">
                  <span style="position: absolute; left: 0; right: 0; top: 0; height: 9px; background: {{th.bar}}"></span>
                  <span style="position: absolute; left: 6px; top: 14px; width: 26px; height: 18px; border-radius: 0; background: {{th.card}}; border: 1px solid {{th.line}}"></span>
                  <span style="position: absolute; right: 6px; top: 16px; width: 10px; height: 10px; border-radius: 50%; background: {{th.acc}}"></span>
                  <span style="position: absolute; right: 0; top: 0; bottom: 0; width: {{th.split}}; background: #0b0b0b"></span>
                </span>
                <span style="flex: 1"><span style="display: block; font-weight: 800; font-size: 14.5px">{{th.name}}</span><span style="display: block; font-size: 12.5px; color: var(--muted)">{{th.desc}}</span></span>
                <span aria-hidden="true" style="width: 22px; height: 22px; border-radius: 50%; flex: none; display: flex; align-items: center; justify-content: center; border: 2px solid {{th.ring}}; background: {{th.dotBg}}; color: var(--on-acc)"><sc-if value="{{th.isOn}}" hint-placeholder-val="{{ false }}"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"></path></svg></sc-if></span>
              </button>

            <div style="font-size: 12px; color: var(--muted); padding: .5rem .4rem .2rem; border-top: 1px solid var(--line); margin-top: .3rem">{{themeSavedNote}}</div>

        </sc-if>
      </span>
      <button type="button" class="hdr-ico" onClick="{{openSearch}}" aria-label="Rechercher" style="width: 44px; height: 44px; border: 1px solid var(--line-2); border-radius: 50%; background: var(--surface); cursor: pointer; display: flex; align-items: center; justify-content: center; color: var(--text)">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
      </button>
      <button type="button" class="hdr-ico" onClick="{{openCart}}" aria-label="{{cartAria}}" style="position: relative; width: 44px; height: 44px; border: 1px solid var(--line-2); border-radius: 50%; background: var(--surface); cursor: pointer; display: flex; align-items: center; justify-content: center; color: var(--text)">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8h14l-1.2 12H6.2z"></path><path d="M9 8V6a3 3 0 0 1 6 0v2"></path></svg>
        <sc-if value="{{hasCart}}" hint-placeholder-val="{{ false }}"><span class="num" style="position: absolute; top: -4px; right: -4px; min-width: 20px; height: 20px; border-radius: 0; background: {{accent}}; color: var(--on-acc); font-size: 12px; display: flex; align-items: center; justify-content: center; padding: 0 5px">{{cartCount}}</span></sc-if>
      </button>
      <button type="button" class="hdr-ico hide-xs" onClick="{{accountClick}}" aria-label="{{accountLabel}}" style="width: 44px; height: 44px; border: 1px solid var(--line-2); border-radius: 50%; background: {{accountBg}}; cursor: pointer; display: flex; align-items: center; justify-content: center; color: {{accountFg}}; font-family: 'League Spartan', 'Arial Black', sans-serif; font-weight: 700; font-size: 16px">
        <sc-if value="{{showInitial}}" hint-placeholder-val="{{ false }}">{{initial}}</sc-if><sc-if value="{{hasAvatar}}" hint-placeholder-val="{{ false }}"><img class="hdr-ava" src="{{avatar}}" alt=""></sc-if>
        <sc-if value="{{loggedOut}}" hint-placeholder-val="{{ true }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"></path></svg></sc-if>
      </button>
      <button type="button" class="burger hdr-ico" onClick="{{toggleMenu}}" aria-label="Menu" style="width: 44px; height: 44px; align-items: center; justify-content: center; background: var(--surface); border: 1px solid var(--line-2); border-radius: 50%; cursor: pointer; color: var(--text)">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"></path></svg>
      </button>
    </div>
  </div>
  <sc-if value="{{menuOpen}}" hint-placeholder-val="{{ false }}">
    <div class="wrap" style="border-top: 1px solid var(--line); padding-bottom: 1rem; display: flex; flex-direction: column">
      <sc-for list="{{nav}}" as="n" hint-placeholder-count="5">
        <button type="button" onClick="{{n.go}}" class="cond" style="text-align: left; font-size: 22px; font-weight: 600; background: none; border: 0; border-bottom: 1px solid var(--line); padding: .85rem 0; cursor: pointer; color: {{n.color}}">{{n.label}}</button>
      </sc-for>
      <div style="display: flex; flex-wrap: wrap; gap: .4rem; padding-top: .75rem">
        <sc-for list="{{moreNav}}" as="n" hint-placeholder-count="6">
          <button type="button" onClick="{{n.go}}" class="chip" style="background: var(--surface); border: 1.5px solid var(--line-2); color: var(--text)">{{n.label}}</button>
        </sc-for>
      </div>
      <button type="button" class="btn btn-ghost" onClick="{{accountClick}}" style="margin-top: .75rem; width: 100%">{{accountLabel}}</button>
      <div role="radiogroup" aria-label="Thème" style="display: flex; flex-wrap: wrap; gap: .4rem; padding-top: .75rem; align-items: center"><span class="cond" style="font-size: 12px; color: var(--muted); margin-right: .3rem">Thème</span>
        <sc-for list="{{themes}}" as="th" hint-placeholder-count="5"><button type="button" class="chip" role="radio" aria-checked="{{th.checked}}" onClick="{{th.pick}}" style="min-height: 40px; font-size: 14px; background: {{th.chipBg}}; color: {{th.chipFg}}; border: 1.5px solid {{th.chipBorder}}">{{th.short}}</button></sc-for>
      </div>
    </div>
  </sc-if>
  <div class="bn-progress"><div style="width: {{progressW}}"></div></div>
</header>
</div>

<sc-if value="{{showCrumbs}}" hint-placeholder-val="{{ false }}">

<!-- ================= ACCUEIL · TABLEAU DE BORD (nouvelle organisation) ================= -->
<sc-if value="{{isHomeDash}}" hint-placeholder-val="{{ true }}">

      <div>
        <div class="cond" style="font-size: 13px; color: var(--muted)">{{todayLabel}} · {{wx.city}} {{wx.nowTemp}}</div>

      </div>
      <div class="bn-accueil-act">
        <button type="button" class="btn btn-ghost" onClick="{{openCustomize}}" style="min-height: 44px; font-size: 15px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"></path><circle cx="16" cy="6" r="2"></circle><circle cx="10" cy="12" r="2"></circle><circle cx="18" cy="18" r="2"></circle></svg>Personnaliser</button>
        <button type="button" class="btn btn-ghost" onClick="{{toMagazine}}" style="min-height: 44px; font-size: 15px">Vue magazine</button>
      </div>
    </div>
    <button type="button" onClick="{{openSearch}}" style="width: 100%; display: flex; align-items: center; gap: .75rem; text-align: left; background: var(--surface); border: 1.5px solid var(--line-2); border-radius: 0; padding: 0 1.25rem; min-height: 56px; cursor: pointer; color: var(--muted); font-size: 16px; box-shadow: 0 10px 30px -22px var(--shadow)">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
      <span style="flex: 1">Un club, un joueur, un score, un maillot…</span>
      <span class="cond" style="font-size: 12px; color: var(--ink)">Rechercher</span>

      <sc-for list="{{quickChips}}" as="qc" hint-placeholder-count="5">

      </sc-for>
    </div>
  </section>

  <section class="wrap" style="padding-bottom: 3rem">
    <div class="bento">
      <sc-for list="{{homeMods}}" as="hm" hint-placeholder-count="10">

          <sc-if value="{{hm.isUne}}" hint-placeholder-val="{{ false }}">
            <button type="button" onClick="{{une.open}}" class="b-card b-img bn-une" style="padding: 0; color: #fff">

                <span class="bn-etiq inv">À la une · {{une.tag}}</span>
                <span class="bn-une-t">{{une.title}}</span>
                <span class="bn-une-d">{{une.dek}}</span>
              </span>
            </button>

          <!-- Le direct -->
          <sc-if value="{{hm.isLive}}" hint-placeholder-val="{{ false }}">

              <div class="b-head"><span class="cond" style="display: flex; align-items: center; gap: .45rem; color: var(--danger)"><span class="pulse" style="width: 8px; height: 8px; border-radius: 50%; background: #e03040"></span>Le direct</span><button type="button" class="b-more" onClick="{{goLive}}">Tout voir</button></div>

                    <span style="font-weight: 700; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{m.away}}</span><span class="num" style="font-size: 17px; color: var(--ink)">{{m.as}}</span>
                    <span class="cond" style="font-size: 11px; color: {{m.stColor}}">{{m.sport}} · {{m.statusLabel}}</span>

              <div style="font-size: 14px; color: var(--text-2); margin: .3rem 0 .7rem">{{wx.nowLabel}} · vent {{wx.nowWind}}</div>
              <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: .3rem">

              <button type="button" onClick="{{cultureHome.openVenues}}" style="text-align: left; background: var(--surface-3); border: 1px solid var(--line); border-radius: 0; padding: .65rem .75rem; cursor: pointer; color: var(--text)"><span class="cond" style="display: block; font-size: 11px; color: var(--muted)">À visiter</span><span class="ttl" style="font-size: 18px">{{cultureHome.venue}}</span></button>

            <span class="cond" style="margin-top: 1rem; font-size: 14px; color: {{g.ctaColor}}; display: inline-flex; align-items: center; gap: .35rem">{{g.cta}} <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></span>
          </button>

      </div>
    </div>
  </section>

  <!-- Prochain grand rendez-vous -->
  <sc-if value="{{rdv.has}}" hint-placeholder-val="{{ false }}"><section class="wrap" style="padding-top: 2.5rem">

        </button>

    </div>
  </section>

      <p style="font-size: 1.25rem; line-height: 1.6; color: var(--text-2); margin: 0 0 1.75rem; font-family: var(--font-body); font-weight: 600">{{art.dek}}</p>

      <!-- barre d'outils de lecture -->
      <div style="display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; padding: .75rem 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); margin-bottom: 1.75rem">
        <button type="button" class="chip" onClick="{{toggleSummary}}" aria-pressed="{{summaryPressed}}" style="background: {{sumBg}}; color: {{sumFg}}; border: 1.5px solid var(--ink); display: inline-flex; align-items: center; gap: .4rem"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 6h16M4 12h10M4 18h6"></path></svg>Résumé express</button>
        <button type="button" class="chip" onClick="{{toggleListen}}" aria-pressed="{{listenPressed}}" style="background: {{lisBg}}; color: {{lisFg}}; border: 1.5px solid var(--ink); display: inline-flex; align-items: center; gap: .4rem"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 10v4M8 7v10M12 4v16M16 8v8M20 11v2"></path></svg>{{listenLabel}}</button>
        <span style="display: inline-flex; border: 1.5px solid var(--line-2); border-radius: 0; overflow: hidden">
          <button type="button" onClick="{{fontDown}}" aria-label="Réduire le texte" style="width: 44px; height: 41px; border: 0; background: var(--surface); cursor: pointer; font-weight: 800; color: var(--text)">A−</button>
          <button type="button" onClick="{{fontUp}}" aria-label="Agrandir le texte" style="width: 44px; height: 41px; border: 0; border-left: 1px solid var(--line); background: var(--surface); cursor: pointer; font-weight: 800; font-size: 17px; color: var(--text)">A+</button>
        </span>
        <span style="flex: 1"></span>
        <button type="button" onClick="{{art.toggleSave}}" aria-label="{{art.saveLabel}}" style="width: 44px; height: 44px; border-radius: 50%; border: 1.5px solid var(--line-2); background: var(--surface); cursor: pointer; display: flex; align-items: center; justify-content: center; color: {{art.saveColor}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="{{art.saveFill}}" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M6 3h12v18l-6-4-6 4z"></path></svg></button>
        <button type="button" onClick="{{share}}" aria-label="Partager l’article" style="width: 44px; height: 44px; border-radius: 50%; border: 1.5px solid var(--line-2); background: var(--surface); cursor: pointer; display: flex; align-items: center; justify-content: center; color: var(--text)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"></path></svg></button>
      </div>

      <sc-if value="{{listening}}" hint-placeholder-val="{{ false }}">
        <div class="cb-deep" style="background: var(--inv-bg); color: var(--on-inv); border-radius: 0; padding: 1rem 1.25rem; margin-bottom: 1.5rem; display: flex; align-items: center; gap: 1rem">
          <button type="button" onClick="{{toggleListen}}" aria-label="Mettre en pause" style="width: 44px; height: 44px; border-radius: 50%; background: {{accent}}; border: 0; cursor: pointer; color: var(--on-acc); display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M7 5h4v14H7zM13 5h4v14h-4z"></path></svg></button>
          <div style="flex: 1"><div class="cond" style="font-size: 13px; color: var(--gold-on-inv); margin-bottom: .4rem">Lecture audio · voix de synthèse</div><div style="height: 4px; background: var(--inv-line); border-radius: 0; overflow: hidden"><div class="run" style="height: 4px; background: {{accent}}"></div></div></div>
        </div>
      </sc-if>

      <sc-if value="{{summaryOpen}}" hint-placeholder-val="{{ false }}">
        <div style="background: var(--surface-2); border-radius: 0; padding: 1.25rem 1.5rem; margin-bottom: 1.75rem">
          <div class="eb" style="margin-bottom: .6rem">L’essentiel en 20 secondes</div>
          <sc-for list="{{art.points}}" as="pt" hint-placeholder-count="3">
            <div style="display: flex; gap: .7rem; padding: .35rem 0; line-height: 1.55"><span style="width: 7px; height: 7px; margin-top: .55rem; border-radius: 50%; background: {{accent}}; flex: none"></span><span>{{pt.t}}</span></div>
          </sc-for>
        </div>
      </sc-if>
    </div>

    <div class="wrap" style="max-width: 1100px"><div style="aspect-ratio: 16 / 8; border-radius: 0; overflow: hidden; margin-bottom: 2rem; background: var(--surface-2)"><img src="{{art.img}}" alt="{{art.alt}}" style="width: 100%; height: 100%; object-fit: cover; display: block"></div></div>

    <div class="wrap" style="max-width: 860px">
      <sc-if value="{{locked}}" hint-placeholder-val="{{ false }}">
        <div style="position: relative">
          <p style="font-size: {{fontSize}}; line-height: 1.8; color: var(--text); margin: 0; filter: blur(3px); user-select: none">[Début du texte de l’article — affiché depuis le CMS Casa Besports.] Les premières lignes restent visibles pour donner envie, la suite est réservée aux abonnés Casa B+.</p>
          <div class="cb-deep" style="margin-top: 1.5rem; background: var(--inv-bg); color: var(--on-inv-2); border-radius: 0; padding: 2rem; text-align: center">
            <div class="eb" style="color: var(--gold-on-inv); margin-bottom: .5rem">Contenu Casa B+</div>
            <div class="ttl" style="font-size: 30px; color: var(--on-inv); margin-bottom: .75rem">La suite est réservée aux abonnés</div>
            <p style="margin: 0 0 1.25rem; color: var(--on-inv-2)">Débloquez tous les reportages Premium du sport manchois.</p>
            <div style="display: flex; flex-wrap: wrap; gap: .6rem; justify-content: center"><button type="button" class="btn btn-gold" onClick="{{goCheckout}}">S’abonner</button><button type="button" class="btn" onClick="{{openLogin}}" style="background: transparent; color: var(--on-inv); border: 1.5px solid var(--inv-line)">J’ai déjà un compte</button></div>
          </div>
        </div>
      </sc-if>
      <sc-if value="{{unlocked}}" hint-placeholder-val="{{ true }}">
        <div style="font-size: {{fontSize}}; line-height: 1.8; color: var(--text)">
          <sc-if value="{{art.noBody}}" hint-placeholder-val="{{ true }}">
          <p style="margin: 0 0 1.2em">[Texte intégral de l’article — importé automatiquement depuis le CMS Casa Besports.]</p>
          <p style="margin: 0 0 1.2em">{{art.dek}}</p>
          <blockquote style="margin: 2rem 0; padding: 0 0 0 1.5rem; border-left: 3px solid {{accent}}; font-family: 'League Spartan', 'Arial Black', sans-serif; font-weight: 700; letter-spacing: -.02em; font-size: 1.6em; line-height: 1.3; color: var(--ink)">[Citation clé de l’article]</blockquote>
          <p style="margin: 0">[Suite du texte de l’article.]</p>
          <div class="bn-signe"><svg class="bn-sym" viewBox="0 0 1000 1000" width="28" height="28" aria-hidden="true" focusable="false"><rect width="1000" height="1000" fill="#000000"></rect><path transform="translate(150.0 339.1) scale(0.24382)" fill="#FFFFFF" d="M0 0H453Q566 0 662.5 31Q759 62 818.5 132.5Q878 203 878 323Q878 402 848.5 464Q819 526 770.5 565.5Q722 605 665 618Q715 624 762.5 646.5Q810 669 848.5 708.5Q887 748 909.5 806.5Q932 865 932 945Q932 1056 882.5 1140.5Q833 1225 738.5 1272.5Q644 1320 507 1320H0ZM299 1081H435Q499 1081 539.5 1061.5Q580 1042 599 1005.5Q618 969 618 918Q618 838 568.5 800.5Q519 763 430 763H299ZM299 529H420Q473 529 508.5 510Q544 491 562.5 456.5Q581 422 581 377Q581 296 535 267.5Q489 239 409 239H299Z M1034 0H1877V262H1332V531H1872V785H1332V1058H1877V1320H1034Z M2585 779V1067H2338V779H2050V534H2338V246H2585V534H2871V779Z"></path></svg></div>
          </sc-if>
          <sc-if value="{{art.hasBody}}" hint-placeholder-val="{{ false }}">
            <sc-for list="{{art.blocks}}" as="bk" hint-placeholder-count="3">
              <sc-if value="{{bk.isP}}" hint-placeholder-val="{{ true }}"><p style="margin: 0 0 1.2em">{{bk.t}}</p></sc-if>
              <sc-if value="{{bk.isH}}" hint-placeholder-val="{{ false }}"><div class="ttl" style="font-size: 1.5em; margin: 1.3em 0 .5em">{{bk.t}}</div></sc-if>
              <sc-if value="{{bk.isQ}}" hint-placeholder-val="{{ false }}"><blockquote style="margin: 1.5rem 0; padding-left: 1.5rem; border-left: 3px solid {{accent}}; font-family: 'League Spartan', 'Arial Black', sans-serif; font-weight: 700; letter-spacing: -.02em; font-size: 1.5em; line-height: 1.3; color: var(--ink)">{{bk.t}}</blockquote></sc-if>
              <sc-if value="{{bk.isL}}" hint-placeholder-val="{{ false }}"><div style="display: flex; gap: .7rem; margin: 0 0 .5em"><span style="width: 7px; height: 7px; border-radius: 50%; background: {{accent}}; margin-top: .7em; flex: none"></span><span>{{bk.t}}</span></div></sc-if>
              <sc-if value="{{bk.isImg}}" hint-placeholder-val="{{ false }}"><figure style="margin: 1.6rem 0"><img src="{{bk.src}}" alt="{{bk.t}}" loading="lazy" style="display: block; width: 100%; height: auto"><sc-if value="{{bk.t}}" hint-placeholder-val="{{ false }}"><figcaption style="font-size: 13.5px; color: var(--muted); padding-top: .5rem">{{bk.t}}</figcaption></sc-if></figure></sc-if>
            </sc-for>
            <div class="bn-signe"><svg class="bn-sym" viewBox="0 0 1000 1000" width="28" height="28" aria-hidden="true" focusable="false"><rect width="1000" height="1000" fill="#000000"></rect><path transform="translate(150.0 339.1) scale(0.24382)" fill="#FFFFFF" d="M0 0H453Q566 0 662.5 31Q759 62 818.5 132.5Q878 203 878 323Q878 402 848.5 464Q819 526 770.5 565.5Q722 605 665 618Q715 624 762.5 646.5Q810 669 848.5 708.5Q887 748 909.5 806.5Q932 865 932 945Q932 1056 882.5 1140.5Q833 1225 738.5 1272.5Q644 1320 507 1320H0ZM299 1081H435Q499 1081 539.5 1061.5Q580 1042 599 1005.5Q618 969 618 918Q618 838 568.5 800.5Q519 763 430 763H299ZM299 529H420Q473 529 508.5 510Q544 491 562.5 456.5Q581 422 581 377Q581 296 535 267.5Q489 239 409 239H299Z M1034 0H1877V262H1332V531H1872V785H1332V1058H1877V1320H1034Z M2585 779V1067H2338V779H2050V534H2338V246H2585V534H2871V779Z"></path></svg><span>Par {{art.author}} · relu et validé par la rédaction</span></div>
          </sc-if>
        </div>
        <div style="margin-top: 2.25rem">
          <div class="eb" style="margin-bottom: .75rem">Votre réaction</div>
          <div style="display: flex; gap: .5rem; flex-wrap: wrap">
            <sc-for list="{{reactions}}" as="r" hint-placeholder-count="3">
              <button type="button" class="chip" onClick="{{r.pick}}" aria-pressed="{{r.pressed}}" style="background: {{r.bg}}; color: {{r.fg}}; border: 1.5px solid var(--ink)">{{r.label}}</button>
            </sc-for>
          </div>
        </div>
      </sc-if>

      <sc-if value="{{art.hasVideo}}" hint-placeholder-val="{{ false }}"><div class="rx-artvideo"><span class="cond" style="color: var(--gold-text)">Vidéo</span><a class="btn btn-dark" href="{{art.videoUrl}}" target="_blank" rel="noopener">Voir la vidéo<sc-if value="{{art.hasVideoDur}}" hint-placeholder-val="{{ false }}"> · {{art.videoDur}}</sc-if></a></div></sc-if>
      <sc-if value="{{art.hasClubs}}" hint-placeholder-val="{{ false }}">
        <div style="margin-top: 2.5rem; padding-top: 1.5rem; border-top: 1px solid var(--line)">
          <div class="eb" style="margin-bottom: .75rem">Clubs cités</div>
          <div style="display: flex; flex-wrap: wrap; gap: .6rem">
            <sc-for list="{{art.clubs}}" as="c" hint-placeholder-count="2">
              <span style="display: inline-flex; border: 1.5px solid var(--line-2); border-radius: 0; overflow: hidden">
                <button type="button" onClick="{{c.open}}" style="border: 0; background: var(--surface); padding: 0 1rem; min-height: 44px; cursor: pointer; font-weight: 700; color: var(--text)">{{c.name}}</button>
                <button type="button" onClick="{{c.toggleFollow}}" style="border: 0; border-left: 1px solid var(--line); background: {{c.fBg}}; color: {{c.fFg}}; padding: 0 .9rem; min-height: 44px; cursor: pointer; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; letter-spacing: .06em; text-transform: uppercase">{{c.fLabel}}</button>
              </span>
            </sc-for>
          </div>
        </div>
      </sc-if>
    </div>

    <div class="wrap" style="padding-top: 3.5rem">
      <div class="eb" style="margin-bottom: .4rem">À lire ensuite</div>
      <h2 class="h2" style="margin-bottom: 1.5rem; font-size: 2.2rem">Dans la même veine</h2>
      <div class="grid3">
        <sc-for list="{{related}}" as="a" hint-placeholder-count="3">
          <div class="card"><button type="button" class="hit" onClick="{{a.open}}"><div style="aspect-ratio: 16 / 9; overflow: hidden"><img class="zimg" src="{{a.img}}" alt="{{a.alt}}"></div><div style="padding: 1rem 1.2rem 1.25rem"><div class="cond" style="font-size: 13px; color: var(--gold-text); margin-bottom: .35rem">{{a.tag}} · <span style="color: var(--muted)">{{a.date}}</span></div><div class="ttl" style="font-size: 22px">{{a.title}}</div></div></button></div>
        </sc-for>
      </div>
    </div>
  </article>
</sc-if>

    <div class="eb" style="margin-bottom: .5rem">Vidéos</div>
