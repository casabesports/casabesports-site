  <section class="wrap" style="padding-top: 2rem; padding-bottom: 4.5rem">
    <div style="font-size: 13px; color: var(--muted); margin-bottom: 1.25rem">Partagez avec les supporters du Cotentin : respect, bienveillance et passion.</div>

    <!-- LE FIL -->
    <sc-if value="{{ch.tFil}}" hint-placeholder-val="{{ true }}">
      <div style="display: flex; flex-wrap: wrap; gap: 1.5rem; align-items: flex-start">
        <div style="flex: 2 1 480px; min-width: 0; display: flex; flex-direction: column; gap: 1rem">
          <div style="background: var(--surface); border: 1px solid var(--line); border-radius: 0; padding: 1rem 1.1rem">
            <sc-if value="{{loggedIn}}" hint-placeholder-val="{{ false }}">
              <label class="lbl" style="margin-bottom: .6rem"><span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Votre message</span><textarea class="field" value="{{chf.text}}" onChange="{{chf.onText}}" maxlength="500" placeholder="Un avis sur le match, une photo de tribune, une question au club…" style="min-height: 84px; padding: .7rem .9rem; resize: vertical"></textarea></label>
              <div style="display: flex; gap: .5rem; flex-wrap: wrap; align-items: center">
                <label class="lbl" style="flex-direction: row; align-items: center; gap: .5rem"><span>Salon</span><x-select class="field" value="{{chf.room}}" onChange="{{chf.onRoom}}" style="width: auto; min-height: 40px"><sc-for list="{{ch.roomOpts}}" as="ro" hint-placeholder-count="5"><x-option value="{{ro.v}}">{{ro.v}}</x-option></sc-for></x-select></label>
                <span style="flex: 1"></span><span style="font-size: 12.5px; color: var(--muted)">{{chf.left}} caractères</span>
                <button type="button" class="btn btn-dark" onClick="{{ch.publish}}" style="min-height: 42px; font-size: 15px">Publier</button>
              </div>
            </sc-if>
            <sc-if value="{{loggedOut}}" hint-placeholder-val="{{ true }}"><div style="display: flex; gap: 1rem; align-items: center; flex-wrap: wrap"><span style="flex: 1; color: var(--text-2)">Connectez-vous pour publier, réagir et commenter.</span><button type="button" class="btn btn-dark" onClick="{{openLogin}}" style="min-height: 42px; font-size: 15px">Se connecter</button></div></sc-if>
          </div>
          <div style="display: flex; gap: .4rem; flex-wrap: wrap"><sc-for list="{{ch.rooms}}" as="rm" hint-placeholder-count="5"><button type="button" class="chip" onClick="{{rm.pick}}" aria-pressed="{{rm.pressed}}" style="min-height: 38px; font-size: 14px; background: {{rm.bg}}; color: {{rm.fg}}; border: 1.5px solid {{rm.border}}">{{rm.label}}</button></sc-for></div>
          <sc-for list="{{ch.posts}}" as="po" hint-placeholder-count="4">
            <article style="background: var(--surface); border: 1px solid var(--line); border-radius: 0; padding: 1rem 1.1rem">
              <header style="display: flex; gap: .7rem; align-items: center; margin-bottom: .6rem">
                <span class="ttl" style="width: 42px; height: 42px; border-radius: 50%; background: {{po.color}}; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 18px; flex: none">{{po.initial}}</span>
                <span style="flex: 1; min-width: 0"><span style="display: block; font-weight: 800; color: var(--text)">{{po.author}}<sc-if value="{{po.isStaff}}" hint-placeholder-val="{{ false }}"><span class="cond" style="font-size: 10.5px; margin-left: .4rem; padding: .15rem .4rem; background: var(--acc); color: var(--on-acc); border-radius: 0">Rédaction</span></sc-if></span><span style="font-size: 12.5px; color: var(--muted)">{{po.room}} · {{po.time}}</span></span>
                <sc-if value="{{po.mine}}" hint-placeholder-val="{{ false }}"><button type="button" onClick="{{po.remove}}" aria-label="Supprimer ma publication" style="border: 0; background: none; cursor: pointer; color: var(--muted); font-size: 13px; min-height: 36px">Supprimer</button></sc-if>
              </header>
              <p style="margin: 0 0 .7rem; line-height: 1.6; color: var(--text); white-space: pre-line">{{po.text}}</p>
              <sc-if value="{{po.hasLink}}" hint-placeholder-val="{{ false }}"><button type="button" onClick="{{po.openLink}}" style="display: flex; gap: .7rem; align-items: center; width: 100%; text-align: left; background: var(--surface-3); border: 1px solid var(--line); border-radius: 0; padding: .5rem; cursor: pointer; color: var(--text); margin-bottom: .7rem"><img src="{{po.linkImg}}" alt="" style="width: 72px; height: 54px; object-fit: cover; border-radius: 0; flex: none"><span><span class="cond" style="display: block; font-size: 11px; color: var(--gold-text)">{{po.linkTag}}</span><span class="ttl" style="font-size: 17px">{{po.linkTitle}}</span></span></button></sc-if>
              <div style="display: flex; gap: .4rem; align-items: center; flex-wrap: wrap">
                <button type="button" onClick="{{po.like}}" aria-pressed="{{po.likePressed}}" style="display: inline-flex; align-items: center; gap: .35rem; min-height: 38px; padding: 0 .75rem; border-radius: 0; cursor: pointer; font-weight: 800; background: {{po.likeBg}}; color: {{po.likeFg}}; border: 1.5px solid {{po.likeBorder}}"><svg width="15" height="15" viewBox="0 0 24 24" fill="{{po.likeFill}}" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"></path></svg><span class="num">{{po.likes}}</span></button>
                <button type="button" onClick="{{po.toggleComments}}" style="min-height: 38px; padding: 0 .75rem; border-radius: 0; cursor: pointer; font-weight: 700; background: var(--surface); color: var(--text); border: 1.5px solid var(--line-2)">{{po.commentsLabel}}</button>
              </div>
              <sc-if value="{{po.open}}" hint-placeholder-val="{{ false }}">
                <div style="margin-top: .8rem; border-top: 1px solid var(--line); padding-top: .6rem; display: flex; flex-direction: column; gap: .5rem">
                  <sc-for list="{{po.comments}}" as="cm" hint-placeholder-count="2"><div style="background: var(--surface-3); border-radius: 0; padding: .5rem .75rem; font-size: 14px"><strong style="color: var(--text)">{{cm.author}}</strong> <span style="color: var(--text-2)">{{cm.text}}</span></div></sc-for>
                  <sc-if value="{{loggedIn}}" hint-placeholder-val="{{ false }}"><div style="display: flex; gap: .4rem"><label style="flex: 1"><span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Votre commentaire</span><input class="field" value="{{chf.comment}}" onChange="{{chf.onComment}}" placeholder="Répondre…" style="min-height: 40px; font-size: 14px"></label><button type="button" onClick="{{po.comment}}" class="btn btn-dark" style="min-height: 40px; font-size: 14px">Envoyer</button></div></sc-if>
                </div>
              </sc-if>
            </article>
          </sc-for>
        </div>
        <aside style="flex: 1 1 280px; display: flex; flex-direction: column; gap: 1rem">
          <div style="background: var(--surface); border: 1px solid var(--line); border-radius: 0; padding: 1.1rem 1.2rem">
            <div class="eb" style="font-size: 13px; margin-bottom: .6rem">Le sondage de la semaine</div>
            <div class="ttl" style="font-size: 20px; margin-bottom: .7rem">{{ch.poll.q}}</div>
            <sc-for list="{{ch.poll.opts}}" as="op" hint-placeholder-count="4">
              <button type="button" onClick="{{op.vote}}" aria-pressed="{{op.pressed}}" style="position: relative; display: block; width: 100%; text-align: left; margin-bottom: .4rem; min-height: 44px; padding: 0 .8rem; border-radius: 0; cursor: pointer; background: var(--surface-3); border: 1.5px solid {{op.border}}; color: var(--text); overflow: hidden; font-weight: 700">
                <span style="position: absolute; inset: 0 auto 0 0; width: {{op.w}}; background: {{op.bar}}; opacity: .35"></span>
                <span style="position: relative; display: flex; justify-content: space-between; gap: .5rem"><span>{{op.t}}</span><span class="num">{{op.pct}}</span></span>
              </button>
            </sc-for>
            <div style="font-size: 12.5px; color: var(--muted)">{{ch.poll.total}} votes · +5 points pour votre vote</div>
          </div>
          <div style="background: var(--surface); border: 1px solid var(--line); border-radius: 0; padding: 1.1rem 1.2rem">
            <div class="eb" style="font-size: 13px; margin-bottom: .6rem">Prochain rendez-vous</div>
            <div class="ttl" style="font-size: 20px">{{ch.nextEvent.title}}</div>
            <div style="font-size: 13px; color: var(--muted); margin: .2rem 0 .7rem">{{ch.nextEvent.when}} · {{ch.nextEvent.place}}</div>
            <button type="button" class="btn btn-ghost" onClick="{{ch.goEvents}}" style="width: 100%; min-height: 42px; font-size: 14px">Tous les événements</button>
          </div>
          <button type="button" onClick="{{openLineupAR}}" style="text-align: left; border: 1px solid var(--line); cursor: pointer; background: var(--surface); color: var(--text); border-radius: 0; padding: 1.1rem 1.2rem"><span class="eb" style="display: block; font-size: 13px; margin-bottom: .3rem">Réalité augmentée</span><span class="ttl" style="display: block; font-size: 20px">Proposer ma compo en AR</span><span style="font-size: 13px; color: var(--muted)">Posez le terrain sur votre table, placez vos onze, publiez ici.</span></button>
          <button type="button" onClick="{{ch.goCard}}" class="cb-deep" style="text-align: left; border: 0; cursor: pointer; background: var(--inv-bg); color: var(--on-inv); border-radius: 0; padding: 1.1rem 1.2rem">
            <span class="eb" style="display: block; font-size: 13px; color: var(--gold-on-inv); margin-bottom: .3rem">Ma carte membre</span>
            <span class="num" style="display: block; font-size: 34px">{{chMe.points}} pts</span>
            <span style="font-size: 13px; color: var(--on-inv-2)">{{chMe.level}} · {{chMe.toNext}}</span>
          </button>
        </aside>
      </div>
    </sc-if>

    <!-- ANNONCES & ENTRAIDE -->
    <sc-if value="{{ch.tAnnonces}}" hint-placeholder-val="{{ false }}">
      <div style="display: flex; gap: .4rem; flex-wrap: wrap; margin-bottom: 1rem"><sc-for list="{{ch.adCats}}" as="ac" hint-placeholder-count="5"><button type="button" class="chip" onClick="{{ac.pick}}" aria-pressed="{{ac.pressed}}" style="min-height: 40px; font-size: 14px; background: {{ac.bg}}; color: {{ac.fg}}; border: 1.5px solid {{ac.border}}">{{ac.label}}</button></sc-for></div>
      <sc-if value="{{ch.showAds}}" hint-placeholder-val="{{ true }}">
        <div style="display: flex; flex-wrap: wrap; gap: 1.25rem; align-items: flex-start">
          <div style="flex: 2 1 420px; display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 260px), 1fr)); gap: .75rem">
            <sc-for list="{{ch.ads}}" as="ad2" hint-placeholder-count="6">
              <article style="background: var(--surface); border: 1px solid var(--line); border-radius: 0; padding: .95rem 1rem; display: flex; flex-direction: column; gap: .4rem">
                <div style="display: flex; gap: .4rem; flex-wrap: wrap"><span class="cond" style="font-size: 11px; padding: .2rem .5rem; border-radius: 0; background: {{ad2.typeBg}}; color: {{ad2.typeFg}}">{{ad2.type}}</span><span class="cond" style="font-size: 11px; padding: .2rem .5rem; border-radius: 0; background: var(--surface-2); color: var(--gold-text)">{{ad2.cat}}</span></div>
                <h3 class="ttl" style="font-size: 20px; margin: 0">{{ad2.title}}</h3>
                <p style="margin: 0; font-size: 14px; color: var(--text-2); line-height: 1.5">{{ad2.text}}</p>
                <div style="font-size: 12.5px; color: var(--muted); margin-top: auto">{{ad2.author}} · {{ad2.where}} · {{ad2.time}}</div>
                <div style="display: flex; gap: .4rem"><button type="button" onClick="{{ad2.contact}}" class="btn btn-ghost" style="flex: 1; min-height: 40px; font-size: 14px">{{ad2.contactLabel}}</button><sc-if value="{{ad2.mine}}" hint-placeholder-val="{{ false }}"><button type="button" onClick="{{ad2.remove}}" class="btn btn-ghost" style="min-height: 40px; font-size: 14px">Retirer</button></sc-if></div>
              </article>
            </sc-for>
          </div>
          <div style="flex: 1 1 280px; background: var(--surface); border: 1px solid var(--line); border-radius: 0; padding: 1.1rem 1.25rem">
            <div class="ttl" style="font-size: 22px; margin-bottom: .8rem">Déposer une annonce</div>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: .5rem; margin-bottom: .6rem"><label class="lbl">Type<x-select class="field" value="{{chf.adType}}" onChange="{{chf.onAdType}}"><x-option value="Propose">Propose</x-option><x-option value="Recherche">Recherche</x-option><x-option value="Donne">Donne</x-option></x-select></label><label class="lbl">Catégorie<x-select class="field" value="{{chf.adCat}}" onChange="{{chf.onAdCat}}"><x-option value="Matériel">Matériel</x-option><x-option value="Bénévolat">Bénévolat</x-option><x-option value="Joueurs">Joueurs</x-option><x-option value="Stages">Stages</x-option></x-select></label></div>
            <label class="lbl" style="margin-bottom: .6rem">Titre<input class="field" value="{{chf.adTitle}}" onChange="{{chf.onAdTitle}}" placeholder="Crampons taille 38, bénévoles buvette…"></label>
            <label class="lbl" style="margin-bottom: .6rem">Détails<textarea class="field" value="{{chf.adText}}" onChange="{{chf.onAdText}}" style="min-height: 80px; padding: .6rem .8rem"></textarea></label>
            <label class="lbl" style="margin-bottom: .8rem">Ville<input class="field" value="{{chf.adWhere}}" onChange="{{chf.onAdWhere}}" placeholder="Cherbourg, Valognes…"></label>
            <button type="button" class="btn btn-dark" onClick="{{ch.publishAd}}" style="width: 100%">Publier l’annonce</button>
            <p style="font-size: 12.5px; color: var(--muted); margin: .8rem 0 0">Annonces modérées par la rédaction. Pas de vente d’articles neufs ni de billetterie.</p>
          </div>
        </div>
      </sc-if>
      <!-- Covoiturage (déplacé depuis Mon quotidien) -->
      <sc-if value="{{ch.showRides}}" hint-placeholder-val="{{ false }}">
        <div style="display: flex; flex-wrap: wrap; gap: 1.25rem; align-items: flex-start">
          <div style="flex: 2 1 420px; display: flex; flex-direction: column; gap: .6rem">
            <sc-for list="{{pv.rides}}" as="rd" hint-placeholder-count="2">
              <div style="background: var(--surface); border: 1px solid var(--line); border-radius: 0; padding: .9rem 1rem; display: flex; flex-wrap: wrap; gap: .75rem; align-items: center">
                <div style="flex: 1 1 240px"><div class="cond" style="font-size: 12px; color: var(--gold-text)">{{rd.when}}</div><div style="font-weight: 800; color: var(--text)">{{rd.match}}</div><div style="font-size: 13px; color: var(--muted)">Départ {{rd.from}} · {{rd.driver}}</div></div>
                <span class="num" style="font-size: 20px; color: var(--ink)">{{rd.seats}}</span><span style="font-size: 12.5px; color: var(--muted)">place(s)</span>
                <button type="button" onClick="{{rd.act}}" class="btn" style="min-height: 40px; font-size: 14px; background: {{rd.btnBg}}; color: {{rd.btnFg}}; border: 1.5px solid var(--ink)">{{rd.btnLabel}}</button>
              </div>
            </sc-for>
          </div>
          <div style="flex: 1 1 280px; background: var(--surface); border: 1px solid var(--line); border-radius: 0; padding: 1.1rem 1.25rem">
            <div class="ttl" style="font-size: 22px; margin-bottom: .8rem">Proposer un trajet</div>
            <label class="lbl" style="margin-bottom: .6rem">Match<x-select class="field" value="{{pf.rideMatch}}" onChange="{{pf.onRideMatch}}"><sc-for list="{{pv.matchOpts}}" as="mo" hint-placeholder-count="4"><x-option value="{{mo.v}}">{{mo.l}}</x-option></sc-for></x-select></label>
            <div style="display: grid; grid-template-columns: 2fr 1fr; gap: .5rem; margin-bottom: .8rem"><label class="lbl">Départ de<input class="field" value="{{pf.rideFrom}}" onChange="{{pf.onRideFrom}}" placeholder="Tourlaville, parking…"></label><label class="lbl">Places<input class="field" type="number" min="1" max="8" value="{{pf.rideSeats}}" onChange="{{pf.onRideSeats}}"></label></div>
            <button type="button" class="btn btn-dark" onClick="{{ch.addRide}}" style="width: 100%">Publier le trajet</button>
            
          </div>
        </div>
      </sc-if>
    </sc-if>

    <!-- ÉVÉNEMENTS -->
    <sc-if value="{{ch.tEvents}}" hint-placeholder-val="{{ false }}">
      <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr)); gap: 1rem">
        <sc-for list="{{ch.events}}" as="ev2" hint-placeholder-count="4">
          <article style="background: var(--surface); border: 1px solid var(--line); border-radius: 0; overflow: hidden; display: flex">
            <div class="cb-deep" style="background: var(--inv-bg); color: var(--on-inv); padding: 1rem .9rem; text-align: center; min-width: 86px; display: flex; flex-direction: column; justify-content: center"><span class="cond" style="font-size: 12px; color: var(--gold-on-inv)">{{ev2.dow}}</span><span class="num" style="font-size: 34px; line-height: 1">{{ev2.day}}</span><span class="cond" style="font-size: 12px; color: var(--on-inv-2)">{{ev2.mon}}</span></div>
            <div style="padding: .9rem 1rem; display: flex; flex-direction: column; gap: .35rem; flex: 1">
              <span class="cond" style="font-size: 11px; color: var(--gold-text)">{{ev2.kind}} · {{ev2.time}}</span>
              <h3 class="ttl" style="font-size: 21px; margin: 0">{{ev2.title}}</h3>
              <p style="margin: 0; font-size: 14px; color: var(--text-2); line-height: 1.5">{{ev2.desc}}</p>
              <div style="font-size: 12.5px; color: var(--muted)">⌖ {{ev2.place}} · {{ev2.going}} participant(s)</div>
              <button type="button" onClick="{{ev2.rsvp}}" class="btn" style="margin-top: .3rem; min-height: 40px; font-size: 14px; background: {{ev2.btnBg}}; color: {{ev2.btnFg}}; border: 1.5px solid var(--ink)">{{ev2.btnLabel}}</button>
            </div>
          </article>
        </sc-for>
      </div>
      
    </sc-if>

    <!-- LIGUE & CLASSEMENT -->
    <sc-if value="{{ch.tLigue}}" hint-placeholder-val="{{ false }}">
      <div style="display: flex; flex-wrap: wrap; gap: 1.5rem; align-items: flex-start">
        <div style="flex: 2 1 420px">
          <h2 class="h2" style="font-size: 2rem; margin-bottom: .4rem">Classement des membres</h2>
          <p style="margin: 0 0 1rem; color: var(--text-2)">Les points se gagnent en pronostiquant les matchs du Terrain, en votant au sondage et au concours photo, en participant aux événements et en publiant au Club House.</p>
          <div style="background: var(--surface); border: 1px solid var(--line); border-radius: 0; overflow: hidden">
            <sc-for list="{{ch.board}}" as="br" hint-placeholder-count="8">
              <div style="display: flex; gap: .8rem; align-items: center; padding: .65rem 1rem; border-bottom: 1px solid var(--line); background: {{br.bg}}">
                <span class="num" style="width: 32px; height: 32px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; background: {{br.rankBg}}; color: {{br.rankFg}}; flex: none">{{br.rank}}</span>
                <span style="flex: 1; font-weight: {{br.weight}}; color: var(--text)">{{br.name}}</span>
                <span class="cond" style="font-size: 11px; color: var(--muted)">{{br.level}}</span>
                <span class="num" style="font-size: 18px; color: var(--ink); min-width: 64px; text-align: right">{{br.points}}</span>
              </div>
            </sc-for>
          </div>
        </div>
        <div style="flex: 1 1 280px; display: flex; flex-direction: column; gap: 1rem">
          <div style="background: var(--surface); border: 1px solid var(--line); border-radius: 0; padding: 1.1rem 1.2rem">
            <div class="eb" style="font-size: 13px; margin-bottom: .6rem">Barème</div>
            <sc-for list="{{ch.scale}}" as="sc" hint-placeholder-count="6"><div style="display: flex; justify-content: space-between; gap: .5rem; padding: .35rem 0; border-bottom: 1px solid var(--line); font-size: 14px"><span style="color: var(--text)">{{sc.what}}</span><strong class="num" style="color: var(--ink)">{{sc.pts}}</strong></div></sc-for>
          </div>
          <div style="background: var(--surface); border: 1px solid var(--line); border-radius: 0; padding: 1.1rem 1.2rem">
            <div class="eb" style="font-size: 13px; margin-bottom: .6rem">Récompenses du mois</div>
            <p style="margin: 0 0 .8rem; font-size: 14px; color: var(--text-2); line-height: 1.5">Les trois premiers gagnent un article de la boutique Cherwood × Casa.</p>
            <button type="button" class="btn btn-dark" onClick="{{ch.goPronos}}" style="width: 100%; min-height: 42px; font-size: 14px">Faire mes pronos</button>
          </div>
        </div>
      </div>
    </sc-if>

    <!-- MA CARTE MEMBRE -->
    <sc-if value="{{ch.tCarte}}" hint-placeholder-val="{{ false }}">
      <div style="display: flex; flex-wrap: wrap; gap: 1.5rem; align-items: flex-start">
        <div style="flex: 1 1 360px; max-width: 460px">
          <div role="radiogroup" aria-label="Couleur de la carte" style="display: flex; gap: .5rem; margin-bottom: .9rem; flex-wrap: wrap"><sc-for list="{{cardColors}}" as="cc" hint-placeholder-count="3"><button type="button" role="radio" aria-checked="{{cc.checked}}" onClick="{{cc.pick}}" style="display: inline-flex; align-items: center; gap: .5rem; min-height: 42px; padding: 0 .9rem 0 .5rem; border-radius: 0; cursor: pointer; font-weight: 800; font-size: 14px; background: var(--surface); color: var(--text); border: 2px solid {{cc.ring}}"><span style="width: 26px; height: 26px; border-radius: 50%; background: {{cc.sw}}; box-shadow: inset 0 0 0 1px rgba(0,0,0,.2)"></span>{{cc.label}}</button></sc-for></div>
          <div style="aspect-ratio: 1.586 / 1; border-radius: 0; padding: 1.2rem 1.3rem; background: {{card.bg}}; color: {{card.fg}}; position: relative; overflow: hidden; isolation: isolate; box-shadow: 0 30px 60px -28px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.35)">
            <span aria-hidden="true" style="position: absolute; inset: 0; z-index: -1; background: linear-gradient(115deg, transparent 30%, rgba(255,255,255,{{card.shine}}) 45%, transparent 60%); pointer-events: none"></span>
            <svg viewBox="0 0 500 315" preserveAspectRatio="xMidYMid slice" aria-hidden="true" style="position: absolute; inset: 0; width: 100%; height: 100%; z-index: -1"><g transform="translate(0 64)">
              <g fill="none" stroke="{{card.line}}" stroke-linejoin="round">
                <path d="M0 214 L18 196 L34 176 L46 150 L58 124 L72 118 L92 126 L114 122 L134 128 L156 138 L182 146 L206 152 L226 150 L246 147 L262 149 L272 158 L284 152 L304 150 L326 142 L346 134 L364 128 L384 136 L404 140 L424 132 L446 122 L462 114 L474 118 L482 138 L490 168 L500 196" transform="translate(0 -14)" opacity=".28" stroke-width="1"></path>
                <path d="M0 214 L18 196 L34 176 L46 150 L58 124 L72 118 L92 126 L114 122 L134 128 L156 138 L182 146 L206 152 L226 150 L246 147 L262 149 L272 158 L284 152 L304 150 L326 142 L346 134 L364 128 L384 136 L404 140 L424 132 L446 122 L462 114 L474 118 L482 138 L490 168 L500 196" transform="translate(0 -28)" opacity=".18" stroke-width="1"></path>

        <div class="rx-side-h" style="margin-bottom: .9rem"><h2 class="ttl" style="font-size: 1.6rem; margin: 0">{{rx.dlg.title}}</h2><button type="button" class="rx-ico" onClick="{{rx.dlg.close}}" aria-label="Fermer">×</button></div>

        <sc-if value="{{rx.dlg.isNewEd}}" hint-placeholder-val="{{ false }}">
          <div class="rx-row2"><label class="lbl">Hériter des pages de<x-select class="field" value="{{rx.dlg.src}}" onChange="{{rx.dlg.onSrc}}"><sc-for list="{{rx.dlg.srcOpts}}" as="o" hint-placeholder-count="2"><x-option value="{{o.v}}">{{o.l}}</x-option></sc-for></x-select></label><label class="lbl">Date de parution<input class="field" type="date" value="{{rx.dlg.date}}" onChange="{{rx.dlg.onDate}}"></label></div>
          <sc-if value="{{rx.dlg.hasSrc}}" hint-placeholder-val="{{ false }}">
            <p class="rx-muted" style="margin: .2rem 0 .6rem">Les pages cochées sont associées à l’édition bouclée : identiques, elles restent verrouillées et suivent leur page source jusqu’à ce que vous les dissociiez. Décochez une page pour repartir d’une page vierge.</p>
            <div class="rx-checks"><sc-for list="{{rx.dlg.srcPages}}" as="sp" hint-placeholder-count="6"><label class="rx-check"><input type="checkbox" checked="{{sp.checked}}" onChange="{{sp.toggle}}">{{sp.label}}</label></sc-for></div>
          </sc-if>
          <div class="rx-item-act" style="margin-top: 1rem"><button type="button" class="btn btn-dark" onClick="{{rx.dlg.create}}">Créer l’édition</button><button type="button" class="btn btn-ghost" onClick="{{rx.dlg.close}}">Annuler</button></div>
        </sc-if>

        <sc-if value="{{rx.dlg.isReuse}}" hint-placeholder-val="{{ false }}">
          <div class="rx-row2"><label class="lbl">Titre source<x-select class="field" value="{{rx.dlg.rTitle}}" onChange="{{rx.dlg.onRTitle}}"><sc-for list="{{rx.dlg.titleOpts}}" as="o" hint-placeholder-count="3"><x-option value="{{o.v}}">{{o.l}}</x-option></sc-for></x-select></label><label class="lbl">Édition (toutes dates)<x-select class="field" value="{{rx.dlg.rEd}}" onChange="{{rx.dlg.onREd}}"><sc-for list="{{rx.dlg.edOpts}}" as="o" hint-placeholder-count="3"><x-option value="{{o.v}}">{{o.l}}</x-option></sc-for></x-select></label></div>
          <div class="rx-chips" style="margin-top: .6rem; max-height: 260px; overflow: auto"><sc-for list="{{rx.dlg.rPages}}" as="rp" hint-placeholder-count="6"><button type="button" class="chip" onClick="{{rp.pick}}" aria-pressed="{{rp.sel}}" style="min-height: 36px; font-size: 13px; background: {{rp.bg}}; color: {{rp.fg}}; border: 1.5px solid var(--line-2)">{{rp.label}}</button></sc-for></div>
          <sc-if value="{{rx.dlg.diffCharte}}" hint-placeholder-val="{{ false }}"><p class="rx-muted">Charte différente : la page arrive telle quelle, puis « Appliquer nos modèles » la reconstruit avec vos cartons, votre grille et vos couleurs.</p></sc-if>
          <div class="rx-item-act" style="margin-top: 1rem"><button type="button" class="btn btn-dark" onClick="{{rx.dlg.reuse}}" disabled="{{rx.dlg.cantReuse}}">Reprendre la page</button><button type="button" class="btn btn-ghost" onClick="{{rx.dlg.close}}">Annuler</button></div>
        </sc-if>

        <sc-if value="{{rx.dlg.isAdd}}" hint-placeholder-val="{{ false }}">
          <div class="rx-chips"><sc-for list="{{rx.dlg.addKinds}}" as="ak" hint-placeholder-count="4"><button type="button" class="chip" onClick="{{ak.pick}}" aria-pressed="{{ak.pressed}}" style="min-height: 36px; font-size: 13.5px; background: {{ak.bg}}; color: {{ak.fg}}; border: 1.5px solid {{ak.border}}">{{ak.label}}</button></sc-for></div>
          <div class="rx-row2"><label class="lbl">Page<x-select class="field" value="{{rx.dlg.page}}" onChange="{{rx.dlg.onPage}}"><sc-for list="{{rx.dlg.pageOpts}}" as="o" hint-placeholder-count="4"><x-option value="{{o.v}}">{{o.l}}</x-option></sc-for></x-select></label><sc-if value="{{rx.dlg.hasTpl}}" hint-placeholder-val="{{ true }}"><label class="lbl">Carton ou modèle<x-select class="field" value="{{rx.dlg.tpl}}" onChange="{{rx.dlg.onTpl}}"><sc-for list="{{rx.dlg.tplOpts}}" as="o" hint-placeholder-count="3"><x-option value="{{o.v}}">{{o.l}}</x-option></sc-for></x-select></label></sc-if></div>
          <sc-if value="{{rx.dlg.isPub}}" hint-placeholder-val="{{ false }}">

          <sc-if value="{{rx.dlg.showQ}}" hint-placeholder-val="{{ true }}"><label class="rx-search" style="margin: .7rem 0"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg><input aria-label="Rechercher" value="{{rx.dlg.q}}" onChange="{{rx.dlg.onQ}}" placeholder="{{rx.dlg.qPh}}"></label></sc-if>

            <sc-for list="{{rx.dlg.results}}" as="rs" hint-placeholder-count="4">

            </sc-for>
          </div>
        </sc-if>

        <sc-if value="{{rx.dlg.isLivrer}}" hint-placeholder-val="{{ false }}">

        <sc-if value="{{rx.dlg.isClose}}" hint-placeholder-val="{{ false }}">

        <sc-if value="{{rx.dlg.isFil}}" hint-placeholder-val="{{ false }}">

          <p class="rx-muted" style="margin: .6rem 0">{{rx.dlg.photoInfo}} Le contenu part brut : titre, chapeau, texte et crédits. La rédaction qui le reçoit le relit avant toute publication.</p>
          <label class="lbl" style="margin-bottom: .8rem">Mot pour la rédaction partenaire<input class="field" value="{{rx.dlg.note}}" onChange="{{rx.dlg.onNote}}" placeholder="Facultatif"></label>

      </div>

        <sc-for list="{{rx.prod.global}}" as="ge" hint-placeholder-count="2">
          <section>
            <div class="rx-flexline" style="margin-bottom: .5rem"><strong class="ttl" style="font-size: 1.3rem">{{ge.label}}</strong><span class="rx-muted">{{ge.date}} · {{ge.stLabel}}</span></div>

              <sc-for list="{{ge.pages}}" as="pp" hint-placeholder-count="8">

          </section>

        <sc-if value="{{rx.aide.isFiche}}" hint-placeholder-val="{{ false }}">

            <sc-for list="{{sec.p}}" as="pp" hint-placeholder-count="1"><p style="margin: 0 0 .6rem; line-height: 1.6; font-size: 14.5px">{{pp.t}}</p></sc-for>

            <sc-if value="{{sec.hasCode}}" hint-placeholder-val="{{ false }}"><pre class="rx-pre">{{sec.code}}</pre></sc-if>
          </sc-for>
        </sc-if>
      </div>
    </aside>
  </sc-if>
</sc-if>

<sc-if value="{{loginOpen}}" hint-placeholder-val="{{ false }}">
  <div style="position: fixed; inset: 0; z-index: 60; background: rgba(8,15,26,.45); display: flex; justify-content: center; align-items: center; padding: 1rem">
    <div role="dialog" aria-label="Connexion" style="width: 100%; max-width: 440px; max-height: calc(100dvh - 2rem); overflow-y: auto; background: var(--surface); border-radius: 0; padding: 2rem; box-shadow: 0 30px 80px rgba(8,15,26,.4)">
      <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 1rem"><div class="ttl" style="font-size: 32px">Connexion</div><button type="button" onClick="{{closeLogin}}" aria-label="Fermer" style="width: 44px; height: 44px; border: 0; background: var(--surface-2); border-radius: 50%; cursor: pointer; font-size: 20px; color: var(--text)">×</button></div>
      <sc-if value="{{linkNotSent}}" hint-placeholder-val="{{ true }}">
        <div role="tablist" aria-label="Compte" style="display: flex; gap: .4rem; margin-bottom: 1.25rem">
          <button type="button" role="tab" aria-selected="{{loginPwAria}}" class="{{loginPwCls}}" onClick="{{setLoginPw}}" style="flex: 1; min-height: 44px; font-size: 15px">J’ai un compte</button>
          <button type="button" role="tab" aria-selected="{{loginNewAria}}" class="{{loginNewCls}}" onClick="{{setLoginNew}}" style="flex: 1; min-height: 44px; font-size: 15px">Créer un compte</button>
        </div>
        <sc-if value="{{loginByPw}}" hint-placeholder-val="{{ true }}">
          <label class="lbl" style="margin-bottom: 1rem">E-mail ou numéro de mobile<input class="field" type="text" autocomplete="username" value="{{loginId}}" onChange="{{onLoginId}}" placeholder="vous@exemple.fr ou 06 12 34 56 78"></label>
          <label class="lbl" style="margin-bottom: 1rem">Mot de passe<input class="field" type="password" autocomplete="current-password" value="{{pw}}" onChange="{{onPw}}"></label>
          <sc-if value="{{formError}}" hint-placeholder-val="{{ false }}"><div role="alert" style="color: var(--danger); font-weight: 700; font-size: 14px; margin-bottom: 1rem">{{formError}}</div></sc-if>
          <button type="button" class="btn btn-dark" onClick="{{pwLogin}}" disabled="{{authBusy}}" style="width: 100%">{{pwLoginLabel}}</button>
          <div style="display: flex; justify-content: space-between; gap: 1rem; flex-wrap: wrap; margin-top: .75rem">
            <button type="button" class="crumb" onClick="{{setLoginReset}}">Mot de passe oublié ?</button>
            <button type="button" class="crumb" onClick="{{setLoginNew}}">Connexion par lien ou SMS</button>
          </div>
        </sc-if>
        <sc-if value="{{loginByReset}}" hint-placeholder-val="{{ false }}">
          <sc-if value="{{resetNotSent}}" hint-placeholder-val="{{ true }}">
            <p style="color: var(--text-2); margin: 0 0 1rem">Indiquez l’e-mail de votre compte : vous recevrez un lien pour choisir un nouveau mot de passe. Compte créé par SMS ? Utilisez « Créer un compte › Téléphone mobile » pour recevoir un code.</p>
            <label class="lbl" style="margin-bottom: 1rem">E-mail<input class="field" type="email" autocomplete="email" value="{{email}}" onChange="{{onEmail}}" placeholder="vous@exemple.fr"></label>
            <sc-if value="{{formError}}" hint-placeholder-val="{{ false }}"><div role="alert" style="color: var(--danger); font-weight: 700; font-size: 14px; margin-bottom: 1rem">{{formError}}</div></sc-if>
            <button type="button" class="btn btn-dark" onClick="{{sendReset}}" disabled="{{authBusy}}" style="width: 100%">{{resetLabel}}</button>
          </sc-if>
          <sc-if value="{{resetSent}}" hint-placeholder-val="{{ false }}">
            <p style="color: var(--text-2); margin: 0 0 1rem">Lien envoyé à <strong>{{email}}</strong>. Ouvrez-le pour choisir votre nouveau mot de passe (pensez aux indésirables).</p>
          </sc-if>
          <button type="button" class="crumb" onClick="{{setLoginPw}}" style="margin-top: .75rem">Retour à la connexion</button>
        </sc-if>
        <sc-if value="{{loginBySignup}}" hint-placeholder-val="{{ false }}">

        <div role="tablist" aria-label="Mode de connexion" style="display: flex; gap: .4rem; margin-bottom: 1rem">
          <button type="button" role="tab" aria-selected="{{loginByEmailAria}}" class="{{loginEmailCls}}" onClick="{{setLoginEmail}}" style="flex: 1; min-height: 44px; font-size: 15px">E-mail</button>
          <button type="button" role="tab" aria-selected="{{loginByPhoneAria}}" class="{{loginPhoneCls}}" onClick="{{setLoginPhone}}" style="flex: 1; min-height: 44px; font-size: 15px">Téléphone mobile</button>
        </div>

        <sc-if value="{{loginByEmail}}" hint-placeholder-val="{{ true }}">

          <sc-if value="{{formError}}" hint-placeholder-val="{{ false }}"><div role="alert" style="color: var(--danger); font-weight: 700; font-size: 14px; margin-bottom: 1rem">{{formError}}</div></sc-if>
          <button type="button" class="btn btn-dark" onClick="{{sendLink}}" disabled="{{authBusy}}" style="width: 100%">{{sendLinkLabel}}</button>
        </sc-if>
        <sc-if value="{{loginByPhone}}" hint-placeholder-val="{{ false }}">
          <sc-if value="{{codeNotSent}}" hint-placeholder-val="{{ true }}">
            <label class="lbl" style="margin-bottom: 1rem">Numéro de mobile<input class="field" type="tel" autocomplete="tel" inputmode="tel" value="{{phone}}" onChange="{{onPhone}}" placeholder="06 12 34 56 78"></label>
            <sc-if value="{{formError}}" hint-placeholder-val="{{ false }}"><div role="alert" style="color: var(--danger); font-weight: 700; font-size: 14px; margin-bottom: 1rem">{{formError}}</div></sc-if>
            <button type="button" class="btn btn-dark" onClick="{{sendSms}}" disabled="{{authBusy}}" style="width: 100%">{{sendSmsLabel}}</button>
          </sc-if>
          <sc-if value="{{codeSent}}" hint-placeholder-val="{{ false }}">

            <sc-if value="{{formError}}" hint-placeholder-val="{{ false }}"><div role="alert" style="color: var(--danger); font-weight: 700; font-size: 14px; margin-bottom: 1rem">{{formError}}</div></sc-if>

            <button type="button" class="crumb" onClick="{{resetSms}}" style="margin-top: .5rem">Changer de numéro ou renvoyer le code</button>
          </sc-if>
        </sc-if>
        </sc-if>
      </sc-if>
      <sc-if value="{{linkSent}}" hint-placeholder-val="{{ false }}">
        <sc-if value="{{authLive}}" hint-placeholder-val="{{ false }}">
          <p style="color: var(--text-2); margin: 0 0 1.25rem">Un lien de connexion a été envoyé à <strong>{{email}}</strong>. Ouvrez-le depuis cet appareil pour vous connecter. Pensez à regarder dans les indésirables.</p>

        </sc-if>
        <sc-if value="{{authDemo}}" hint-placeholder-val="{{ true }}">

          <button type="button" class="btn btn-gold" onClick="{{doLogin}}" style="width: 100%">Ouvrir le lien de connexion</button>
        </sc-if>
      </sc-if>
    </div>
  </div>

<!-- Visionneuse d'œuvre -->
<sc-if value="{{workOpen}}" hint-placeholder-val="{{ false }}">
  <div role="dialog" aria-label="{{wo.title}}" style="position: fixed; inset: 0; z-index: 62; background: rgba(5,8,12,.94); display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 1.5rem; padding: 1rem; overflow-y: auto">
    <button type="button" onClick="{{closeWork}}" aria-label="Fermer" style="position: fixed; top: 14px; right: 14px; width: 48px; height: 48px; border-radius: 50%; border: 0; background: rgba(255,255,255,.12); color: #fff; cursor: pointer; font-size: 22px; z-index: 1">×</button>
    <div class="{{wo.scope}}" style="flex: 1 1 520px; max-width: 900px; display: flex; justify-content: center"><img src="{{wo.img}}" alt="{{wo.alt}}" style="max-width: 100%; max-height: 80vh; object-fit: contain; background: {{wo.bg}}; box-shadow: 0 30px 80px rgba(0,0,0,.6)"></div>
    <aside style="flex: 0 1 340px; color: #e9e2d2">
      <div class="cond" style="font-size: 12px; color: #ffffff">Salle {{wo.room}} · œuvre {{wo.pos}}</div>

</sc-if>

<!-- Personnaliser l'accueil -->
<sc-if value="{{customizeOpen}}" hint-placeholder-val="{{ false }}">
  <div style="position: fixed; inset: 0; z-index: 61; background: var(--overlay); display: flex; justify-content: center; align-items: center; padding: 1rem">
    <div role="dialog" aria-label="Personnaliser l’accueil" class="float-in" style="width: 100%; max-width: 520px; max-height: 90vh; overflow-y: auto; background: var(--surface); color: var(--text); border-radius: 0; padding: 1.5rem; box-shadow: 0 30px 80px -20px var(--shadow)">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: .4rem"><span class="ttl" style="font-size: 28px">Personnaliser l’accueil</span><button type="button" onClick="{{closeCustomize}}" aria-label="Fermer" style="width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--surface-2); cursor: pointer; font-size: 20px; color: var(--text)">×</button></div>
      <p style="margin: 0 0 1rem; color: var(--muted); font-size: 14px">Affichez, masquez et réordonnez les blocs. Enregistré sur cet appareil.</p>
      <div class="lbl" style="margin-bottom: .5rem">Disposition</div>
      <div role="radiogroup" aria-label="Disposition de l’accueil" style="display: grid; grid-template-columns: 1fr 1fr; gap: .5rem; margin-bottom: 1.25rem">
        <sc-for list="{{layouts}}" as="ly" hint-placeholder-count="2"><button type="button" role="radio" aria-checked="{{ly.checked}}" onClick="{{ly.pick}}" style="text-align: left; padding: .75rem; border-radius: 0; cursor: pointer; background: var(--surface); color: var(--text); border: 2px solid {{ly.border}}"><span style="display: block; font-weight: 800">{{ly.label}}</span><span style="font-size: 12.5px; color: var(--muted)">{{ly.desc}}</span></button></sc-for>
      </div>
      <div class="lbl" style="margin-bottom: .5rem">Blocs du tableau de bord</div>
      <div style="display: flex; flex-direction: column; gap: .4rem">
        <sc-for list="{{modRows}}" as="mr" hint-placeholder-count="10">
          <div style="display: flex; align-items: center; gap: .5rem; border: 1px solid var(--line); border-radius: 0; padding: .35rem .35rem .35rem .75rem; background: var(--surface-3)">
            <label style="flex: 1; display: flex; align-items: center; gap: .6rem; cursor: pointer; min-height: 40px; font-weight: 700"><input type="checkbox" checked="{{mr.on}}" onChange="{{mr.toggle}}" style="width: 20px; height: 20px; accent-color: var(--ink)">{{mr.label}}</label>
            <button type="button" onClick="{{mr.up}}" aria-label="Monter {{mr.label}}" style="width: 40px; height: 40px; border-radius: 0; border: 1px solid var(--line-2); background: var(--surface); cursor: pointer; color: var(--text)">↑</button>
            <button type="button" onClick="{{mr.down}}" aria-label="Descendre {{mr.label}}" style="width: 40px; height: 40px; border-radius: 0; border: 1px solid var(--line-2); background: var(--surface); cursor: pointer; color: var(--text)">↓</button>
          </div>
        </sc-for>
      </div>
      <div style="display: flex; gap: .5rem; margin-top: 1.25rem"><button type="button" class="btn btn-ghost" onClick="{{resetModules}}" style="flex: 1">Réinitialiser</button><button type="button" class="btn btn-dark" onClick="{{closeCustomize}}" style="flex: 1">Terminé</button></div>
    </div>
  </div>
</sc-if>

<!-- ================= ASSISTANT CASA IA ================= -->
<sc-if value="{{aiOpen}}" hint-placeholder-val="{{ false }}">
  <div role="dialog" aria-label="Casa IA, assistant" class="glass float-in lift90" style="position: fixed; right: 16px; bottom: 90px; z-index: 56; width: min(420px, calc(100vw - 32px)); height: min(620px, calc(100vh - 130px)); border-radius: 0; border: 1px solid var(--line); box-shadow: 0 30px 80px -20px rgba(8,15,26,.45); display: flex; flex-direction: column; overflow: hidden">
    <div class="cb-deep" style="background: var(--inv-bg); color: var(--on-inv); padding: 1rem 1.1rem; display: flex; align-items: center; gap: .75rem">
      <img src="assets/ia_viking.jpg" alt="Casa IA, l’assistant de Casa Besports +" style="width: 48px; height: 48px; border-radius: 50%; object-fit: cover; flex: none; box-shadow: 0 0 0 2px #ffffff">
      <div style="flex: 1"><div class="ttl" style="font-size: 22px; color: var(--on-inv)">Casa IA</div><div style="font-size: 12px; color: var(--on-inv-2)">{{aiMode}}</div></div>
      <button type="button" onClick="{{aiReset}}" class="cond" style="background: var(--inv-bg-2); color: var(--on-inv-2); border: 0; border-radius: 0; min-height: 36px; padding: 0 .7rem; font-size: 12px; cursor: pointer">Nouvelle</button>
    </div>
    <div style="flex: 1; overflow-y: auto; padding: 1rem; display: flex; flex-direction: column; gap: .75rem">
      <sc-for list="{{aiMsgs}}" as="m" hint-placeholder-count="2">
        <div style="align-self: {{m.align}}; max-width: 92%; display: flex; gap: .5rem; align-items: flex-start">
        <sc-if value="{{m.isBot}}" hint-placeholder-val="{{ true }}"><img src="assets/ia_viking.jpg" alt="" style="width: 28px; height: 28px; border-radius: 50%; object-fit: cover; flex: none; margin-top: 2px"></sc-if>
        <div style="display: flex; flex-direction: column; gap: .4rem; min-width: 0">
          <div style="background: {{m.bg}}; color: {{m.fg}}; padding: .7rem .9rem; border-radius: 0; font-size: 14.5px; line-height: 1.5; white-space: pre-line; border: 1px solid {{m.border}}">{{m.text}}</div>
          <div style="display: flex; flex-wrap: wrap; gap: .35rem">
            <sc-for list="{{m.actions}}" as="a" hint-placeholder-count="0">
              <button type="button" onClick="{{a.run}}" class="cond" style="min-height: 36px; padding: 0 .75rem; border-radius: 0; border: 1.5px solid var(--ink); background: var(--surface); color: var(--ink); font-size: 12.5px; cursor: pointer">{{a.label}}</button>
            </sc-for>
          </div>
        </div>
        </div>
      </sc-for>
      <sc-if value="{{aiTyping}}" hint-placeholder-val="{{ false }}"><div class="pulse" style="align-self: flex-start; background: var(--surface); border: 1px solid var(--line); border-radius: 0; padding: .6rem .9rem; font-size: 14px; color: var(--muted)">Casa IA réfléchit…</div></sc-if>
    </div>
    <div style="padding: .5rem .75rem 0; display: flex; gap: .35rem; overflow-x: auto">
      <sc-for list="{{aiSuggest}}" as="sg" hint-placeholder-count="4">
        <button type="button" onClick="{{sg.run}}" style="flex: none; min-height: 34px; padding: 0 .75rem; border-radius: 0; border: 1px solid var(--line-2); background: var(--surface); font-size: 12.5px; color: var(--text); cursor: pointer; white-space: nowrap">{{sg.label}}</button>
      </sc-for>
    </div>
    <div style="padding: .75rem; display: flex; gap: .5rem">
      <label style="flex: 1"><span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Votre question</span><input class="field" value="{{aiInput}}" onChange="{{onAiInput}}" placeholder="Score, maillot, Gazette, histoire…" style="border-radius: 0"></label>
      <button type="button" onClick="{{aiSend}}" aria-label="Envoyer" style="width: 48px; height: 48px; border-radius: 50%; border: 0; background: {{accent}}; color: var(--on-acc); cursor: pointer; display: flex; align-items: center; justify-content: center; flex: none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></button>
    </div>
  </div>
</sc-if>

<!-- ================= LISEUSE : LA GAZETTE DU COTENTIN (édition « Le bandeau » : noir et blanc, comme le logo) ================= -->
<sc-if value="{{readerOpen}}" hint-placeholder-val="{{ false }}">
  <div role="dialog" aria-modal="true" aria-label="La Gazette du Cotentin, numéro d’essai" class="cb-scope-light gz-desk">
    <div class="gz-bar">
      <span class="gz-mast">La Gazette <span>du Cotentin</span></span>
      <span class="gz-folio">{{gzCover.numero}} · page {{pageNo}} / {{pageTotal}}</span>
      <span class="gz-sp"></span>
      <button type="button" onClick="{{gotoToc}}" class="gz-tool">Sommaire</button>
      <sc-if value="{{hasChoc}}" hint-placeholder-val="{{ false }}"><button type="button" onClick="{{gotoChoc}}" class="gz-tool gz-tool-choc" aria-label="Le détail choc, page {{chocPage}}"><span aria-hidden="true">🔥</span><span class="gz-tool-l"> Détail choc</span></button></sc-if>
      <button type="button" onClick="{{readerFont}}" class="gz-tool gz-tool-aa" aria-label="Taille du texte">Aa {{readerFontLabel}}</button>
      <button type="button" onClick="{{closeReader}}" aria-label="Fermer la liseuse" class="gz-tool gz-x">×</button>
    </div>
    <div class="gz-prog" aria-hidden="true"><div style="width: {{gzProg}}"></div></div>

    <div class="gz-scroll" id="gz-scroll">
      <article class="gz-page {{pg.pageCls}}" style="font-size: {{readerSize}}">

        <!-- en-tête courant : le titre du journal, le numéro, la rubrique et le titre de la page sur son bandeau -->
        <sc-if value="{{pg.hasRunning}}" hint-placeholder-val="{{ false }}">
          <header class="gz-run"><span>La Gazette du Cotentin</span><span>{{gzCover.numDate}}</span></header>
          <div class="gz-rubline"><span class="gz-etiq">{{pg.rubric}}</span><sc-if value="{{pg.hasScript}}" hint-placeholder-val="{{ true }}"><span class="gz-sub">{{pg.script}}</span></sc-if></div>
          <sc-if value="{{pg.showH}}" hint-placeholder-val="{{ true }}"><h2 class="gz-h"><span class="gz-band">{{pg.tA}}</span><sc-if value="{{pg.hasTB}}" hint-placeholder-val="{{ true }}">{{pg.tB}}</sc-if></h2></sc-if>
        </sc-if>

        <!-- COUVERTURE -->
        <sc-if value="{{pg.isCover}}" hint-placeholder-val="{{ true }}">
          <header class="gz-cv-head">
            <h1 class="gz-cv-mast"><span class="gz-band">La Gazette</span><br><span class="gz-band">du Cotentin</span></h1>
            <div class="gz-cv-side">Le sport <br>selon <br>Casa Besports +</div>
          </header>
          <div class="gz-cv-folio"><span>{{gzCover.numero}}</span><span>{{gzCover.date}}</span><span>{{gzCover.mention}}</span></div>
          <div class="gz-cv-kick"><span class="gz-etiq">{{gzCover.surtitre}}</span></div>
          <div class="gz-cv-t"><span class="gz-band">{{gzCover.titre}}</span></div>
          <p class="gz-cv-s">{{gzCover.accroche}}</p>
          <figure class="gz-fig gz-cv-fig">
            <img src="{{gzCover.image}}" alt="">
            <sc-if value="{{gzCover.hasLegende}}" hint-placeholder-val="{{ false }}"><figcaption>{{gzCover.legende}}</figcaption></sc-if>

      startCamera(stage, 'environment').then(function () { bCam.setAttribute('aria-pressed', 'true'); st.stopGyro = gyro(S); setHint('Inclinez le téléphone pour regarder autour'); }).catch(function () { toast('Caméra indisponible ici : mode 3D'); });
    });

})();
