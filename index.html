      <sc-for list="{{videos}}" as="v" hint-placeholder-count="3">
        <div class="card cb-deep" style="border: 0; background: var(--inv-bg)"><button type="button" class="hit" onClick="{{v.open}}" style="aspect-ratio: 16 / 10; position: relative; color: var(--on-inv)">
          <img class="zimg" src="{{v.img}}" alt="{{v.alt}}" style="position: absolute; inset: 0"><div class="veilB" style="position: absolute; inset: 0"></div><sc-if value="{{v.hasDuree}}" hint-placeholder-val="{{ false }}"><span class="rx-dur" style="top: 14px; right: 14px; bottom: auto">{{v.duree}}</span></sc-if>

          <span style="position: absolute; left: 1.1rem; right: 1.1rem; bottom: 1rem"><span class="cond" style="display: block; font-size: 13px; color: var(--gold-on-inv)">{{v.tag}} · {{v.date}}</span><span class="ttl" style="display: block; font-size: 24px; color: var(--on-inv)">{{v.title}}</span></span>
        </button></div>

</sc-if>

<!-- ================= VIDÉO ================= -->
<sc-if value="{{isVideo}}" hint-placeholder-val="{{ false }}">
  <section class="wrap" style="padding-top: 1.5rem; padding-bottom: 5rem">
    <div class="cb-deep" style="position: relative; aspect-ratio: 16 / 9; background: var(--inv-bg); border-radius: 0; overflow: hidden">
      <img src="{{vid.img}}" alt="{{vid.alt}}" style="width: 100%; height: 100%; object-fit: cover; display: block; opacity: {{vidDim}}">
      <div class="veilB" style="position: absolute; inset: 0"></div>
      <button type="button" onClick="{{togglePlay}}" aria-label="{{playLabel}}" style="position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%); width: 92px; height: 92px; border-radius: 50%; background: {{accent}}; border: 0; cursor: pointer; color: var(--on-acc); display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 30px rgba(0,0,0,.35)">
        <sc-if value="{{notPlaying}}" hint-placeholder-val="{{ true }}"><svg width="32" height="32" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"></path></svg></sc-if>
        <sc-if value="{{playing}}" hint-placeholder-val="{{ false }}"><svg width="30" height="30" viewBox="0 0 24 24" fill="currentColor"><path d="M7 5h4v14H7zM13 5h4v14h-4z"></path></svg></sc-if>

        <div style="height: 4px; background: rgba(255,255,255,.25); border-radius: 0; overflow: hidden; margin-bottom: .6rem"><sc-if value="{{playing}}" hint-placeholder-val="{{ false }}"><div class="run" style="height: 4px; background: {{accent}}"></div></sc-if></div>
        <div class="cond" style="font-size: 13px; color: var(--on-inv)">{{playState}}</div>

    <div style="display: flex; flex-wrap: wrap; gap: 2rem; margin-top: 2rem; align-items: flex-start; justify-content: space-between">
      <div style="flex: 1 1 480px">

        <h1 class="h1 bn-casse" style="font-size: clamp(2rem, 4vw, 3.2rem); margin-bottom: 1rem">{{vid.title}}</h1>
        <p style="color: var(--text-2); line-height: 1.65; margin: 0 0 1.5rem; font-size: 1.05rem">{{vid.dek}}</p>

        <div style="display: flex; flex-direction: column; gap: .75rem">
          <sc-for list="{{otherVideos}}" as="v" hint-placeholder-count="2">

          </sc-for>
        </div>
      </div>
    </div>
  </section>
</sc-if>

<!-- ================= DISCIPLINES ================= -->

<!-- ================= DISCIPLINE ================= -->
<sc-if value="{{isDiscipline}}" hint-placeholder-val="{{ false }}">

    <div class="eb" style="margin-bottom: .5rem">Discipline</div>

    <p style="color: var(--text-2); margin: 0 0 1.25rem; font-size: 1.1rem">{{disc.stats}}</p>
    <div style="display: flex; gap: .6rem; flex-wrap: wrap; margin-bottom: 2.5rem"><button type="button" class="btn btn-dark" onClick="{{disc.openBoard}}">Résultats, agenda et classement</button><button type="button" class="btn btn-ghost" onClick="{{disc.openShop}}">Boutique</button></div>
    <sc-if value="{{disc.empty}}" hint-placeholder-val="{{ false }}">
      <div style="border: 1.5px dashed var(--line-2); border-radius: 0; padding: 3rem 1.5rem; text-align: center">
        <div class="ttl" style="font-size: 30px; margin-bottom: .5rem">Bientôt sur Casa Besports</div>
        <p style="margin: 0 0 1.25rem; color: var(--text-2)">Vous jouez, entraînez ou organisez dans cette discipline ? Racontez-nous votre histoire.</p>
        <button type="button" class="btn btn-gold" onClick="{{proposeTopic}}">Proposer un sujet</button>
      </div>
    </sc-if>
    <sc-if value="{{disc.hasArticles}}" hint-placeholder-val="{{ true }}">
      <h2 class="h2" style="font-size: 2rem; margin-bottom: 1.25rem">Articles</h2>

        <sc-for list="{{disc.articles}}" as="a" hint-placeholder-count="3">

        </sc-for>
      </div>
    </sc-if>
    <sc-if value="{{disc.hasClubs}}" hint-placeholder-val="{{ true }}">
      <h2 class="h2" style="font-size: 2rem; margin-bottom: 1.25rem">Clubs</h2>
      <div class="grid4">

<sc-if value="{{isLive}}" hint-placeholder-val="{{ false }}">

      <div style="font-size: 13px; color: var(--muted); text-align: right">Mise à jour : {{updatedAgo}}<br><span class="cond" style="font-size: 12px; color: {{srcColor}}">{{srcLabel}}</span></div>

    </div>

      <div style="display: flex; gap: .4rem; flex-wrap: wrap; margin-bottom: 1.25rem; align-items: center">

        <sc-for list="{{dComps}}" as="c" hint-placeholder-count="2">
          <button type="button" onClick="{{c.pick}}" aria-pressed="{{c.pressed}}" style="min-height: 40px; padding: 0 .9rem; border-radius: 0; cursor: pointer; font-weight: 700; font-size: 14px; background: {{c.bg}}; color: {{c.fg}}; border: 1.5px solid {{c.border}}">{{c.label}}</button>

        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr)); gap: .6rem">

              <span style="flex: 1"><span style="display: block; font-weight: 800; color: var(--text)">{{w.city}}</span><span style="font-size: 12.5px; color: var(--muted)">{{w.label}} · vent {{w.wind}}</span></span>

    </div>

    <sc-if value="{{sportEmpty}}" hint-placeholder-val="{{ false }}">
      <div style="border: 1.5px dashed var(--line-2); border-radius: 0; padding: 3rem 1.5rem; text-align: center">
        <div class="ttl" style="font-size: 30px; margin-bottom: .5rem">Pas encore de données pour {{dSportName}}</div>
        <p style="margin: 0 0 1.25rem; color: var(--text-2)">Clubs et organisateurs : envoyez vos résultats, on les publie en direct.</p>
        <div style="display: flex; gap: .6rem; justify-content: center; flex-wrap: wrap"><button type="button" class="btn btn-gold" onClick="{{submitResult}}">Transmettre un résultat</button><button type="button" class="btn btn-ghost" onClick="{{proposeTopic}}">Proposer un sujet</button></div>
      </div>
    </sc-if>

    <sc-if value="{{sportHasData}}" hint-placeholder-val="{{ true }}">
      <!-- DIRECT -->
      <sc-if value="{{tabLive}}" hint-placeholder-val="{{ true }}">
        <sc-if value="{{noLive}}" hint-placeholder-val="{{ false }}"><p style="color: var(--text-2); margin: 0 0 1.5rem">Aucun match en direct dans cette compétition. Prochains rendez-vous :</p></sc-if>
        <div class="grid3">
          <sc-for list="{{liveCards}}" as="m" hint-placeholder-count="2">
            <button type="button" onClick="{{m.open}}" class="card" style="text-align: left; padding: 1.25rem; cursor: pointer; display: flex; flex-direction: column; gap: .9rem">
              <div style="display: flex; justify-content: space-between; align-items: center"><span class="cond" style="font-size: 13px; color: var(--muted)">{{m.comp}}</span><span class="cond {{m.pulse}}" style="font-size: 13px; color: {{m.stColor}}">{{m.statusLabel}}</span></div>
              <div style="display: grid; grid-template-columns: 1fr auto; gap: .5rem; align-items: center"><span class="ttl" style="font-size: 21px">{{m.home}}</span><span class="num" style="font-size: 30px; color: var(--ink)">{{m.hs}}</span><span class="ttl" style="font-size: 21px">{{m.away}}</span><span class="num" style="font-size: 30px; color: var(--ink)">{{m.as}}</span></div>
              <div style="height: 4px; background: var(--surface-2); border-radius: 0; overflow: hidden"><div style="height: 4px; width: {{m.progress}}; background: {{accent}}"></div></div>
            </button>
          </sc-for>
        </div>
      </sc-if>

      <!-- RÉSULTATS -->
      <sc-if value="{{tabResults}}" hint-placeholder-val="{{ false }}">
        <div style="display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 0; overflow: hidden">
          <sc-for list="{{resultRows}}" as="m" hint-placeholder-count="5">
            <button type="button" onClick="{{m.open}}" style="display: grid; grid-template-columns: minmax(70px, 110px) 1fr auto 1fr minmax(70px, 110px); gap: .75rem; align-items: center; padding: .9rem 1rem; background: var(--surface); border: 0; border-bottom: 1px solid var(--line); cursor: pointer; text-align: left; min-height: 60px">
              <span style="font-size: 13px; color: var(--muted)">{{m.dateLabel}}</span>
              <span style="text-align: right; font-weight: {{m.homeW}}; color: var(--text)">{{m.home}}</span>
              <span class="num" style="font-size: 22px; background: var(--inv-bg); color: var(--on-inv); padding: .2rem .7rem; border-radius: 0; min-width: 76px; text-align: center">{{m.hs}} – {{m.as}}</span>
              <span style="font-weight: {{m.awayW}}; color: var(--text)">{{m.away}}</span>
              <span class="cond" style="font-size: 11px; text-align: right; color: {{m.vColor}}">{{m.vLabel}}</span>
            </button>
          </sc-for>
        </div>
        <sc-if value="{{noResults}}" hint-placeholder-val="{{ false }}"><p style="color: var(--text-2)">Aucun résultat pour cette compétition.</p></sc-if>
      </sc-if>

      <!-- AGENDA -->
      <sc-if value="{{tabAgenda}}" hint-placeholder-val="{{ false }}">
        <div style="display: flex; flex-direction: column; gap: .75rem">
          <sc-for list="{{agendaRows}}" as="m" hint-placeholder-count="4">
            <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 1rem; border: 1px solid var(--line); border-radius: 0; padding: 1rem 1.1rem">
              <div style="min-width: 86px; text-align: center; border-right: 1px solid var(--line); padding-right: 1rem"><div class="cond" style="font-size: 12px; color: var(--gold-text)">{{m.dow}}</div><div class="num" style="font-size: 30px; line-height: 1; color: var(--ink)">{{m.day}}</div><div class="cond" style="font-size: 12px; color: var(--muted)">{{m.mon}}</div></div>
              <button type="button" onClick="{{m.open}}" style="flex: 1 1 260px; text-align: left; background: none; border: 0; cursor: pointer; padding: 0; min-height: 44px"><span class="ttl" style="display: block; font-size: 21px">{{m.home}} – {{m.away}}</span><span style="font-size: 13.5px; color: var(--muted)">{{m.comp}} · {{m.time}} · {{m.venue}}</span></button>
              <button type="button" onClick="{{m.toggleRemind}}" class="cond" style="min-height: 44px; padding: 0 1rem; border-radius: 0; border: 1.5px solid var(--ink); cursor: pointer; font-size: 14px; background: {{m.rBg}}; color: {{m.rFg}}">{{m.rLabel}}</button>
            </div>
          </sc-for>
        </div>
        <sc-if value="{{noAgenda}}" hint-placeholder-val="{{ false }}"><p style="color: var(--text-2)">Aucun match programmé pour l’instant.</p></sc-if>
      </sc-if>

      <!-- CALENDRIER -->
      <sc-if value="{{tabCal}}" hint-placeholder-val="{{ false }}">
        <div style="display: flex; flex-wrap: wrap; gap: 2rem; align-items: flex-start">
          <div style="flex: 1 1 460px">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem">
              <button type="button" onClick="{{calPrev}}" aria-label="Mois précédent" style="width: 44px; height: 44px; border-radius: 50%; border: 1.5px solid var(--line-2); background: var(--surface); cursor: pointer; color: var(--text)">‹</button>
              <span class="ttl" style="font-size: 26px">{{calTitle}}</span>
              <button type="button" onClick="{{calNext}}" aria-label="Mois suivant" style="width: 44px; height: 44px; border-radius: 50%; border: 1.5px solid var(--line-2); background: var(--surface); cursor: pointer; color: var(--text)">›</button>
            </div>
            <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px">
              <sc-for list="{{calHead}}" as="h" hint-placeholder-count="7"><div class="cond" style="text-align: center; font-size: 12px; color: var(--muted); padding: .4rem 0">{{h.l}}</div></sc-for>
              <sc-for list="{{calCells}}" as="d" hint-placeholder-count="35">
                <button type="button" onClick="{{d.pick}}" disabled="{{d.disabled}}" aria-label="{{d.aria}}" style="aspect-ratio: 1 / 1; min-height: 44px; border-radius: 0; border: 1.5px solid {{d.border}}; background: {{d.bg}}; color: {{d.fg}}; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; opacity: {{d.op}}"><span class="num" style="font-size: 17px">{{d.n}}</span><span style="width: 6px; height: 6px; border-radius: 50%; background: {{d.dot}}"></span></button>
              </sc-for>
            </div>
          </div>
          <div style="flex: 1 1 320px">
            <div class="eb" style="margin-bottom: .5rem">{{calDayLabel}}</div>
            <div style="display: flex; flex-direction: column; gap: .6rem">
              <sc-for list="{{calDayMatches}}" as="m" hint-placeholder-count="2">
                <button type="button" onClick="{{m.open}}" style="text-align: left; border: 1px solid var(--line); border-radius: 0; background: var(--surface); padding: .9rem 1rem; cursor: pointer"><span class="cond" style="display: block; font-size: 12px; color: var(--gold-text)">{{m.comp}} · {{m.time}}</span><span class="ttl" style="display: block; font-size: 20px">{{m.home}} {{m.scoreMid}} {{m.away}}</span></button>
              </sc-for>
              <sc-if value="{{calDayEmpty}}" hint-placeholder-val="{{ false }}"><p style="color: var(--muted); margin: 0">Aucun match ce jour-là.</p></sc-if>
            </div>
          </div>
        </div>
      </sc-if>

      <!-- CLASSEMENT -->
      <sc-if value="{{tabTable}}" hint-placeholder-val="{{ false }}">
        <sc-if value="{{hasTable}}" hint-placeholder-val="{{ true }}">
          <div style="overflow-x: auto; border: 1px solid var(--line); border-radius: 0">
            <x-table class="tbl">
              <x-thead><x-tr><x-th>#</x-th><x-th style="text-align: left">Équipe</x-th><x-th>J</x-th><x-th>G</x-th><x-th>N</x-th><x-th>P</x-th><x-th>Diff.</x-th><x-th>Pts</x-th><x-th>Forme</x-th></x-tr></x-thead>
              <x-tbody>
                <sc-for list="{{tableRows}}" as="r" hint-placeholder-count="8">
                  <x-tr style="background: {{r.bg}}">
                    <x-td><span class="num" style="display: inline-flex; width: 28px; height: 28px; border-radius: 50%; align-items: center; justify-content: center; background: {{r.rankBg}}; color: {{r.rankFg}}">{{r.rank}}</span></x-td>
                    <x-td style="text-align: left"><button type="button" onClick="{{r.open}}" style="background: none; border: 0; padding: .4rem 0; cursor: pointer; font-weight: 800; color: var(--text); text-align: left; min-height: 40px">{{r.team}}</button><sc-if value="{{r.followed}}" hint-placeholder-val="{{ false }}"><span class="cond" style="font-size: 11px; color: var(--gold-text); margin-left: .4rem">Suivi</span></sc-if></x-td>
                    <x-td>{{r.j}}</x-td><x-td>{{r.g}}</x-td><x-td>{{r.n}}</x-td><x-td>{{r.p}}</x-td><x-td>{{r.diff}}</x-td><x-td class="num" style="font-size: 19px; color: var(--ink)">{{r.pts}}</x-td>
                    <x-td><span style="display: inline-flex; gap: 3px"><sc-for list="{{r.form}}" as="f" hint-placeholder-count="5"><span class="cond" style="width: 20px; height: 20px; border-radius: 0; font-size: 11px; display: inline-flex; align-items: center; justify-content: center; background: {{f.bg}}; color: var(--on-inv)">{{f.l}}</span></sc-for></span></x-td>
                  </x-tr>
                </sc-for>
              </x-tbody>
            </x-table>
          </div>
          <p style="font-size: 13px; color: var(--muted); margin-top: .75rem">Victoire 3 pts · nul 1 pt · défaite 0 pt. Les montées / descentes suivent le règlement de la ligue.</p>
        </sc-if>
        <sc-if value="{{noTable}}" hint-placeholder-val="{{ false }}"><p style="color: var(--text-2)">Compétition à élimination directe : pas de classement. Consultez les résultats et l’agenda.</p></sc-if>
      </sc-if>

      <!-- PRONOS -->
      <sc-if value="{{tabPronos}}" hint-placeholder-val="{{ false }}">
        <div style="display: flex; flex-wrap: wrap; gap: 2rem; align-items: flex-start">
          <div style="flex: 1 1 520px; display: flex; flex-direction: column; gap: .75rem">
            <sc-for list="{{pronoRows}}" as="m" hint-placeholder-count="3">
              <div style="border: 1px solid var(--line); border-radius: 0; padding: 1rem 1.1rem">
                <div class="cond" style="font-size: 12px; color: var(--gold-text); margin-bottom: .5rem">{{m.comp}} · {{m.dateLabel}}</div>
                <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: .5rem">
                  <sc-for list="{{m.opts}}" as="o" hint-placeholder-count="3">
                    <button type="button" onClick="{{o.pick}}" aria-pressed="{{o.pressed}}" style="min-height: 52px; border-radius: 0; cursor: pointer; background: {{o.bg}}; color: {{o.fg}}; border: 1.5px solid {{o.border}}; font-weight: 800; font-size: 14px; padding: .4rem">{{o.label}}</button>
                  </sc-for>
                </div>
              </div>
            </sc-for>
          </div>
          <div class="cb-deep" style="flex: 1 1 280px; background: var(--inv-bg); color: var(--on-inv-2); border-radius: 0; padding: 1.5rem">
            <div class="eb" style="color: var(--gold-on-inv); margin-bottom: .5rem">Ligue des pronos</div>
            <div class="num" style="font-size: 54px; color: var(--on-inv); line-height: 1">{{pronoCount}}</div>
            <div style="margin-bottom: 1.25rem">pronostic(s) enregistré(s)</div>
            <p style="font-size: 14px; line-height: 1.6; color: var(--on-inv-2); margin: 0 0 1rem">Chaque bon prono rapporte des points. Les meilleurs du mois gagnent des articles de la boutique.</p>
            <button type="button" class="btn btn-gold" onClick="{{goShop}}" style="width: 100%">Voir les lots</button>
          </div>
        </div>
      </sc-if>
    </sc-if>
  </section>
</sc-if>

<!-- ================= BOUTIQUE ================= -->
<sc-if value="{{isShop}}" hint-placeholder-val="{{ false }}">
  <!-- L’ouverture : le bandeau noir de la boutique -->
  <section class="bn-scope bn-shop-hero" aria-label="Boutique officielle Casa Besports">
    <div class="wrap bn-shop-hero-in">
      <div>
        <span class="bn-etiq">{{shopPres.surtitre}}</span>
        <h1 class="bn-titre">{{shopPres.titre}}</h1>
        <p class="sh-tag">{{shopPres.texte}}</p>
        <div class="sh-perks"><sc-for list="{{shopPres.avantages}}" as="av" hint-placeholder-count="3"><span>{{av.t}}</span></sc-for></div>
        <p class="sh-note">{{shopPres.note}}</p>
      </div>
      <figure class="bn-cadre"><img src="{{shopPres.image}}" alt="{{shopPres.imageAlt}}" width="1000" height="1000"></figure>
    </div>
  </section>
  <section class="wrap" style="padding-top: 2.25rem; padding-bottom: 5rem">
    <!-- Les collections -->
    <div class="bn-sect"><span class="bn-etiq">Les collections</span><span style="font-size: 13px; color: var(--muted)">Choisissez une collection pour l’afficher</span></div>
    <div class="bn-colls">
      <sc-for list="{{shopPosters}}" as="po" hint-placeholder-count="4">
        <button type="button" class="bn-coll" onClick="{{po.pick}}" aria-pressed="{{po.pressed}}" aria-label="{{po.aria}}">
          <span class="bn-coll-img"><img src="{{po.img}}" alt=""></span>
          <span class="bn-coll-txt">
            <span class="bn-coll-kick">{{po.kick}}</span>
            <span class="bn-coll-t"><span>{{po.title}}</span></span>
            <span class="bn-coll-tag">{{po.tag}}</span>
            <span class="bn-coll-stat">{{po.credits}}</span>
            <span class="bn-coll-cta">{{po.cta}}</span>
          </span>
        </button>
      </sc-for>
    </div>
    <div style="display: flex; flex-wrap: wrap; gap: .5rem; margin-bottom: 1.25rem; align-items: center">
      <sc-for list="{{shopLines}}" as="c" hint-placeholder-count="4">
        <button type="button" class="chip" onClick="{{c.pick}}" aria-pressed="{{c.pressed}}" style="background: {{c.bg}}; color: {{c.fg}}; border: 1.5px solid {{c.border}}">{{c.label}}</button>
      </sc-for>
      <span style="flex: 1"></span>
      <label style="display: flex; align-items: center; gap: .5rem; font-size: 14px; font-weight: 700; color: var(--text-2)">Trier
        <x-select class="field" value="{{shopSort}}" onChange="{{onShopSort}}" style="width: auto; min-height: 44px"><x-option value="pop">Meilleures ventes</x-option><x-option value="asc">Prix croissant</x-option><x-option value="desc">Prix décroissant</x-option><x-option value="new">Nouveautés</x-option></x-select>
      </label>
    </div>
    <!-- L’édition limitée : un bloc noir -->
    <sc-if value="{{showTrailer}}" hint-placeholder-val="{{ true }}">
      <section class="bn-scope bn-noir bn-edition" aria-label="Édition limitée : {{trailer.name}}">
        <div class="ct-text">
          <span class="bn-etiq">Édition limitée · série numérotée</span>
          <span class="ct-t">{{trailer.title}}</span>
          <p class="ct-sub">{{trailer.sub}}</p>
          <button type="button" class="btn btn-gold" onClick="{{trailer.open}}">Voir le maillot · {{trailer.price}}</button>
          <p class="ct-note">Bientôt épuisé · numéro de série à l’intérieur du col · floqué à votre nom par l’atelier Cherwood</p>
        </div>
        <button type="button" class="ct-img" onClick="{{trailer.open}}" aria-label="Voir {{trailer.name}}"><span class="bn-cadre"><img src="{{trailer.img}}" alt="{{trailer.name}}"></span></button>
      </section>
    </sc-if>
    <!-- Créations Casa : les pièces dessinées dans l’Atelier (Studio Boutique) -->
    <sc-if value="{{creaBanner.show}}" hint-placeholder-val="{{ false }}">
      <section class="bn-scope bn-noir bn-edition bn-crea-band" aria-label="Créations Casa">
        <div class="ct-text">
          <span class="bn-etiq">Atelier Casa · nouvelles pièces</span>
          <span class="ct-t">Créations Casa</span>
          <p class="ct-sub">{{creaBanner.sub}}</p>
          <button type="button" class="btn btn-gold" onClick="{{creaBanner.go}}">{{creaBanner.cta}}</button>
        </div>
        <div class="bn-crea-thumbs">
          <sc-for list="{{creaBanner.items}}" as="ci" hint-placeholder-count="3">
            <button type="button" class="bn-crea-th" onClick="{{ci.open}}" aria-label="{{ci.aria}}"><img src="{{ci.img}}" alt=""><span>{{ci.price}}</span></button>
          </sc-for>
        </div>
      </section>
    </sc-if>
    <sc-if value="{{showCherwoodBanner}}" hint-placeholder-val="{{ false }}">
      <div style="border: 1.5px solid var(--ink); border-radius: 0; padding: 1.25rem 1.5rem; margin-bottom: 1.75rem; display: flex; flex-wrap: wrap; gap: 1rem; align-items: center; justify-content: space-between">
        <div style="max-width: 46rem"><div class="ttl" style="font-size: 26px; margin-bottom: .25rem">Cherwood × Casa Besports</div><p style="margin: 0; color: var(--text-2); line-height: 1.6">Cherwood, marque cherbourgeoise née en 2017, dessine ses collections inspirées de la Normandie et réalise flocage et broderie dans son atelier du centre-ville.</p></div>
        <span class="cond" style="font-size: 13px; color: var(--gold-text)">Fabriqué et personnalisé à Cherbourg</span>
      </div>
    </sc-if>
    <div class="grid4">
      <sc-for list="{{shopProducts}}" as="p" hint-placeholder-count="8">
        <div class="card" style="display: flex; flex-direction: column">
          <button type="button" class="hit" onClick="{{p.open}}">
            <div class="cb-scope-light" style="width: 100%; aspect-ratio: 1 / 1; background: {{p.tint}}; display: flex; align-items: center; justify-content: center; position: relative">
              <sc-if value="{{p.isPoster}}" hint-placeholder-val="{{ false }}"><img src="assets/hero.jpg" alt="" style="width: 58%; aspect-ratio: 2 / 3; object-fit: cover; box-shadow: 0 14px 30px rgba(8,15,26,.35); border: 6px solid var(--surface)"></sc-if>
              <sc-if value="{{p.hasImg}}" hint-placeholder-val="{{ false }}"><img src="{{p.img}}" alt="{{p.name}}" class="zimg" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover"></sc-if><sc-if value="{{p.isIcon}}" hint-placeholder-val="{{ true }}"><svg viewBox="0 0 120 120" width="62%" height="62%" aria-hidden="true"><path d="{{p.path}}" fill="{{p.color}}" stroke="#080f1a" stroke-opacity=".18" stroke-width="1.5" fill-rule="evenodd"></path><text x="60" y="{{p.markY}}" text-anchor="middle" font-family="Barlow Condensed, sans-serif" font-weight="700" font-size="{{p.markSize}}" fill="{{p.markColor}}">{{p.mark}}</text></svg></sc-if>
              <span class="cond" style="position: absolute; top: 10px; left: 10px; font-size: 11px; background: {{p.badgeBg}}; color: {{p.badgeFg}}; padding: .3rem .5rem">{{p.line}}</span>
              <sc-if value="{{p.hasFlag}}" hint-placeholder-val="{{ false }}"><span class="bn-sceau" style="bottom: 10px; left: 10px">{{p.flag}}</span></sc-if>
            </div>
            <div style="padding: .9rem 1rem .6rem"><div class="ttl" style="font-size: 20px">{{p.name}}</div><div style="font-size: 13px; color: var(--muted); margin-top: .2rem">{{p.short}}</div><div class="num" style="font-size: 20px; color: var(--ink); margin-top: .4rem">{{p.priceLabel}}</div></div>
          </button>
          <div style="padding: 0 1rem 1rem; margin-top: auto"><button type="button" onClick="{{p.quickAdd}}" class="cond" style="width: 100%; min-height: 44px; border: 1.5px solid var(--ink); border-radius: 0; background: var(--surface); color: var(--ink); cursor: pointer; font-size: 14px">{{p.quickLabel}}</button></div>
        </div>
      </sc-for>
    </div>
    <!-- Articles de l’Atelier : import des packs (aperçu, application seule) ou publication (équipe, plateforme) -->
    <sc-if value="{{crea.show}}" hint-placeholder-val="{{ false }}">
      <section class="bn-crea" aria-label="Articles de l’Atelier">
        <div class="bn-sect"><span class="bn-etiq">Articles de l’Atelier</span><span class="bn-crea-lead">{{crea.lead}}</span></div>
        <div class="bn-crea-bar">
          <button type="button" class="btn btn-dark" onClick="{{crea.toggle}}" aria-expanded="{{crea.openAria}}">{{crea.toggleLabel}}</button>
          <label class="btn btn-ghost bn-crea-file">Importer un pack (.json)<input type="file" accept=".json,application/json" onChange="{{crea.onFile}}"></label>
          <span class="bn-crea-msg" role="status">{{crea.msg}}</span>
        </div>
        <sc-if value="{{crea.open}}" hint-placeholder-val="{{ false }}">
          <p class="bn-crea-help">{{crea.help}}</p>
          <div class="bn-crea-list">
            <sc-for list="{{crea.items}}" as="it" hint-placeholder-count="2">
              <div class="bn-crea-item">
                <img src="{{it.img}}" alt="" loading="lazy">
                <div class="bn-crea-in"><b>{{it.name}}</b><span>{{it.meta}}</span><span class="bn-crea-st">{{it.statusLabel}}</span></div>
                <div class="bn-crea-act">
                  <button type="button" class="btn btn-ghost" onClick="{{it.open}}">Voir</button>
                  <sc-if value="{{it.canToggle}}" hint-placeholder-val="{{ true }}"><button type="button" class="btn btn-ghost" onClick="{{it.toggle}}">{{it.toggleLabel}}</button></sc-if>
                  <sc-if value="{{it.canDel}}" hint-placeholder-val="{{ true }}"><button type="button" class="btn btn-ghost" onClick="{{it.del}}">{{it.delLabel}}</button></sc-if>
                </div>
              </div>
            </sc-for>
          </div>
          <sc-if value="{{crea.empty}}" hint-placeholder-val="{{ false }}"><p class="bn-crea-help">{{crea.emptyText}}</p></sc-if>
        </sc-if>
      </section>
    </sc-if>
  </section>
</sc-if>

<!-- ================= PRODUIT ================= -->
<sc-if value="{{isProduct}}" hint-placeholder-val="{{ false }}">
  <section class="wrap" style="padding-top: 1.5rem; padding-bottom: 4rem; display: flex; flex-wrap: wrap; gap: 3rem; align-items: flex-start">

              <sc-if value="{{rx.ed.isOnline}}" hint-placeholder-val="{{ false }}"><div class="rx-alert rx-alert-ok rx-flexline"><span>{{rx.ed.onlineLabel}}</span><span class="rx-item-act"><sc-if value="{{rx.ed.canUne}}" hint-placeholder-val="{{ false }}"><button type="button" class="rx-tbtn" onClick="{{rx.ed.toUne}}">Mettre en ouverture de la une</button></sc-if><sc-if value="{{rx.ed.canReopen}}" hint-placeholder-val="{{ false }}"><button type="button" class="rx-tbtn" onClick="{{rx.ed.reopen}}">Remettre en rédaction</button></sc-if><sc-if value="{{rx.ed.canUnpublish}}" hint-placeholder-val="{{ false }}"><button type="button" class="rx-tbtn" onClick="{{rx.ed.unpublish}}">Retirer du site</button></sc-if></span></div></sc-if>

                <div class="rx-paper">
                  <div class="ttl" style="font-size: 2.1rem; margin-bottom: .6rem">{{rx.ed.ver.title}}</div>
                  <p class="rx-dek">{{rx.ed.ver.dek}}</p>

                  <p class="rx-dek"><sc-for list="{{rx.ed.cmp.dek}}" as="sg" hint-placeholder-count="2"><sc-if value="{{sg.ins}}" hint-placeholder-val="{{ false }}"><ins class="rx-ins">{{sg.t}}</ins></sc-if><sc-if value="{{sg.del}}" hint-placeholder-val="{{ false }}"><del class="rx-del">{{sg.t}}</del></sc-if><sc-if value="{{sg.plain}}" hint-placeholder-val="{{ true }}">{{sg.t}}</sc-if></sc-for></p>

                <div class="lbl" style="margin-bottom: .4rem">Image de une</div>

                <label class="lbl" style="margin-bottom: .9rem">Texte alternatif de l’image (accessibilité)<input class="field" value="{{ed.alt}}" onChange="{{edAlt}}" disabled="{{edLocked}}" placeholder="Décrivez l’image en une phrase"></label>
                <div class="rx-rights-line"><span class="rx-muted">Droits de la photo · {{rx.ed.credit}} :</span><sc-for list="{{rx.ed.rights}}" as="rg" hint-placeholder-count="5"><span class="rx-right" title="{{rg.title}}" style="color: {{rg.color}}"><span aria-hidden="true">{{rg.icon}}</span> {{rg.l}}</span></sc-for></div>
                <div class="rx-row2">
                  <label class="lbl">Vidéo de l’article (lien, facultatif)<input class="field" type="url" value="{{rx.ed.videoUrl}}" onChange="{{rx.ed.onVideoUrl}}" disabled="{{edLocked}}" placeholder="https://casabesports.fr/videos/…"></label>
                  <label class="lbl">Durée de la vidéo (min:s)<input class="field" value="{{rx.ed.videoDur}}" onChange="{{rx.ed.onVideoDur}}" disabled="{{edLocked}}" placeholder="2:45" inputmode="numeric"></label>
                </div>
                <sc-if value="{{rx.ed.videoDurBad}}" hint-placeholder-val="{{ false }}"><div class="rx-muted" style="color: var(--danger); margin: -.4rem 0 .8rem">Durée au format minutes:secondes, par exemple 2:45.</div></sc-if>
                <div class="lbl" style="margin-bottom: .4rem; flex-direction: row; justify-content: space-between">Corps de l’article <span style="font-weight: 600; color: var(--muted)">{{ed.words}} mots · {{ed.read}}</span></div>
                <div style="display: flex; flex-wrap: wrap; gap: .3rem; border: 1.5px solid var(--line-2); border-bottom: 0; border-radius: 0 6px 0 0; padding: .4rem; background: var(--surface-3)">
                  <sc-for list="{{toolbar}}" as="tb" hint-placeholder-count="6"><button type="button" onClick="{{tb.run}}" disabled="{{edLocked}}" aria-label="{{tb.aria}}" style="min-width: 40px; min-height: 36px; border-radius: 0; border: 1px solid var(--line-2); background: var(--surface); cursor: pointer; font-weight: 800; font-size: 13px; color: var(--text)">{{tb.label}}</button></sc-for>
                  <span style="font-size: 12px; color: var(--muted-2); align-self: center; margin-left: .3rem">## intertitre · &gt; citation · - liste</span>
                </div>
                <textarea class="field studio-in" value="{{ed.body}}" onChange="{{edBody}}" onPaste="{{rx.ed.onPaste}}" aria-label="Corps de l’article" disabled="{{edLocked}}" style="min-height: 340px; padding: .9rem; line-height: 1.7; resize: vertical; border-radius: 0 0 6px 6px; font-family: ui-monospace, Menlo, monospace; font-size: 14px"></textarea>
                <div class="rx-muted" style="margin: .35rem 0 0">{{rx.ed.typeHint}}<sc-if value="{{rx.ed.hasPasteMsg}}" hint-placeholder-val="{{ false }}"> <strong style="color: var(--text)">{{rx.ed.pasteMsg}}</strong></sc-if></div>
                <label class="lbl" style="flex-direction: row; align-items: center; gap: .6rem; margin-top: .8rem; cursor: pointer"><input type="checkbox" checked="{{ed.premium}}" onChange="{{edPremium}}" disabled="{{edLocked}}" style="width: 20px; height: 20px; accent-color: var(--ink)">Contenu Premium (réservé aux abonnés Casa B+)</label>
              </sc-if>
              <sc-if value="{{edPreview}}" hint-placeholder-val="{{ false }}">
                <div style="background: var(--surface); border-radius: 0; padding: 1.5rem 1.75rem; border: 1px solid var(--line)">
                  <div class="cond" style="font-size: 13px; color: var(--gold-text); margin-bottom: .5rem">{{ed.sport}} · {{ed.tag}} · {{ed.read}}</div>
                  <div class="ttl" style="font-size: 2.4rem; margin-bottom: .75rem">{{ed.title}}</div>
                  <p style="font-family: 'League Spartan', 'Arial Black', sans-serif; font-weight: 700; letter-spacing: -.02em; font-size: 1.25rem; color: var(--text-2); margin: 0 0 1rem">{{ed.dek}}</p>
                  <div style="aspect-ratio: 16 / 8; overflow: hidden; border-radius: 0; margin-bottom: 1rem"><img src="{{ed.img}}" alt="{{ed.alt}}" style="width: 100%; height: 100%; object-fit: cover"></div>

                    <sc-if value="{{bk.isQ}}" hint-placeholder-val="{{ false }}"><blockquote style="margin: 1.2em 0; padding-left: 1.2rem; border-left: 3px solid {{accent}}; font-family: 'League Spartan', 'Arial Black', sans-serif; font-weight: 700; letter-spacing: -.02em; font-size: 1.5rem; color: var(--ink)">{{bk.t}}</blockquote></sc-if>

                  </sc-for>
                </div>
              </sc-if>
              <sc-if value="{{rx.wf.show}}" hint-placeholder-val="{{ false }}">
                <div class="rx-alert {{rx.wf.cls}}" role="alert" style="margin-top: 1rem">

                <button type="button" class="btn btn-ghost" onClick="{{goStudioList}}">Fermer</button>
              </div>

                  </div>
                </sc-if>
              </div>
              <div class="glass rx-side">

              </div>
              <div class="rx-muted" style="margin: 0 0 .6rem">{{rx.media.count}} · la recherche porte aussi sur la légende et le crédit des articles qui utilisent chaque photo</div>

                          <span class="rx-rights"><sc-for list="{{md.rights}}" as="rg" hint-placeholder-count="5"><span class="rx-r" title="{{rg.title}}" style="background: {{rg.bg}}; color: {{rg.fg}}">{{rg.l}}</span></sc-for></span></span>
                      </button>

                  </div>

                      <sc-for list="{{rx.media.s.rights}}" as="rr" hint-placeholder-count="5"><label class="rx-rightrow"><span>{{rr.l}}</span><x-select class="field" value="{{rr.v}}" onChange="{{rr.on}}"><sc-for list="{{rx.media.s.droitOpts}}" as="o" hint-placeholder-count="4"><x-option value="{{o.v}}">{{o.l}}</x-option></sc-for></x-select></label></sc-for>
                      <div class="rx-item-act" style="margin-top: .6rem"><button type="button" class="rx-tbtn" onClick="{{rx.media.s.allLibre}}">Libre de droit partout</button><sc-if value="{{rx.media.s.canDelete}}" hint-placeholder-val="{{ false }}"><button type="button" class="rx-tbtn" onClick="{{rx.media.s.remove}}" style="color: var(--danger)">Supprimer</button></sc-if></div>

                    <sc-for list="{{crm.sel.notes}}" as="nt2" hint-placeholder-count="3"><div style="font-size: 13px; padding: .35rem 0; border-bottom: 1px solid var(--line)"><span style="color: var(--muted)">{{nt2.when}} · {{nt2.by}}</span><br>{{nt2.text}}</div></sc-for>
                    <div style="display: flex; gap: .4rem; margin-top: .6rem"><label style="flex: 1"><span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Note</span><input class="field" value="{{crm.noteDraft}}" onChange="{{crm.onNote}}" placeholder="Ajouter une note…" style="min-height: 38px; font-size: 13.5px"></label><button type="button" onClick="{{crm.addNote}}" class="btn btn-dark" style="min-height: 38px; font-size: 13px">Ajouter</button></div>
                    <div style="display: flex; gap: .4rem; flex-wrap: wrap; margin-top: .6rem"><button type="button" onClick="{{crm.selTask}}" class="btn btn-ghost" style="min-height: 36px; font-size: 13px">Créer une tâche</button><button type="button" onClick="{{crm.selDeal}}" class="btn btn-ghost" style="min-height: 36px; font-size: 13px">Créer une affaire</button><button type="button" onClick="{{crm.selErase}}" class="btn btn-ghost" style="min-height: 36px; font-size: 13px; color: var(--danger)">Supprimer (RGPD)</button></div>
                  </sc-if>
                  <sc-if value="{{crm.noSel}}" hint-placeholder-val="{{ false }}"><p style="margin: 0; color: var(--muted); font-size: 14px">Sélectionnez un contact pour voir sa fiche.</p></sc-if>
                </aside>
              </div>
            </sc-if>

            <!-- Pipeline -->
            <sc-if value="{{crm.tPipe}}" hint-placeholder-val="{{ false }}">
              <div style="display: grid; grid-auto-flow: column; grid-auto-columns: minmax(220px, 1fr); gap: .7rem; overflow-x: auto; padding-bottom: .5rem">
                <sc-for list="{{crm.columns}}" as="col2" hint-placeholder-count="6">
                  <div style="background: var(--surface-2); border-radius: 0; padding: .7rem; min-height: 200px">
                    <div style="display: flex; justify-content: space-between; align-items: baseline; margin-bottom: .5rem"><span class="cond" style="font-size: 12.5px; color: var(--text)">{{col2.label}} · {{col2.count}}</span><span class="num" style="font-size: 13px; color: var(--muted)">{{col2.total}}</span></div>
                    <sc-for list="{{col2.deals}}" as="dl2" hint-placeholder-count="2">
                      <div style="background: var(--surface); border: 1px solid var(--line); border-left: 4px solid {{dl2.color}}; border-radius: 0; padding: .6rem .7rem; margin-bottom: .45rem">
                        <div style="font-weight: 800; font-size: 13.5px; color: var(--text)">{{dl2.title}}</div>
                        <div style="font-size: 12px; color: var(--muted)">{{dl2.org}} · {{dl2.amount}}</div>
                        <div style="font-size: 12px; color: var(--text-2); margin-top: .25rem">{{dl2.next}}</div>
                        <div style="display: flex; justify-content: space-between; margin-top: .4rem"><button type="button" onClick="{{dl2.back}}" aria-label="Étape précédente" style="width: 32px; height: 30px; border-radius: 0; border: 1px solid var(--line-2); background: var(--surface); cursor: pointer; color: var(--text)">←</button><span style="font-size: 11px; color: var(--muted); align-self: center">{{dl2.age}}</span><button type="button" onClick="{{dl2.fwd}}" aria-label="Étape suivante" style="width: 32px; height: 30px; border-radius: 0; border: 1px solid var(--line-2); background: var(--surface); cursor: pointer; color: var(--text)">→</button></div>
                      </div>
                    </sc-for>
                  </div>
                </sc-for>
              </div>
              <div style="display: flex; gap: .5rem; flex-wrap: wrap; align-items: flex-end; margin-top: 1rem; background: var(--surface); border: 1px solid var(--line); border-radius: 0; padding: .9rem 1rem">
                <label class="lbl" style="flex: 2 1 220px">Nouvelle affaire<input class="field" value="{{crm.dTitle}}" onChange="{{crm.onDTitle}}" placeholder="Résumé de match, partenariat…"></label>
                <label class="lbl" style="flex: 1 1 160px">Organisation<input class="field" value="{{crm.dOrg}}" onChange="{{crm.onDOrg}}"></label>
                <label class="lbl" style="flex: 0 1 120px">Montant (€)<input class="field" type="number" min="0" value="{{crm.dAmount}}" onChange="{{crm.onDAmount}}"></label>
                <button type="button" class="btn btn-dark" onClick="{{crm.addDeal}}">Ajouter</button>
              </div>
            </sc-if>

            <!-- Tâches -->
            <sc-if value="{{crm.tTasks}}" hint-placeholder-val="{{ false }}">
              <div style="display: flex; gap: .4rem; flex-wrap: wrap; margin-bottom: .9rem"><sc-for list="{{crm.ownerChips}}" as="oc" hint-placeholder-count="3"><button type="button" class="chip" onClick="{{oc.pick}}" aria-pressed="{{oc.pressed}}" style="min-height: 36px; font-size: 13px; background: {{oc.bg}}; color: {{oc.fg}}; border: 1.5px solid {{oc.border}}">{{oc.label}}</button></sc-for></div>
              <sc-for list="{{crm.taskGroups}}" as="tgp" hint-placeholder-count="3">
                <div style="margin-bottom: 1rem"><div class="cond" style="font-size: 12.5px; color: {{tgp.color}}; margin-bottom: .4rem">{{tgp.label}} · {{tgp.count}}</div>
                  <sc-for list="{{tgp.items}}" as="tk" hint-placeholder-count="3">
                    <div style="display: flex; gap: .7rem; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 0; padding: .55rem .8rem; margin-bottom: .35rem; opacity: {{tk.op}}">
                      <input type="checkbox" checked="{{tk.done}}" onChange="{{tk.toggle}}" aria-label="Marquer comme faite : {{tk.title}}" style="width: 20px; height: 20px; accent-color: var(--ink); flex: none">
                      <span style="flex: 1"><span style="display: block; font-weight: 700; color: var(--text); text-decoration: {{tk.deco}}">{{tk.title}}</span><span style="font-size: 12px; color: var(--muted)">{{tk.rel}} · échéance {{tk.due}}</span></span>
                      <span class="cond" style="font-size: 11px; padding: .2rem .5rem; border-radius: 0; background: {{tk.ownerBg}}; color: {{tk.ownerFg}}">{{tk.owner}}</span>
                    </div>
                  </sc-for>
                </div>
              </sc-for>
              <div style="display: flex; gap: .5rem; flex-wrap: wrap; align-items: flex-end; background: var(--surface); border: 1px solid var(--line); border-radius: 0; padding: .9rem 1rem">
                <label class="lbl" style="flex: 2 1 240px">Nouvelle tâche<input class="field" value="{{crm.tTitle}}" onChange="{{crm.onTTitle}}" placeholder="Appeler, envoyer le devis…"></label>
                <label class="lbl" style="flex: 0 1 170px">Échéance<input class="field" type="date" value="{{crm.tDue}}" onChange="{{crm.onTDue}}"></label>
                <button type="button" class="btn btn-dark" onClick="{{crm.addTask}}">Ajouter</button>
              </div>
            </sc-if>

            <!-- Agents -->
            <sc-if value="{{crm.tAgents}}" hint-placeholder-val="{{ false }}">
              <p style="margin: 0 0 1rem; color: var(--text-2); max-width: 52rem">Les agents surveillent le CRM en continu et exécutent les tâches répétitives. En mode <strong>Validation</strong>, toute action sortante (e-mail, changement d’étape) attend votre accord ; en mode <strong>Autonome</strong>, l’agent agit seul et consigne tout dans le journal.</p>
              <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 330px), 1fr)); gap: 1rem">
                <sc-for list="{{crm.agents}}" as="ag" hint-placeholder-count="5">
                  <article style="background: var(--surface); border: 1px solid var(--line); border-radius: 0; padding: 1rem 1.1rem; display: flex; flex-direction: column; gap: .5rem">
                    <div style="display: flex; gap: .7rem; align-items: center">
                      <img src="assets/ia_viking.jpg" alt="" style="width: 40px; height: 40px; border-radius: 50%; object-fit: cover; flex: none; filter: {{ag.filter}}">
                      <span style="flex: 1"><span class="ttl" style="display: block; font-size: 20px">{{ag.name}}</span><span class="cond" style="font-size: 11px; color: {{ag.stColor}}">{{ag.status}}</span></span>
                      <label style="display: inline-flex; align-items: center; gap: .4rem; cursor: pointer; font-size: 13px; font-weight: 700"><input type="checkbox" checked="{{ag.on}}" onChange="{{ag.toggle}}" style="width: 20px; height: 20px; accent-color: var(--ink)">Actif</label>
                    </div>
                    <p style="margin: 0; font-size: 13.5px; color: var(--text-2); line-height: 1.5">{{ag.desc}}</p>
                    <div style="display: flex; gap: .3rem"><sc-for list="{{ag.modes}}" as="md2" hint-placeholder-count="2"><button type="button" onClick="{{md2.pick}}" aria-pressed="{{md2.pressed}}" style="flex: 1; min-height: 34px; border-radius: 0; cursor: pointer; font-size: 12.5px; font-weight: 800; background: {{md2.bg}}; color: {{md2.fg}}; border: 1.5px solid {{md2.border}}">{{md2.label}}</button></sc-for></div>
                    <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: .3rem; text-align: center; font-size: 12px; color: var(--muted)"><span><span class="num" style="display: block; font-size: 18px; color: var(--ink)">{{ag.runs}}</span>passages</span><span><span class="num" style="display: block; font-size: 18px; color: var(--ink)">{{ag.actions}}</span>actions</span><span><span class="num" style="display: block; font-size: 18px; color: var(--ink)">{{ag.last}}</span>dernier</span></div>
                    <button type="button" class="btn btn-ghost" onClick="{{ag.run}}" style="min-height: 38px; font-size: 13px">Lancer maintenant</button>
                  </article>
                </sc-for>
              </div>
              <p style="font-size: 12.5px; color: var(--muted); margin-top: 1rem">Les agents tournent dans le navigateur toutes les 20 secondes tant que l’espace rédaction est ouvert.</p>
            </sc-if>
          </div>
        </sc-if>

        <!-- LA UNE DU SITE -->
        <sc-if value="{{rx.isUne}}" hint-placeholder-val="{{ false }}">
          <div class="glass rx-card">
            <div class="rx-head"><div><div class="eb">Accueil du site et de l’application</div><h1 class="h2">Gestion de la une</h1></div><span class="rx-muted" style="max-width: 26rem">Un article épinglé garde sa position. Un article encore en ligne reste insérable pendant qu’on le modifie.</span></div>
            <sc-if value="{{rx.une.err}}" hint-placeholder-val="{{ false }}"><div class="rx-alert rx-alert-err" role="alert">{{rx.une.err}}</div></sc-if>
            <sc-if value="{{rx.une.msg}}" hint-placeholder-val="{{ false }}"><div class="rx-alert rx-alert-ok" role="status">{{rx.une.msg}}</div></sc-if>
            <sc-if value="{{rx.une.readOnly}}" hint-placeholder-val="{{ false }}"><div class="rx-alert">Consultation : la une est gérée par l’administrateur et les chefs d’édition.</div></sc-if>
            <div class="rx-cols">
              <div class="rx-col-main">
                <div class="rx-sub">Positions de la une</div>
                <ol class="rx-une">
                  <sc-for list="{{rx.une.slots}}" as="us" hint-placeholder-count="5">
                    <li class="rx-une-slot" data-pinned="{{us.pinnedStr}}">
                      <span class="rx-une-n num">{{us.n}}</span>
                      <img src="{{us.img}}" alt="" class="rx-une-img">
                      <span class="rx-une-txt"><strong>{{us.title}}</strong><span><span class="rx-badge" style="background: {{us.stBg}}; color: {{us.stFg}}">{{us.state}}</span> <span class="rx-muted">{{us.sub}}</span></span></span>
                      <span class="rx-une-act">
                        <button type="button" class="rx-ico" onClick="{{us.pin}}" aria-pressed="{{us.pinnedStr}}" aria-label="{{us.pinLabel}}" title="{{us.pinLabel}}" disabled="{{us.noPin}}" style="color: {{us.pinColor}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4h6l-1 5 3 3v2H7v-2l3-3z"></path><path d="M12 14v6"></path></svg></button>
                        <button type="button" class="rx-ico" onClick="{{us.up}}" aria-label="Monter d’une position" disabled="{{us.noUp}}">↑</button>
                        <button type="button" class="rx-ico" onClick="{{us.down}}" aria-label="Descendre d’une position" disabled="{{us.noDown}}">↓</button>
                        <button type="button" class="rx-ico" onClick="{{us.remove}}" aria-label="Retirer de la une" disabled="{{us.noRemove}}">×</button>
                      </span>
                    </li>
                  </sc-for>
                </ol>
              </div>
              <div class="rx-col-side">
                <div class="rx-sub">Insérer un article</div>
                <label class="rx-search" style="margin-bottom: .6rem"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg><input aria-label="Rechercher un article en ligne" value="{{rx.une.q}}" onChange="{{rx.une.onQ}}" placeholder="Rechercher un article en ligne…"></label>
                <label class="lbl" style="margin-bottom: .7rem">Position visée<x-select class="field" value="{{rx.une.pos}}" onChange="{{rx.une.onPos}}"><sc-for list="{{rx.une.posOpts}}" as="o" hint-placeholder-count="6"><x-option value="{{o.v}}">{{o.l}}</x-option></sc-for></x-select></label>
                <div class="rx-list">
                  <sc-for list="{{rx.une.results}}" as="ur" hint-placeholder-count="4">
                    <div class="rx-item"><div><strong style="display: block">{{ur.title}}</strong><span class="rx-muted">{{ur.sub}}</span></div>
                      <sc-if value="{{ur.canEdit}}" hint-placeholder-val="{{ true }}"><div class="rx-item-act"><button type="button" class="rx-tbtn rx-tbtn-dark" onClick="{{ur.add}}">Positionner et ajouter</button><button type="button" class="rx-tbtn" onClick="{{ur.replace}}">Positionner et remplacer</button></div></sc-if>
                    </div>
                  </sc-for>
                </div>
              </div>
            </div>
          </div>
        </sc-if>

        <!-- ÉDITIONS : TITRES, CHEMIN DE FER, PAGES, SUIVI DE PRODUCTION -->
        <sc-if value="{{rx.isProd}}" hint-placeholder-val="{{ false }}">
          <div class="glass rx-card">
            <div class="rx-head">
              <div><div class="eb">Production imprimée</div><h1 class="h2">{{rx.prod.titleName}}</h1><div class="rx-muted">{{rx.prod.titleSub}}</div></div>
              <div class="rx-actions">
                <button type="button" class="btn btn-ghost rx-sm" onClick="{{rx.prod.openGlobal}}">Afficher le plan en plein écran</button>
                <sc-if value="{{rx.prod.canReuse}}" hint-placeholder-val="{{ true }}"><button type="button" class="btn btn-ghost rx-sm" onClick="{{rx.prod.openReuse}}">Reprendre une page…</button></sc-if>
                <sc-if value="{{rx.prod.canNew}}" hint-placeholder-val="{{ true }}"><button type="button" class="btn btn-dark rx-sm" onClick="{{rx.prod.openNewEd}}">Nouvelle édition</button></sc-if>
                <sc-if value="{{rx.prod.canClose}}" hint-placeholder-val="{{ true }}"><button type="button" class="btn btn-gold rx-sm" onClick="{{rx.prod.closeEd}}">Boucler l’édition</button></sc-if>
                <sc-if value="{{rx.prod.canReopen}}" hint-placeholder-val="{{ false }}"><button type="button" class="btn btn-ghost rx-sm" onClick="{{rx.prod.reopenEd}}">Rouvrir l’édition</button></sc-if>
              </div>
            </div>
            <div class="rx-chips" role="group" aria-label="Titres"><sc-for list="{{rx.prod.titles}}" as="pt" hint-placeholder-count="3"><button type="button" class="chip" onClick="{{pt.pick}}" aria-pressed="{{pt.pressed}}" style="min-height: 38px; font-size: 14px; background: {{pt.bg}}; color: {{pt.fg}}; border: 1.5px solid {{pt.border}}">{{pt.name}}</button></sc-for></div>
            <div class="rx-eds" role="group" aria-label="Éditions"><sc-for list="{{rx.prod.eds}}" as="pe" hint-placeholder-count="2"><button type="button" class="rx-ed" onClick="{{pe.pick}}" aria-pressed="{{pe.pressed}}" style="background: {{pe.bg}}; color: {{pe.fg}}; border-color: {{pe.border}}"><strong>{{pe.label}}</strong><span>{{pe.date}} · {{pe.stLabel}}</span><span class="rx-prog" aria-hidden="true"><span style="width: {{pe.progW}}"></span></span></button></sc-for></div>
            <sc-if value="{{rx.prod.hasEdFrom}}" hint-placeholder-val="{{ false }}"><div class="rx-muted" style="margin: -.3rem 0 .8rem">{{rx.prod.edFrom}}</div></sc-if>
            <div class="rx-tabs"><sc-for list="{{rx.prod.views}}" as="pv" hint-placeholder-count="4"><button type="button" class="rx-tab" onClick="{{pv.pick}}" aria-pressed="{{pv.pressed}}" style="background: {{pv.bg}}; color: {{pv.fg}}; border-color: {{pv.border}}">{{pv.label}}<sc-if value="{{pv.hasBadge}}" hint-placeholder-val="{{ false }}"><span class="rx-count">{{pv.badge}}</span></sc-if></button></sc-for></div>
            <sc-if value="{{rx.prod.hasMsg}}" hint-placeholder-val="{{ false }}"><div class="rx-alert rx-alert-ok" role="status">{{rx.prod.msg}}</div></sc-if>
            <sc-if value="{{rx.prod.hasErr}}" hint-placeholder-val="{{ false }}"><div class="rx-alert rx-alert-err" role="alert">{{rx.prod.err}}</div></sc-if>

            <!-- chemin de fer -->
            <sc-if value="{{rx.prod.isPlan}}" hint-placeholder-val="{{ true }}">
              <div class="rx-plan">
                <sc-for list="{{rx.prod.pages}}" as="pp" hint-placeholder-count="8">
                  <button type="button" class="rx-thumb" onClick="{{pp.open}}" aria-label="{{pp.aria}}">
                    <span class="rx-mini" style="aspect-ratio: {{pp.ratio}}; background: {{pp.paper}}"><sc-for list="{{pp.blocks}}" as="pb" hint-placeholder-count="3"><span class="rx-mb" style="left: {{pb.l}}; top: {{pb.t}}; width: {{pb.w}}; height: {{pb.h}}; background: {{pb.bg}}"></span></sc-for><sc-if value="{{pp.locked}}" hint-placeholder-val="{{ false }}"><span class="rx-lock" aria-hidden="true"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg></span></sc-if></span>
                    <span class="rx-thumb-cap"><span class="num">{{pp.n}}</span> · {{pp.rubric}}</span>
                    <span class="rx-badge" style="background: {{pp.stBg}}; color: {{pp.stFg}}; align-self: flex-start">{{pp.stLabel}}</span>
                    <sc-if value="{{pp.hasTag}}" hint-placeholder-val="{{ false }}"><span class="rx-tagline">{{pp.tag}}</span></sc-if>
                  </button>
                </sc-for>
                <sc-if value="{{rx.prod.canAddPage}}" hint-placeholder-val="{{ true }}"><button type="button" class="rx-thumb rx-addpage" onClick="{{rx.prod.addPage}}"><span>+</span>Ajouter une page</button></sc-if>
              </div>
              <div class="rx-legend"><span><i style="background: rgba(15,34,54,.78)"></i>Article</span><span><i style="background: rgba(200,136,26,.85)"></i>Photo</span><span><i style="background: rgba(120,120,120,.5)"></i>Publicité</span><span><i style="background: rgba(32,64,110,.72)"></i>Élément fixe</span><span><i style="background: repeating-linear-gradient(45deg, rgba(155,28,43,.6) 0 3px, rgba(255,255,255,.4) 3px 6px)"></i>Emplacement réservé</span></div>
            </sc-if>

            <!-- page -->
            <sc-if value="{{rx.prod.isPage}}" hint-placeholder-val="{{ false }}">
              <sc-if value="{{rx.prod.hasPg}}" hint-placeholder-val="{{ true }}">
                <div class="rx-pageed">
                  <div class="rx-pagebox">
                    <div class="rx-pagenav"><button type="button" class="rx-tbtn" onClick="{{rx.prod.pg.prev}}" disabled="{{rx.prod.pg.noPrev}}">← Page précédente</button><span class="cond">Page {{rx.prod.pg.n}} / {{rx.prod.pg.total}} · {{rx.prod.pg.rubric}}</span><button type="button" class="rx-tbtn" onClick="{{rx.prod.pg.next}}" disabled="{{rx.prod.pg.noNext}}">Page suivante →</button></div>
                    <div class="rx-page" style="aspect-ratio: {{rx.prod.ratio}}; background: {{rx.prod.paper}}; color: {{rx.prod.ink}}; --rx-acc: {{rx.prod.accent}}; --rx-font: {{rx.prod.font}}">
                      <sc-for list="{{rx.prod.pg.els}}" as="pe" hint-placeholder-count="3">
                        <button type="button" class="rx-el rx-el-{{pe.kind}}" onClick="{{pe.select}}" aria-pressed="{{pe.sel}}" aria-label="{{pe.aria}}" style="left: {{pe.l}}; top: {{pe.t}}; width: {{pe.w}}; height: {{pe.h}}">
                          <sc-if value="{{pe.hasImg}}" hint-placeholder-val="{{ false }}"><img src="{{pe.img}}" alt="" class="rx-el-img"></sc-if>
                          <span class="rx-el-k">{{pe.kindLabel}}</span>
                          <span class="rx-el-t">{{pe.title}}</span>
                          <sc-if value="{{pe.hasText}}" hint-placeholder-val="{{ false }}"><span class="rx-el-x">{{pe.text}}</span></sc-if>
                          <sc-if value="{{pe.hasFit}}" hint-placeholder-val="{{ false }}"><span class="rx-fit" style="background: {{pe.fitBg}}; color: {{pe.fitFg}}">{{pe.fitLabel}}</span></sc-if>
                          <sc-if value="{{pe.reserved}}" hint-placeholder-val="{{ false }}"><span class="rx-res">Réservé · en attente du visuel</span></sc-if>
                          <sc-if value="{{pe.rights}}" hint-placeholder-val="{{ false }}"><span class="rx-res" style="color: #9b1c2b">Droits : non autorisée en Gazette</span></sc-if>
                        </button>
                      </sc-for>
                      <sc-if value="{{rx.prod.pg.locked}}" hint-placeholder-val="{{ false }}"><div class="rx-veil"><div><strong>Page héritée et verrouillée.</strong> Identique à sa page source, elle suit automatiquement ses corrections. <button type="button" class="btn btn-dark rx-sm" onClick="{{rx.prod.pg.dissociate}}" style="margin-top: .5rem">Dissocier pour modifier</button></div></div></sc-if>
                    </div>
                    <sc-if value="{{rx.prod.pg.hasOut}}" hint-placeholder-val="{{ false }}"><div class="rx-alert rx-alert-err" style="margin-top: .8rem">Hors page (pas de place) : {{rx.prod.pg.outList}}. Réduisez un bloc ou retirez un élément.</div></sc-if>
                  </div>
                  <div class="rx-inspector">
                    <div class="rx-box">
                      <div class="rx-row2">
                        <label class="lbl">Rubrique<x-select class="field" value="{{rx.prod.pg.rubric}}" onChange="{{rx.prod.pg.onRubric}}" disabled="{{rx.prod.pg.closed}}"><sc-for list="{{rx.prod.pg.rubricOpts}}" as="o" hint-placeholder-count="5"><x-option value="{{o.v}}">{{o.l}}</x-option></sc-for></x-select></label>
                        <label class="lbl">Statut<x-select class="field" value="{{rx.prod.pg.status}}" onChange="{{rx.prod.pg.onStatus}}" disabled="{{rx.prod.pg.closed}}"><sc-for list="{{rx.prod.pg.statusOpts}}" as="o" hint-placeholder-count="4"><x-option value="{{o.v}}">{{o.l}}</x-option></sc-for></x-select></label>
                      </div>
                      <sc-if value="{{rx.prod.pg.isInherited}}" hint-placeholder-val="{{ false }}"><p class="rx-muted" style="margin: .2rem 0 .5rem">{{rx.prod.pg.inhInfo}}</p><sc-if value="{{rx.prod.pg.canRelock}}" hint-placeholder-val="{{ false }}"><button type="button" class="rx-tbtn" onClick="{{rx.prod.pg.relock}}">Relier à la page source</button></sc-if></sc-if>
                      <sc-if value="{{rx.prod.pg.isReused}}" hint-placeholder-val="{{ false }}"><p class="rx-muted" style="margin: .2rem 0 .5rem">Reprise de « {{rx.prod.pg.reusedLabel}} ».</p><sc-if value="{{rx.prod.pg.chartePending}}" hint-placeholder-val="{{ false }}"><button type="button" class="btn btn-gold rx-sm" onClick="{{rx.prod.pg.applyTemplates}}">Appliquer nos modèles</button></sc-if></sc-if>
                      <sc-if value="{{rx.prod.pg.closed}}" hint-placeholder-val="{{ false }}"><p class="rx-muted" style="margin: .2rem 0 0">Édition bouclée : lecture seule.</p></sc-if>
                    </div>
                    <sc-if value="{{rx.prod.pg.editable}}" hint-placeholder-val="{{ true }}">

<!-- ================= VÉRIFIER UN CERTIFICAT ================= -->
<sc-if value="{{isVerifier}}" hint-placeholder-val="{{ false }}">
  <section class="wrap vf-wrap">
    <div class="eb" style="margin-bottom: .5rem">Partenaires Casa Besports</div>
    <h1 class="h1 tr-title"><span class="bn-bh"><span class="bn-bandeau">Vérifier</span></span> une carte membre</h1>
    <p class="tr-dek">Scannez le QR code de la carte avec l’appareil photo du téléphone, ou saisissez le numéro (CB-XXXX-XXXX-X).</p>
    <div class="vf-form"><input class="field" value="{{mb.q}}" onChange="{{mb.onQ}}" placeholder="CB-…" aria-label="Numéro de membre" autocapitalize="characters"><button type="button" class="btn btn-dark" onClick="{{mb.check}}">Vérifier</button></div>
    <sc-if value="{{mb.busy}}" hint-placeholder-val="{{ false }}"><p class="pulse" style="color: var(--muted)">Vérification…</p></sc-if>
    <sc-if value="{{mb.ok}}" hint-placeholder-val="{{ false }}"><div class="vf-res is-ok" role="status"><span class="bn-etiq">Membre valide</span><div class="vf-nom">{{mb.prenom}}</div><div class="vf-titre">{{mb.q}}</div><p class="tr-p">{{mb.depuis}}</p></div></sc-if>
    <sc-if value="{{mb.off}}" hint-placeholder-val="{{ false }}"><div class="vf-res is-ko" role="status"><span class="bn-etiq">Carte suspendue</span><p class="tr-p">Cette carte n’ouvre pas droit aux avantages partenaires pour le moment.</p></div></sc-if>
    <sc-if value="{{mb.none}}" hint-placeholder-val="{{ false }}"><div class="vf-res is-ko" role="status"><span class="bn-etiq">Introuvable</span><p class="tr-p">Aucun membre ne porte ce numéro.</p></div></sc-if>
    <sc-if value="{{mb.bad}}" hint-placeholder-val="{{ false }}"><div class="vf-res is-ko" role="status"><span class="bn-etiq">Numéro invalide</span><p class="tr-p">Ce numéro n’est pas un numéro de membre Casa Besports. Vérifiez la saisie.</p></div></sc-if>
    <sc-if value="{{mb.format}}" hint-placeholder-val="{{ false }}"><div class="vf-res is-ok" role="status"><span class="bn-etiq">Numéro authentique</span><div class="vf-titre">{{mb.q}}</div><p class="tr-p">Le numéro est valide. Le contrôle en ligne sera disponible prochainement.</p></div></sc-if>
    <div style="height: 3rem"></div>
    <div class="eb" style="margin-bottom: .5rem">Certification Casa Besports</div>
    <h1 class="h1 tr-title"><span class="bn-bh"><span class="bn-bandeau">Vérifier</span></span> un certificat</h1>
    <p class="tr-dek">Chaque CV certifié porte un numéro (CB-2026-XXXXXX) et un QR code. Saisissez le numéro pour vérifier qu’il a bien été délivré par l’équipe Casa Besports.</p>
    <div class="vf-form"><input class="field" value="{{cvv.verif.q}}" onChange="{{cvv.verif.onQ}}" placeholder="CB-2026-…" aria-label="Numéro du certificat" autocapitalize="characters"><button type="button" class="btn btn-dark" onClick="{{cvv.verif.go}}">Vérifier</button></div>
    <sc-if value="{{cvv.verif.ok}}" hint-placeholder-val="{{ false }}"><div class="vf-res is-ok" role="status"><span class="bn-etiq">Certificat valide</span><div class="vf-nom">{{cvv.verif.nom}}</div><div class="vf-titre">{{cvv.verif.titre}}</div><div class="tr-muted">Délivré le {{cvv.verif.emis}} par {{cvv.verif.par}} · empreinte {{cvv.verif.empreinte}}…</div><sc-if value="{{cvv.verif.demo}}" hint-placeholder-val="{{ false }}"><p class="tr-err">Spécimen de démonstration : sans valeur.</p></sc-if></div></sc-if>
    <sc-if value="{{cvv.verif.ko}}" hint-placeholder-val="{{ false }}"><div class="vf-res is-ko" role="status"><span class="bn-etiq">Certificat {{cvv.verif.statut}}</span><div class="vf-nom">{{cvv.verif.nom}}</div><p class="tr-p">Ce certificat n’est plus valable : ne vous fiez pas au sceau du document présenté.</p></div></sc-if>
    <sc-if value="{{cvv.verif.absent}}" hint-placeholder-val="{{ false }}"><div class="vf-res is-ko" role="status"><span class="bn-etiq">Introuvable</span><p class="tr-p">Aucun certificat ne porte ce numéro. Vérifiez la saisie (les lettres I, O et les chiffres 0, 1 ne sont jamais utilisés).</p></div></sc-if>
    <p class="tr-src">Le certificat atteste le contenu du CV au jour de sa délivrance : l’identité, le parcours sportif confirmé auprès des clubs et les diplômes présentés. Un CV modifié après coup perd son sceau jusqu’à une nouvelle vérification.</p>
  </section>
</sc-if>


<!-- ================= MÉTÉO ================= -->
