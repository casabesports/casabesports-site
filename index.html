    </div>
    <div style="display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; margin-bottom: .75rem">
      <sc-for list="{{wxFind.mine}}" as="wm" hint-placeholder-count="0"><span style="display: inline-flex; align-items: stretch"><button type="button" class="chip" onClick="{{wm.pick}}" title="{{wm.region}}" style="background: {{wm.bg}}; color: {{wm.fg}}; border: 1.5px solid {{wm.border}}">{{wm.label}}</button><button type="button" onClick="{{wm.remove}}" aria-label="Retirer {{wm.label}}" style="border: 1.5px solid var(--line-2); border-left: 0; background: var(--surface); color: var(--muted); cursor: pointer; padding: 0 .55rem">×</button></span></sc-for>
    </div>
    <div style="position: relative; max-width: 520px; margin-bottom: 1.25rem">
      <label class="lbl" style="margin: 0">Une autre ville, en France ou dans le monde<input class="field" type="search" value="{{wxFind.q}}" onChange="{{wxFind.onQ}}" placeholder="Paris, Lisbonne, Montréal, Dakar…" autocomplete="off"></label>
      <sc-if value="{{wxFind.busy}}" hint-placeholder-val="{{ false }}"><p style="color: var(--muted); font-size: 13px; margin: .4rem 0 0">Recherche…</p></sc-if>
      <sc-if value="{{wxFind.none}}" hint-placeholder-val="{{ false }}"><p style="color: var(--muted); font-size: 13px; margin: .4rem 0 0">Aucune ville trouvée.</p></sc-if>
      <sc-if value="{{wxFind.hasRes}}" hint-placeholder-val="{{ false }}"><div role="listbox" aria-label="Villes trouvées" style="position: absolute; z-index: 5; left: 0; right: 0; background: var(--surface); border: 1px solid var(--line-2); box-shadow: 0 16px 40px rgba(0,0,0,.18)">
        <sc-for list="{{wxFind.res}}" as="wr" hint-placeholder-count="0"><button type="button" role="option" onClick="{{wr.add}}" style="display: flex; justify-content: space-between; gap: 1rem; width: 100%; text-align: left; background: none; border: 0; border-bottom: 1px solid var(--line); padding: .7rem .9rem; cursor: pointer; color: var(--text)"><strong>{{wr.name}}</strong><span style="color: var(--muted); font-size: 13px">{{wr.region}}</span></button></sc-for>
      </div></sc-if>
    </div>
    <sc-if value="{{wx.loading}}" hint-placeholder-val="{{ false }}"><p class="pulse" style="color: var(--muted)">Chargement des prévisions…</p></sc-if>

    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); gap: 1rem; margin-bottom: 1rem">
      <!-- Maintenant -->
      <div class="cb-deep" style="background: var(--inv-bg); color: var(--on-inv); border-radius: 0; padding: 1.5rem; position: relative; overflow: hidden">
        <div class="cond" style="font-size: 13px; color: var(--gold-on-inv)">Maintenant · {{wx.city}}</div>
        <div style="display: flex; align-items: center; gap: 1rem; margin: .6rem 0">
          <svg width="76" height="76" viewBox="0 0 24 24" fill="none" stroke="var(--gold-on-inv)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{wx.nowIco}}"></path></svg>
          <div><div class="num" style="font-size: 72px; line-height: .9; color: var(--on-inv)">{{wx.nowTemp}}</div><div style="color: var(--on-inv-2)">{{wx.nowLabel}} · ressenti {{wx.nowFeels}}</div></div>
        </div>
        <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: .5rem; margin-top: 1rem">
          <div style="background: var(--inv-bg-2); border-radius: 0; padding: .6rem .7rem"><div class="cond" style="font-size: 11px; color: var(--on-inv-2)">Vent</div><div class="num" style="font-size: 19px">{{wx.nowWind}}</div><div style="font-size: 12px; color: var(--on-inv-2)">rafales {{wx.nowGust}}</div></div>
          <div style="background: var(--inv-bg-2); border-radius: 0; padding: .6rem .7rem"><div class="cond" style="font-size: 11px; color: var(--on-inv-2)">Humidité</div><div class="num" style="font-size: 19px">{{wx.nowHum}}</div></div>
          <div style="background: var(--inv-bg-2); border-radius: 0; padding: .6rem .7rem"><div class="cond" style="font-size: 11px; color: var(--on-inv-2)">Pluie</div><div class="num" style="font-size: 19px">{{wx.nowRain}}</div></div>
        </div>
      </div>
      <!-- Conditions de jeu -->
      <div style="background: var(--surface); border: 1px solid var(--line); border-radius: 0; padding: 1.25rem 1.4rem">
        <div class="eb" style="font-size: 13px; margin-bottom: .75rem">Conditions de jeu aujourd’hui</div>
        <div style="display: flex; flex-direction: column; gap: .55rem">
          <sc-for list="{{wx.play}}" as="pc" hint-placeholder-count="4">
            <div style="display: flex; align-items: center; gap: .7rem"><span style="width: 12px; height: 12px; border-radius: 50%; background: {{pc.color}}; flex: none"></span><span style="flex: 1; font-weight: 700; color: var(--text)">{{pc.sport}}</span><span style="font-size: 13.5px; color: var(--text-2); text-align: right">{{pc.verdict}}</span></div>
          </sc-for>
        </div>
        <div style="border-top: 1px solid var(--line); margin-top: 1rem; padding-top: .8rem; display: grid; grid-template-columns: 1fr 1fr; gap: .5rem; font-size: 13.5px; color: var(--text-2)">
          <span>Lever : <strong style="color: var(--text)">{{wx.sunrise}}</strong></span><span>Coucher : <strong style="color: var(--text)">{{wx.sunset}}</strong></span>
          <span>Mer : <strong style="color: var(--text)">{{wx.waves}}</strong></span><span>Marées : <a href="https://maree.shom.fr/" target="_blank" rel="noopener" style="color: var(--text); font-weight: 700">horaires SHOM</a></span>
        </div>
        <div style="margin-top: .8rem; background: var(--note-bg); color: var(--note-fg); border: 1px solid var(--note-line); border-radius: 0; padding: .55rem .75rem; font-size: 13px">Vigilance Météo-France : <a href="https://vigilance.meteofrance.fr/fr" target="_blank" rel="noopener" style="color: inherit; font-weight: 700">voir la carte officielle</a></div>
      </div>
    </div>

    <!-- Heure par heure -->
    <div style="background: var(--surface); border: 1px solid var(--line); border-radius: 0; padding: 1.1rem 1.25rem; margin-bottom: 1rem">
      <div class="eb" style="font-size: 13px; margin-bottom: .75rem">Heure par heure</div>
      <div style="display: flex; gap: .45rem; overflow-x: auto; padding-bottom: .3rem">
        <sc-for list="{{wx.hours}}" as="hr" hint-placeholder-count="12">
          <div style="flex: none; width: 66px; text-align: center; background: var(--surface-3); border: 1px solid var(--line); border-radius: 0; padding: .55rem .2rem">
            <div class="cond" style="font-size: 12px; color: var(--muted)">{{hr.h}}</div>
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="var(--text-2)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{hr.ico}}"></path></svg>
            <div class="num" style="font-size: 18px; color: var(--ink)">{{hr.t}}</div>
            <div style="font-size: 11.5px; color: var(--muted)">{{hr.p}}</div>
          </div>
        </sc-for>
      </div>
    </div>

    <!-- 7 jours -->
    <div style="background: var(--surface); border: 1px solid var(--line); border-radius: 0; padding: 1.1rem 1.25rem">
      <div class="eb" style="font-size: 13px; margin-bottom: .5rem">Prévisions sur 7 jours</div>
      <sc-for list="{{wx.days}}" as="dy" hint-placeholder-count="7">
        <div style="display: grid; grid-template-columns: minmax(70px, 110px) 30px minmax(0, 1fr) auto; gap: .75rem; align-items: center; padding: .55rem 0; border-bottom: 1px solid var(--line)">
          <span style="font-weight: 700; color: var(--text)">{{dy.dow}}</span>
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--text-2)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-label="{{dy.label}}"><path d="{{dy.ico}}"></path></svg>
          <span style="display: flex; align-items: center; gap: .6rem"><span class="num" style="width: 32px; text-align: right; color: var(--muted)">{{dy.min}}</span><span style="flex: 1; height: 6px; background: var(--surface-2); border-radius: 0; position: relative"><span style="position: absolute; left: {{dy.barL}}; width: {{dy.barW}}; top: 0; bottom: 0; border-radius: 0; background: linear-gradient(90deg, #6aa6c8, var(--acc))"></span></span><span class="num" style="width: 32px; color: var(--ink)">{{dy.max}}</span></span>
          <span style="font-size: 12.5px; color: var(--muted); text-align: right; min-width: 92px">{{dy.p}} · {{dy.w}}</span>
        </div>
      </sc-for>
    </div>
    <p style="font-size: 12.5px; color: var(--muted); margin-top: 1rem">{{wx.credit}}</p>
  </section>
</sc-if>

<!-- ================= ESPACE PRIVÉ : MON QUOTIDIEN ================= -->
<sc-if value="{{isPrivate}}" hint-placeholder-val="{{ false }}">
  <section class="wrap" style="padding-top: 1.5rem; padding-bottom: 5rem">
    <sc-if value="{{loggedOut}}" hint-placeholder-val="{{ false }}">
      <div style="max-width: 560px; margin: 2rem auto; text-align: center; background: var(--surface); border: 1px solid var(--line); border-radius: 0; padding: 2.5rem 1.75rem">
        <span style="width: 64px; height: 64px; border-radius: 50%; background: var(--surface-2); color: var(--gold-text); display: inline-flex; align-items: center; justify-content: center; margin-bottom: 1rem"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg></span>
        <h1 class="h2" style="font-size: 2.2rem; margin-bottom: .6rem">Mon quotidien</h1>
        <p style="color: var(--text-2); line-height: 1.6; margin: 0 0 1.5rem">Votre espace privé : agenda, rappels, famille, listes, repas, notes, budget sport, documents, activité, minuteur, habitudes et contacts utiles.</p>
        <button type="button" class="btn btn-dark" onClick="{{openLogin}}">Se connecter pour y accéder</button>
      </div>
    </sc-if>
    <sc-if value="{{loggedIn}}" hint-placeholder-val="{{ true }}">
      <div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 1rem; margin-bottom: 1rem">
        <div><div class="eb" style="margin-bottom: .3rem">Espace privé · {{displayName}}</div><h1 class="h1" style="font-size: clamp(2.2rem, 4.6vw, 3.6rem)">Mon quotidien</h1></div>
        <span style="font-size: 13px; color: var(--muted); display: inline-flex; align-items: center; gap: .4rem"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg>Visible par vous seul · enregistré sur cet appareil</span>
      </div>
      <div style="display: flex; flex-wrap: wrap; gap: 1.25rem; align-items: flex-start">
      <nav class="pv-side" aria-label="Rubriques de Mon quotidien" style="flex: 1 1 220px; max-width: 250px; position: sticky; top: 96px; background: var(--surface); border: 1px solid var(--line); border-radius: 0; padding: .75rem">
        <sc-for list="{{pvGroups}}" as="gr" hint-placeholder-count="4">
          <div class="pv-group">
            <div class="cond pv-gh" style="font-size: 11px; color: var(--muted); padding: .6rem .5rem .3rem">{{gr.label}}</div>
            <sc-for list="{{gr.tabs}}" as="pt" hint-placeholder-count="4"><button type="button" onClick="{{pt.pick}}" aria-current="{{pt.cur}}" class="pv-btn" style="background: {{pt.bg}}; color: {{pt.fg}}"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{pt.ico}}"></path></svg><span style="flex: 1">{{pt.label}}</span><sc-if value="{{pt.hasBadge}}" hint-placeholder-val="{{ false }}"><span class="num" style="min-width: 20px; height: 20px; border-radius: 0; background: var(--acc); color: var(--on-acc); font-size: 12px; display: inline-flex; align-items: center; justify-content: center; padding: 0 5px">{{pt.badge}}</span></sc-if></button></sc-for>
          </div>
        </sc-for>
      </nav>
      <div style="flex: 999 1 600px; min-width: 0">
      <h2 class="ttl" style="font-size: 30px; margin: 0 0 1rem">{{pvTitle}}</h2>

      <!-- MA JOURNÉE -->
      <sc-if value="{{pv.tJour}}" hint-placeholder-val="{{ true }}">
        <div class="bento">
          <div class="bento-item s2"><div class="b-card">
            <div class="b-head"><span class="cond" style="color: var(--gold-text)">{{todayLabel}}</span><button type="button" class="b-more" onClick="{{pv.goAgenda}}">Agenda</button></div>
            <sc-for list="{{pv.today}}" as="ev" hint-placeholder-count="3"><div style="display: flex; gap: .75rem; align-items: center; padding: .55rem 0; border-bottom: 1px solid var(--line)"><span class="num" style="width: 52px; color: var(--ink)">{{ev.time}}</span><span style="width: 8px; height: 8px; border-radius: 50%; background: {{ev.color}}; flex: none"></span><span style="flex: 1; font-weight: 700; color: var(--text)">{{ev.title}}</span><span class="cond" style="font-size: 11px; color: var(--muted)">{{ev.cat}}</span></div></sc-for>
            <sc-if value="{{pv.noToday}}" hint-placeholder-val="{{ false }}"><p style="color: var(--muted); margin: 0">Rien de prévu aujourd’hui.</p></sc-if>
          </div></div>
          <div class="bento-item"><button type="button" onClick="{{goMeteo}}" class="b-card" style="text-align: left; cursor: pointer"><div class="b-head"><span class="cond" style="color: var(--gold-text)">Météo · {{wx.city}}</span></div><div style="display: flex; align-items: center; gap: .6rem"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="var(--gold-text)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="{{wx.nowIco}}"></path></svg><span class="num" style="font-size: 40px; color: var(--ink)">{{wx.nowTemp}}</span></div><div style="font-size: 13.5px; color: var(--text-2); margin-top: .3rem">{{wx.nowLabel}} · {{wx.adviceShort}}</div></button></div>
          <div class="bento-item"><div class="b-card"><div class="b-head"><span class="cond" style="color: var(--gold-text)">À faire</span><button type="button" class="b-more" onClick="{{pv.goListes}}">Listes</button></div>
            <sc-for list="{{pv.todoTop}}" as="it" hint-placeholder-count="3"><label style="display: flex; gap: .6rem; align-items: center; min-height: 38px; cursor: pointer; color: var(--text); font-size: 14px"><input type="checkbox" checked="{{it.done}}" onChange="{{it.toggle}}" style="width: 18px; height: 18px; accent-color: var(--ink)"><span style="text-decoration: {{it.deco}}">{{it.text}}</span></label></sc-for>
            <div style="display: flex; gap: .35rem; margin-top: .5rem"><label style="flex: 1"><span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Nouvelle tâche</span><input class="field" value="{{pf.quick}}" onChange="{{pf.onQuick}}" placeholder="Nouvelle tâche…" style="min-height: 40px; font-size: 14px"></label><button type="button" onClick="{{pv.addQuick}}" aria-label="Ajouter la tâche" style="width: 40px; border-radius: 0; border: 0; background: var(--inv-bg); color: var(--on-inv); cursor: pointer; font-size: 20px">+</button></div>
          </div></div>
          <div class="bento-item"><div class="b-card"><div class="b-head"><span class="cond" style="color: var(--gold-text)">Rappels du jour</span><button type="button" class="b-more" onClick="{{pv.goRappels}}">Tous</button></div>
            <sc-for list="{{pv.recursToday}}" as="rc" hint-placeholder-count="2"><button type="button" onClick="{{rc.toggle}}" style="display: flex; gap: .6rem; align-items: center; width: 100%; text-align: left; background: none; border: 0; min-height: 38px; cursor: pointer; color: var(--text); font-size: 14px"><span style="width: 22px; height: 22px; border-radius: 50%; border: 2px solid {{rc.border}}; background: {{rc.bg}}; color: var(--on-acc); font-size: 12px; font-weight: 900; display: inline-flex; align-items: center; justify-content: center; flex: none">{{rc.mark}}</span><span style="text-decoration: {{rc.deco}}">{{rc.title}}</span></button></sc-for>
            <sc-if value="{{pv.noRecursToday}}" hint-placeholder-val="{{ false }}"><p style="margin: 0; color: var(--muted); font-size: 14px">Aucun rappel aujourd’hui.</p></sc-if>
          </div></div>
          <div class="bento-item"><div class="b-card"><div class="b-head"><span class="cond" style="color: var(--gold-text)">Au menu</span><button type="button" class="b-more" onClick="{{pv.goRepas}}">Semaine</button></div>
            <div style="font-size: 14px; color: var(--text-2)">Midi</div><div style="font-weight: 800; color: var(--text); margin-bottom: .5rem">{{pv.todayLunch}}</div>
            <div style="font-size: 14px; color: var(--text-2)">Soir</div><div style="font-weight: 800; color: var(--text)">{{pv.todayDinner}}</div>
          </div></div>
          <div class="bento-item"><div class="b-card"><div class="b-head"><span class="cond" style="color: var(--gold-text)">Habitudes du jour</span><button type="button" class="b-more" onClick="{{pv.goHabitudes}}">Suivi</button></div>
            <sc-for list="{{pv.habitsToday}}" as="hb" hint-placeholder-count="3"><button type="button" onClick="{{hb.toggle}}" style="display: flex; gap: .6rem; align-items: center; width: 100%; text-align: left; background: none; border: 0; min-height: 36px; cursor: pointer; color: var(--text); font-size: 14px"><span style="width: 22px; height: 22px; border-radius: 0; border: 2px solid {{hb.border}}; background: {{hb.bg}}; color: var(--on-acc); font-size: 12px; font-weight: 900; display: inline-flex; align-items: center; justify-content: center; flex: none">{{hb.mark}}</span>{{hb.name}}</button></sc-for>
          </div></div>
          <div class="bento-item"><div class="b-card"><div class="b-head"><span class="cond" style="color: var(--gold-text)">Documents</span><button type="button" class="b-more" onClick="{{pv.goDocs}}">Gérer</button></div>
            <sc-for list="{{pv.docsTop}}" as="dc" hint-placeholder-count="3"><div style="display: flex; justify-content: space-between; gap: .5rem; padding: .4rem 0; font-size: 14px; border-bottom: 1px solid var(--line)"><span style="color: var(--text); font-weight: 700">{{dc.name}}</span><span class="cond" style="font-size: 11px; color: {{dc.color}}">{{dc.status}}</span></div></sc-for>
          </div></div>
          <div class="bento-item"><div class="b-card"><div class="b-head"><span class="cond" style="color: var(--gold-text)">Activité · 7 jours</span><button type="button" class="b-more" onClick="{{pv.goActivite}}">Suivi</button></div><div class="num" style="font-size: 34px; color: var(--ink)">{{pv.weekMin}}</div><div style="font-size: 13px; color: var(--muted)">minutes de sport · objectif {{pv.goal}} min</div><div style="height: 8px; background: var(--surface-2); border-radius: 0; margin-top: .6rem; overflow: hidden"><div style="height: 8px; width: {{pv.goalPct}}; background: var(--acc)"></div></div></div></div>
          <div class="bento-item"><div class="b-card"><div class="b-head"><span class="cond" style="color: var(--gold-text)">Budget sport · {{pv.monthLabel}}</span><button type="button" class="b-more" onClick="{{pv.goBudget}}">Détail</button></div><div class="num" style="font-size: 34px; color: var(--ink)">{{pv.monthTotal}}</div><div style="font-size: 13px; color: var(--muted)">dépensés ce mois-ci</div></div></div>
        </div>
      </sc-if>

      <!-- AGENDA -->
      <sc-if value="{{pv.tAgenda}}" hint-placeholder-val="{{ false }}">
        <div style="display: flex; gap: .4rem; flex-wrap: wrap; margin-bottom: 1rem"><sc-for list="{{pv.memberFilter}}" as="mf" hint-placeholder-count="4"><button type="button" class="chip" onClick="{{mf.pick}}" aria-pressed="{{mf.pressed}}" style="min-height: 38px; font-size: 14px; background: {{mf.bg}}; color: {{mf.fg}}; border: 1.5px solid {{mf.border}}; display: inline-flex; align-items: center; gap: .4rem"><span style="width: 9px; height: 9px; border-radius: 50%; background: {{mf.dot}}"></span>{{mf.label}}</button></sc-for></div>
        <div style="display: flex; flex-wrap: wrap; gap: 1.25rem; align-items: flex-start">
          <div style="flex: 2 1 420px; display: flex; flex-direction: column; gap: 1rem">
            <sc-for list="{{pv.agendaDays}}" as="ad" hint-placeholder-count="3">
              <div><div class="cond" style="font-size: 13px; color: var(--gold-text); margin-bottom: .4rem">{{ad.label}}</div>
                <sc-for list="{{ad.items}}" as="ev" hint-placeholder-count="2"><div style="display: flex; gap: .75rem; align-items: center; background: var(--surface); border: 1px solid var(--line); border-left: 4px solid {{ev.color}}; border-radius: 0; padding: .65rem .8rem; margin-bottom: .4rem"><span class="num" style="width: 48px; color: var(--ink)">{{ev.time}}</span><span style="flex: 1"><span style="display: block; font-weight: 800; color: var(--text)">{{ev.title}}</span><span style="font-size: 12.5px; color: var(--muted)">{{ev.cat}}{{ev.place}}{{ev.who}}</span></span><sc-if value="{{ev.canDelete}}" hint-placeholder-val="{{ true }}"><button type="button" onClick="{{ev.remove}}" aria-label="Supprimer {{ev.title}}" style="width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line-2); background: var(--surface); cursor: pointer; color: var(--muted)">×</button></sc-if></div></sc-for>
              </div>
            </sc-for>
            <sc-if value="{{pv.agendaEmpty}}" hint-placeholder-val="{{ false }}"><p style="color: var(--muted)">Aucun événement à venir.</p></sc-if>
          </div>
          <div style="flex: 1 1 280px; background: var(--surface); border: 1px solid var(--line); border-radius: 0; padding: 1.1rem 1.25rem">
            <div class="ttl" style="font-size: 22px; margin-bottom: .8rem">Ajouter un événement</div>
            <label class="lbl" style="margin-bottom: .6rem">Titre<input class="field" value="{{pf.evTitle}}" onChange="{{pf.onEvTitle}}" placeholder="Entraînement U13, dentiste…"></label>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: .5rem; margin-bottom: .6rem"><label class="lbl">Date<input class="field" type="date" value="{{pf.evDate}}" onChange="{{pf.onEvDate}}"></label><label class="lbl">Heure<input class="field" type="time" value="{{pf.evTime}}" onChange="{{pf.onEvTime}}"></label></div>
            <label class="lbl" style="margin-bottom: .6rem">Lieu<input class="field" value="{{pf.evPlace}}" onChange="{{pf.onEvPlace}}" placeholder="Facultatif"></label>
            <label class="lbl" style="margin-bottom: .6rem">Pour<x-select class="field" value="{{pf.evWho}}" onChange="{{pf.onEvWho}}"><sc-for list="{{pv.memberOpts}}" as="mo" hint-placeholder-count="3"><x-option value="{{mo.v}}">{{mo.l}}</x-option></sc-for></x-select></label>
            <div class="lbl" style="margin-bottom: .35rem">Catégorie</div>
            <div style="display: flex; flex-wrap: wrap; gap: .3rem; margin-bottom: .9rem"><sc-for list="{{pv.cats}}" as="ct" hint-placeholder-count="5"><button type="button" onClick="{{ct.pick}}" style="min-height: 36px; padding: 0 .7rem; border-radius: 0; cursor: pointer; font-size: 13px; font-weight: 700; background: {{ct.bg}}; color: {{ct.fg}}; border: 1.5px solid {{ct.color}}">{{ct.label}}</button></sc-for></div>
            <button type="button" class="btn btn-dark" onClick="{{pv.addEvent}}" style="width: 100%">Ajouter</button>
            <p style="font-size: 12.5px; color: var(--muted); margin: .8rem 0 0">Les matchs pour lesquels vous activez un rappel dans Le Terrain apparaissent ici automatiquement.</p>
          </div>
        </div>
      </sc-if>

      <!-- LISTES -->
      <sc-if value="{{pv.tListes}}" hint-placeholder-val="{{ false }}">
        <div style="display: flex; gap: .4rem; flex-wrap: wrap; margin-bottom: 1rem"><sc-for list="{{pv.listTabs}}" as="lt" hint-placeholder-count="3"><button type="button" class="chip" onClick="{{lt.pick}}" aria-pressed="{{lt.pressed}}" style="background: {{lt.bg}}; color: {{lt.fg}}; border: 1.5px solid {{lt.border}}">{{lt.label}} · {{lt.left}}</button></sc-for></div>
        <div style="max-width: 640px; background: var(--surface); border: 1px solid var(--line); border-radius: 0; padding: 1rem 1.25rem">
          <div style="display: flex; gap: .4rem; margin-bottom: .75rem"><label style="flex: 1"><span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Nouvel élément</span><input class="field" value="{{pf.item}}" onChange="{{pf.onItem}}" placeholder="{{pv.itemPh}}"></label><button type="button" class="btn btn-dark" onClick="{{pv.addItem}}">Ajouter</button></div>
          <sc-for list="{{pv.items}}" as="it" hint-placeholder-count="5">
            <div style="display: flex; align-items: center; gap: .6rem; border-bottom: 1px solid var(--line); min-height: 48px">
              <label style="flex: 1; display: flex; align-items: center; gap: .7rem; cursor: pointer; color: var(--text)"><input type="checkbox" checked="{{it.done}}" onChange="{{it.toggle}}" style="width: 20px; height: 20px; accent-color: var(--ink)"><span style="text-decoration: {{it.deco}}; color: {{it.color}}">{{it.text}}</span></label>
              <button type="button" onClick="{{it.remove}}" aria-label="Supprimer {{it.text}}" style="width: 36px; height: 36px; border-radius: 50%; border: 0; background: transparent; cursor: pointer; color: var(--muted); font-size: 18px">×</button>
            </div>
          </sc-for>
          <sc-if value="{{pv.itemsEmpty}}" hint-placeholder-val="{{ false }}"><p style="color: var(--muted)">Liste vide.</p></sc-if>
          <div style="display: flex; justify-content: space-between; align-items: center; margin-top: .75rem; font-size: 13.5px; color: var(--muted)"><span>{{pv.itemsLeft}} restant(s)</span><button type="button" class="lnk" onClick="{{pv.clearDone}}" style="font-size: 14px">Retirer les éléments cochés</button></div>
        </div>
      </sc-if>

      <!-- NOTES -->
      <sc-if value="{{pv.tNotes}}" hint-placeholder-val="{{ false }}">
        <div style="display: flex; flex-wrap: wrap; gap: 1rem; align-items: flex-start">
          <div style="flex: 1 1 240px; max-width: 320px; display: flex; flex-direction: column; gap: .4rem">
            <button type="button" class="btn btn-dark" onClick="{{pv.newNote}}">Nouvelle note</button>
            <sc-for list="{{pv.notes}}" as="nt" hint-placeholder-count="3"><button type="button" onClick="{{nt.pick}}" style="text-align: left; padding: .7rem .85rem; border-radius: 0; cursor: pointer; background: {{nt.bg}}; border: 1.5px solid {{nt.border}}; color: var(--text)"><span style="display: block; font-weight: 800">{{nt.title}}</span><span style="font-size: 12.5px; color: var(--muted)">{{nt.preview}}</span></button></sc-for>
          </div>
          <div style="flex: 3 1 420px; background: var(--surface); border: 1px solid var(--line); border-radius: 0; padding: 1rem 1.25rem">
            <sc-if value="{{pv.hasNote}}" hint-placeholder-val="{{ true }}">
              <label class="lbl" style="margin-bottom: .6rem">Titre<input class="field" value="{{pv.note.title}}" onChange="{{pv.onNoteTitle}}" style="font-family: 'League Spartan', 'Arial Black', sans-serif; font-size: 22px; font-weight: 700"></label>
              <label class="lbl">Note<textarea class="field" value="{{pv.note.text}}" onChange="{{pv.onNoteText}}" style="min-height: 260px; padding: .8rem .9rem; line-height: 1.65; resize: vertical"></textarea></label>
              <div style="display: flex; justify-content: space-between; align-items: center; margin-top: .6rem; font-size: 13px; color: var(--muted)"><span>Enregistrement automatique</span><button type="button" onClick="{{pv.deleteNote}}" style="background: none; border: 0; cursor: pointer; color: var(--danger); font-weight: 700; min-height: 40px">Supprimer la note</button></div>
            </sc-if>
            <sc-if value="{{pv.noNote}}" hint-placeholder-val="{{ false }}"><p style="color: var(--muted)">Créez une note pour commencer.</p></sc-if>
          </div>
        </div>
      </sc-if>

      <!-- BUDGET -->
      <sc-if value="{{pv.tBudget}}" hint-placeholder-val="{{ false }}">
        <div style="display: flex; flex-wrap: wrap; gap: 1.25rem; align-items: flex-start">
          <div style="flex: 2 1 420px">
            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: .6rem; margin-bottom: 1rem">
              <sc-for list="{{pv.budgetCats}}" as="bc" hint-placeholder-count="4"><div style="background: var(--surface); border: 1px solid var(--line); border-radius: 0; padding: .8rem .9rem"><div class="cond" style="font-size: 11px; color: var(--muted)">{{bc.label}}</div><div class="num" style="font-size: 22px; color: var(--ink)">{{bc.total}}</div><div style="height: 5px; background: var(--surface-2); border-radius: 0; margin-top: .4rem; overflow: hidden"><div style="height: 5px; width: {{bc.pct}}; background: var(--acc)"></div></div></div></sc-for>
            </div>
            <div style="background: var(--surface); border: 1px solid var(--line); border-radius: 0; overflow: hidden">
              <sc-for list="{{pv.budget}}" as="bg" hint-placeholder-count="4"><div style="display: flex; gap: .75rem; align-items: center; padding: .65rem .9rem; border-bottom: 1px solid var(--line)"><span style="font-size: 12.5px; color: var(--muted); width: 64px">{{bg.date}}</span><span style="flex: 1; font-weight: 700; color: var(--text)">{{bg.label}}</span><span class="cond" style="font-size: 11px; color: var(--muted)">{{bg.cat}}</span><span class="num" style="font-size: 17px; color: var(--ink); min-width: 70px; text-align: right">{{bg.amount}}</span><button type="button" onClick="{{bg.remove}}" aria-label="Supprimer {{bg.label}}" style="width: 32px; height: 32px; border: 0; background: none; cursor: pointer; color: var(--muted)">×</button></div></sc-for>
              <div style="display: flex; justify-content: space-between; padding: .8rem .9rem; font-weight: 800; color: var(--text)"><span>Total {{pv.yearLabel}}</span><span class="num" style="font-size: 20px">{{pv.yearTotal}}</span></div>
            </div>
          </div>
          <div style="flex: 1 1 280px; background: var(--surface); border: 1px solid var(--line); border-radius: 0; padding: 1.1rem 1.25rem">
            <div class="ttl" style="font-size: 22px; margin-bottom: .8rem">Nouvelle dépense</div>
            <label class="lbl" style="margin-bottom: .6rem">Libellé<input class="field" value="{{pf.bLabel}}" onChange="{{pf.onBLabel}}" placeholder="Licence, crampons…"></label>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: .5rem; margin-bottom: .6rem"><label class="lbl">Montant (€)<input class="field" type="number" min="0" step="0.01" value="{{pf.bAmount}}" onChange="{{pf.onBAmount}}"></label><label class="lbl">Catégorie<x-select class="field" value="{{pf.bCat}}" onChange="{{pf.onBCat}}"><x-option value="Licences">Licences</x-option><x-option value="Équipement">Équipement</x-option><x-option value="Déplacements">Déplacements</x-option><x-option value="Abonnements">Abonnements</x-option><x-option value="Autre">Autre</x-option></x-select></label></div>
            <button type="button" class="btn btn-dark" onClick="{{pv.addBudget}}" style="width: 100%">Ajouter</button>
            <button type="button" onClick="{{goOlisto}}" style="margin-top: .8rem; width: 100%; text-align: left; background: var(--surface-2); border: 1px solid var(--line); border-radius: 0; padding: .7rem .8rem; cursor: pointer; color: var(--text)"><span class="cond" style="display: block; font-size: 11px; color: var(--gold-text)">Partenaire · OlistO</span><span style="font-weight: 700; font-size: 14px">Un projet immobilier ou des crédits à regrouper ? Simuler →</span></button>
          </div>
        </div>
      </sc-if>

      <!-- DOCUMENTS -->
      <sc-if value="{{pv.tDocs}}" hint-placeholder-val="{{ false }}">
        <div style="display: flex; flex-wrap: wrap; gap: 1.25rem; align-items: flex-start">
          <div style="flex: 2 1 420px; display: flex; flex-direction: column; gap: .5rem">
            <sc-for list="{{pv.docs}}" as="dc" hint-placeholder-count="3"><div style="display: flex; gap: .8rem; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 0; padding: .8rem 1rem"><span style="width: 40px; height: 40px; border-radius: 0; background: var(--surface-2); color: var(--gold-text); display: flex; align-items: center; justify-content: center; flex: none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h8l4 4v14H6z"></path><path d="M14 3v4h4"></path></svg></span><span style="flex: 1"><span style="display: block; font-weight: 800; color: var(--text)">{{dc.name}}</span><span style="font-size: 12.5px; color: var(--muted)">{{dc.who}} · échéance {{dc.dateLabel}}</span></span><span class="cond" style="font-size: 11.5px; padding: .3rem .55rem; border-radius: 0; background: {{dc.bg}}; color: {{dc.color}}">{{dc.status}}</span><button type="button" onClick="{{dc.remove}}" aria-label="Supprimer {{dc.name}}" style="width: 32px; height: 32px; border: 0; background: none; cursor: pointer; color: var(--muted)">×</button></div></sc-for>
          </div>
          <div style="flex: 1 1 280px; background: var(--surface); border: 1px solid var(--line); border-radius: 0; padding: 1.1rem 1.25rem">
            <div class="ttl" style="font-size: 22px; margin-bottom: .8rem">Suivre un document</div>
            <label class="lbl" style="margin-bottom: .6rem">Document<input class="field" value="{{pf.dName}}" onChange="{{pf.onDName}}" placeholder="Certificat médical, licence…"></label>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: .5rem; margin-bottom: .8rem"><label class="lbl">Pour<input class="field" value="{{pf.dWho}}" onChange="{{pf.onDWho}}" placeholder="Moi, Léo…"></label><label class="lbl">Échéance<input class="field" type="date" value="{{pf.dDate}}" onChange="{{pf.onDDate}}"></label></div>
            <button type="button" class="btn btn-dark" onClick="{{pv.addDoc}}" style="width: 100%">Ajouter</button>
            <p style="font-size: 12.5px; color: var(--muted); margin: .8rem 0 0">Alerte 30 jours avant l’échéance. Les fichiers restent sur cet appareil.</p>
          </div>
        </div>
      </sc-if>

      <!-- ACTIVITÉ -->
      <sc-if value="{{pv.tActivite}}" hint-placeholder-val="{{ false }}">
        <div style="display: flex; flex-wrap: wrap; gap: 1.25rem; align-items: flex-start">
          <div style="flex: 2 1 420px">
            <div style="background: var(--surface); border: 1px solid var(--line); border-radius: 0; padding: 1.1rem 1.25rem; margin-bottom: 1rem">
              <div style="display: flex; justify-content: space-between; align-items: baseline; margin-bottom: .8rem"><span class="eb" style="font-size: 13px">7 derniers jours</span><span class="num" style="font-size: 22px; color: var(--ink)">{{pv.weekMin}} min</span></div>
              <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: .5rem; align-items: end; height: 150px">
                <sc-for list="{{pv.weekBars}}" as="wb" hint-placeholder-count="7"><div style="display: flex; flex-direction: column; align-items: center; gap: .3rem; height: 100%; justify-content: flex-end"><span class="num" style="font-size: 12px; color: var(--muted)">{{wb.v}}</span><span style="width: 100%; max-width: 38px; height: {{wb.h}}; min-height: 3px; border-radius: 0 6px 2px 2px; background: {{wb.color}}"></span><span class="cond" style="font-size: 11px; color: var(--muted)">{{wb.d}}</span></div></sc-for>
              </div>
            </div>
            <sc-for list="{{pv.sessions}}" as="se" hint-placeholder-count="3"><div style="display: flex; gap: .75rem; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 0; padding: .6rem .85rem; margin-bottom: .4rem"><span style="font-size: 12.5px; color: var(--muted); width: 64px">{{se.date}}</span><span style="flex: 1; font-weight: 700; color: var(--text)">{{se.sport}}</span><span class="num" style="color: var(--ink)">{{se.min}} min</span><span style="font-size: 12.5px; color: var(--muted)">{{se.feel}}</span></div></sc-for>
          </div>
          <div style="flex: 1 1 280px; background: var(--surface); border: 1px solid var(--line); border-radius: 0; padding: 1.1rem 1.25rem">
            <div class="ttl" style="font-size: 22px; margin-bottom: .8rem">Nouvelle séance</div>
            <label class="lbl" style="margin-bottom: .6rem">Activité<x-select class="field" value="{{pf.sSport}}" onChange="{{pf.onSSport}}"><x-option value="Football">Football</x-option><x-option value="Course à pied">Course à pied</x-option><x-option value="Trail">Trail</x-option><x-option value="Basket">Basket</x-option><x-option value="Natation">Natation</x-option><x-option value="Vélo">Vélo</x-option><x-option value="Renforcement">Renforcement</x-option></x-select></label>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: .5rem; margin-bottom: .6rem"><label class="lbl">Durée (min)<input class="field" type="number" min="5" step="5" value="{{pf.sMin}}" onChange="{{pf.onSMin}}"></label><label class="lbl">Ressenti<x-select class="field" value="{{pf.sFeel}}" onChange="{{pf.onSFeel}}"><x-option value="Facile">Facile</x-option><x-option value="Moyen">Moyen</x-option><x-option value="Difficile">Difficile</x-option></x-select></label></div>
            <label class="lbl" style="margin-bottom: .8rem">Objectif hebdomadaire (min)<input class="field" type="number" min="30" step="10" value="{{pf.goal}}" onChange="{{pf.onGoal}}"></label>
            <button type="button" class="btn btn-dark" onClick="{{pv.addSession}}" style="width: 100%">Enregistrer</button>
          </div>
        </div>
      </sc-if>

      <!-- CONTACTS -->
      <sc-if value="{{pv.tContacts}}" hint-placeholder-val="{{ false }}">
        <div style="display: flex; flex-wrap: wrap; gap: 1.25rem; align-items: flex-start">
          <div style="flex: 2 1 420px; display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 240px), 1fr)); gap: .6rem">
            <sc-for list="{{pv.contacts}}" as="co" hint-placeholder-count="4"><div style="background: var(--surface); border: 1px solid var(--line); border-radius: 0; padding: .9rem 1rem; display: flex; flex-direction: column; gap: .3rem"><span style="font-weight: 800; color: var(--text)">{{co.name}}</span><span style="font-size: 13px; color: var(--muted)">{{co.role}}</span><div style="display: flex; gap: .4rem; margin-top: .3rem"><a href="{{co.tel}}" class="btn btn-ghost" style="min-height: 40px; font-size: 14px; flex: 1">Appeler</a><button type="button" onClick="{{co.remove}}" aria-label="Supprimer {{co.name}}" style="width: 40px; border-radius: 0; border: 1px solid var(--line-2); background: var(--surface); cursor: pointer; color: var(--muted)">×</button></div></div></sc-for>
          </div>
          <div style="flex: 1 1 280px; background: var(--surface); border: 1px solid var(--line); border-radius: 0; padding: 1.1rem 1.25rem">
            <div class="ttl" style="font-size: 22px; margin-bottom: .8rem">Nouveau contact</div>
            <label class="lbl" style="margin-bottom: .6rem">Nom<input class="field" value="{{pf.cName}}" onChange="{{pf.onCName}}"></label>
            <label class="lbl" style="margin-bottom: .6rem">Rôle<input class="field" value="{{pf.cRole}}" onChange="{{pf.onCRole}}" placeholder="Coach U13, kiné, covoiturage…"></label>
            <label class="lbl" style="margin-bottom: .8rem">Téléphone<input class="field" type="tel" value="{{pf.cTel}}" onChange="{{pf.onCTel}}"></label>
            <button type="button" class="btn btn-dark" onClick="{{pv.addContact}}" style="width: 100%">Ajouter</button>
          </div>
        </div>
      </sc-if>

      <!-- REPAS -->
      <sc-if value="{{pv.tRepas}}" hint-placeholder-val="{{ false }}">
        <div style="display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; justify-content: space-between; margin-bottom: 1rem">
          <p style="margin: 0; color: var(--text-2); max-width: 36rem">Planifiez midi et soir pour la semaine. Les ingrédients reconnus s’ajoutent à votre liste de courses en un clic.</p>
          <button type="button" class="btn btn-dark" onClick="{{pv.mealsToList}}">Générer la liste de courses</button>
        </div>
        <div style="overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 0">
          <div style="display: grid; grid-template-columns: 120px repeat(2, minmax(200px, 1fr)); min-width: 560px">
            <span class="cond" style="padding: .6rem .8rem; font-size: 12px; color: var(--muted); border-bottom: 1px solid var(--line)">Jour</span><span class="cond" style="padding: .6rem .8rem; font-size: 12px; color: var(--muted); border-bottom: 1px solid var(--line)">Midi</span><span class="cond" style="padding: .6rem .8rem; font-size: 12px; color: var(--muted); border-bottom: 1px solid var(--line)">Soir</span>
            <sc-for list="{{pv.meals}}" as="ml" hint-placeholder-count="7">
              <span style="padding: .5rem .8rem; font-weight: 800; color: {{ml.color}}; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; justify-content: center"><span>{{ml.day}}</span><sc-if value="{{ml.hasTag}}" hint-placeholder-val="{{ false }}"><span class="cond" style="font-size: 10.5px; color: var(--danger)">{{ml.tag}}</span></sc-if></span>
              <label style="padding: .35rem .5rem; border-bottom: 1px solid var(--line)"><span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Midi {{ml.day}}</span><input class="field" value="{{ml.lunch}}" onChange="{{ml.onLunch}}" placeholder="—" style="min-height: 40px; font-size: 14px"></label>
              <label style="padding: .35rem .5rem; border-bottom: 1px solid var(--line)"><span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Soir {{ml.day}}</span><input class="field" value="{{ml.dinner}}" onChange="{{ml.onDinner}}" placeholder="—" style="min-height: 40px; font-size: 14px"></label>
            </sc-for>
          </div>
        </div>
        <div class="lbl" style="margin: 1.25rem 0 .5rem">Idées d’avant-match (cliquez pour placer au prochain soir libre)</div>
        <div style="display: flex; flex-wrap: wrap; gap: .4rem"><sc-for list="{{pv.mealIdeas}}" as="mi" hint-placeholder-count="6"><button type="button" class="chip" onClick="{{mi.pick}}" style="background: var(--surface); color: var(--text); border: 1.5px solid var(--line-2); min-height: 40px; font-size: 14px; text-transform: none; letter-spacing: 0; font-family: inherit; font-weight: 700">{{mi.label}}</button></sc-for></div>
      </sc-if>

      <!-- HABITUDES -->
      <sc-if value="{{pv.tHabitudes}}" hint-placeholder-val="{{ false }}">
        <div style="overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 0; padding: .5rem 0">
          <div style="min-width: 560px">
            <div style="display: grid; grid-template-columns: minmax(180px, 1fr) repeat(7, 44px) 80px 40px; gap: .3rem; align-items: center; padding: .4rem 1rem; color: var(--muted)"><span class="cond" style="font-size: 12px">Habitude</span><sc-for list="{{pv.habitDays}}" as="hd" hint-placeholder-count="7"><span class="cond" style="font-size: 11px; text-align: center; color: {{hd.color}}">{{hd.l}}</span></sc-for><span class="cond" style="font-size: 12px; text-align: center">Série</span><span></span></div>
            <sc-for list="{{pv.habits}}" as="hb" hint-placeholder-count="4">
              <div style="display: grid; grid-template-columns: minmax(180px, 1fr) repeat(7, 44px) 80px 40px; gap: .3rem; align-items: center; padding: .35rem 1rem; border-top: 1px solid var(--line)">
                <span style="font-weight: 700; color: var(--text)">{{hb.name}}</span>
                <sc-for list="{{hb.cells}}" as="hc" hint-placeholder-count="7"><button type="button" onClick="{{hc.toggle}}" aria-pressed="{{hc.pressed}}" aria-label="{{hc.aria}}" style="width: 40px; height: 40px; border-radius: 0; cursor: pointer; background: {{hc.bg}}; color: var(--on-acc); border: 1.5px solid {{hc.border}}; font-weight: 900">{{hc.mark}}</button></sc-for>
                <span class="num" style="text-align: center; font-size: 18px; color: var(--ink)">{{hb.streak}} j</span>
                <button type="button" onClick="{{hb.remove}}" aria-label="Supprimer {{hb.name}}" style="width: 36px; height: 36px; border: 0; background: none; cursor: pointer; color: var(--muted); font-size: 18px">×</button>
              </div>
            </sc-for>
          </div>
        </div>
        <div style="display: flex; gap: .5rem; margin-top: 1rem; max-width: 520px"><label style="flex: 1"><span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Nouvelle habitude</span><input class="field" value="{{pf.habit}}" onChange="{{pf.onHabit}}" placeholder="Nouvelle habitude (gainage 5 min…)"></label><button type="button" class="btn btn-dark" onClick="{{pv.addHabit}}">Ajouter</button></div>
      </sc-if>

      <!-- RAPPELS RÉCURRENTS -->
      <sc-if value="{{pv.tRappels}}" hint-placeholder-val="{{ false }}">
        <div style="display: flex; flex-wrap: wrap; gap: 1.25rem; align-items: flex-start">
          <div style="flex: 2 1 420px; display: flex; flex-direction: column; gap: .5rem">
            <sc-for list="{{pv.recurs}}" as="rc" hint-placeholder-count="3">
              <div style="display: flex; gap: .8rem; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 0; padding: .75rem 1rem; opacity: {{rc.op}}">
                <button type="button" onClick="{{rc.toggle}}" aria-pressed="{{rc.pressed}}" aria-label="{{rc.aria}}" style="width: 32px; height: 32px; border-radius: 50%; cursor: pointer; background: {{rc.bg}}; border: 2px solid {{rc.border}}; color: var(--on-acc); font-weight: 900; flex: none">{{rc.mark}}</button>
                <span style="flex: 1"><span style="display: block; font-weight: 800; color: var(--text); text-decoration: {{rc.deco}}">{{rc.title}}</span><span style="font-size: 12.5px; color: var(--muted)">{{rc.freq}} · prochaine fois : {{rc.next}}</span></span>
                <sc-if value="{{rc.isToday}}" hint-placeholder-val="{{ false }}"><span class="cond" style="font-size: 11px; padding: .3rem .5rem; border-radius: 0; background: var(--note-bg); color: var(--note-fg)">Aujourd’hui</span></sc-if>
                <button type="button" onClick="{{rc.remove}}" aria-label="Supprimer {{rc.title}}" style="width: 32px; height: 32px; border: 0; background: none; cursor: pointer; color: var(--muted)">×</button>
              </div>
            </sc-for>
          </div>
          <div style="flex: 1 1 280px; background: var(--surface); border: 1px solid var(--line); border-radius: 0; padding: 1.1rem 1.25rem">
            <div class="ttl" style="font-size: 22px; margin-bottom: .8rem">Nouveau rappel</div>
            <label class="lbl" style="margin-bottom: .6rem">Quoi<input class="field" value="{{pf.rTitle}}" onChange="{{pf.onRTitle}}" placeholder="Sortir les poubelles, laver les maillots…"></label>
            <label class="lbl" style="margin-bottom: .6rem">Fréquence<x-select class="field" value="{{pf.rFreq}}" onChange="{{pf.onRFreq}}"><x-option value="day">Chaque jour</x-option><x-option value="week">Chaque semaine</x-option><x-option value="month">Chaque mois</x-option></x-select></label>
            <sc-if value="{{pv.rIsWeek}}" hint-placeholder-val="{{ true }}"><label class="lbl" style="margin-bottom: .8rem">Jour<x-select class="field" value="{{pf.rDow}}" onChange="{{pf.onRDow}}"><x-option value="1">Lundi</x-option><x-option value="2">Mardi</x-option><x-option value="3">Mercredi</x-option><x-option value="4">Jeudi</x-option><x-option value="5">Vendredi</x-option><x-option value="6">Samedi</x-option><x-option value="0">Dimanche</x-option></x-select></label></sc-if>
            <sc-if value="{{pv.rIsMonth}}" hint-placeholder-val="{{ false }}"><label class="lbl" style="margin-bottom: .8rem">Jour du mois<input class="field" type="number" min="1" max="28" value="{{pf.rDom}}" onChange="{{pf.onRDom}}"></label></sc-if>
            <button type="button" class="btn btn-dark" onClick="{{pv.addRecur}}" style="width: 100%">Ajouter</button>
          </div>
        </div>
      </sc-if>

      <!-- MINUTEUR -->
      <sc-if value="{{pv.tMinuteur}}" hint-placeholder-val="{{ false }}">
        <div style="display: flex; flex-wrap: wrap; gap: 1.25rem; align-items: stretch">
          <div class="cb-deep" style="flex: 2 1 420px; background: var(--inv-bg); color: var(--on-inv); border-radius: 0; padding: 1.75rem; text-align: center; display: flex; flex-direction: column; align-items: center; gap: .6rem">
            <span class="cond" style="font-size: 15px; color: {{tm.phaseColor}}">{{tm.phase}}</span>
            <span class="num" role="timer" aria-live="polite" style="font-size: clamp(4.5rem, 14vw, 8rem); line-height: 1; color: var(--on-inv)">{{tm.display}}</span>
            <span style="color: var(--on-inv-2)">Série {{tm.round}} / {{tm.rounds}}</span>
            <div style="width: 100%; max-width: 420px; height: 8px; background: var(--inv-bg-2); border-radius: 0; overflow: hidden"><div style="height: 8px; width: {{tm.pct}}; background: {{tm.phaseColor}}; transition: width .9s linear"></div></div>
            <div style="display: flex; gap: .6rem; margin-top: .6rem"><button type="button" class="btn btn-gold" onClick="{{tm.toggle}}" style="min-width: 150px">{{tm.toggleLabel}}</button><button type="button" class="btn" onClick="{{tm.reset}}" style="background: var(--inv-bg-2); color: var(--on-inv)">Réinitialiser</button></div>
          </div>
          <div style="flex: 1 1 260px; background: var(--surface); border: 1px solid var(--line); border-radius: 0; padding: 1.1rem 1.25rem">
            <div class="ttl" style="font-size: 22px; margin-bottom: .8rem">Fractionné</div>
            <div style="display: flex; flex-wrap: wrap; gap: .35rem; margin-bottom: .9rem"><sc-for list="{{tm.presets}}" as="tp" hint-placeholder-count="3"><button type="button" class="chip" onClick="{{tp.pick}}" style="min-height: 38px; font-size: 13.5px; background: var(--surface); color: var(--text); border: 1.5px solid var(--line-2)">{{tp.label}}</button></sc-for></div>
            <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: .5rem; margin-bottom: .8rem"><label class="lbl">Effort (s)<input class="field" type="number" min="5" step="5" value="{{tm.work}}" onChange="{{tm.onWork}}"></label><label class="lbl">Repos (s)<input class="field" type="number" min="0" step="5" value="{{tm.rest}}" onChange="{{tm.onRest}}"></label><label class="lbl">Séries<input class="field" type="number" min="1" max="50" value="{{tm.rounds}}" onChange="{{tm.onRounds}}"></label></div>
            <p style="font-size: 13px; color: var(--muted); margin: 0">Durée totale : {{tm.total}}. La séance terminée est ajoutée à votre activité.</p>
          </div>
        </div>
      </sc-if>

      <!-- FAMILLE -->
      <sc-if value="{{pv.tFamille}}" hint-placeholder-val="{{ false }}">
        <div style="display: flex; flex-wrap: wrap; gap: 1.25rem; align-items: flex-start">
          <div style="flex: 2 1 420px; display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 220px), 1fr)); gap: .6rem">
            <sc-for list="{{pv.members}}" as="mb" hint-placeholder-count="3">
              <div style="background: var(--surface); border: 1px solid var(--line); border-top: 4px solid {{mb.color}}; border-radius: 0; padding: .9rem 1rem">
                <div style="display: flex; align-items: center; gap: .6rem"><span class="ttl" style="width: 40px; height: 40px; border-radius: 50%; background: {{mb.color}}; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 18px; flex: none">{{mb.initial}}</span><span style="flex: 1"><span style="display: block; font-weight: 800; color: var(--text)">{{mb.name}}</span><span style="font-size: 12.5px; color: var(--muted)">{{mb.role}}</span></span></div>
                <div style="font-size: 13px; color: var(--text-2); margin-top: .6rem">{{mb.next}}</div>
                <div style="display: flex; gap: .4rem; margin-top: .6rem"><button type="button" class="lnk" onClick="{{mb.agenda}}" style="font-size: 13px">Son agenda</button><span style="flex: 1"></span><sc-if value="{{mb.canRemove}}" hint-placeholder-val="{{ true }}"><button type="button" onClick="{{mb.remove}}" aria-label="Retirer {{mb.name}}" style="border: 0; background: none; cursor: pointer; color: var(--muted)">Retirer</button></sc-if></div>
              </div>
            </sc-for>
          </div>
          <div style="flex: 1 1 260px; background: var(--surface); border: 1px solid var(--line); border-radius: 0; padding: 1.1rem 1.25rem">
            <div class="ttl" style="font-size: 22px; margin-bottom: .8rem">Ajouter un membre</div>
            <label class="lbl" style="margin-bottom: .6rem">Prénom<input class="field" value="{{pf.mName}}" onChange="{{pf.onMName}}"></label>
            <label class="lbl" style="margin-bottom: .8rem">Rôle / activité<input class="field" value="{{pf.mRole}}" onChange="{{pf.onMRole}}" placeholder="Fille · basket U11"></label>
            <button type="button" class="btn btn-dark" onClick="{{pv.addMember}}" style="width: 100%">Ajouter</button>
            <p style="font-size: 12.5px; color: var(--muted); margin: .8rem 0 0">Chaque événement de l’agenda peut être attribué à un membre ; l’agenda se filtre par personne.</p>
          </div>
        </div>
      </sc-if>
      </div>
      </div>
      <div style="margin-top: 2rem; display: flex; flex-wrap: wrap; gap: .75rem; align-items: center; font-size: 13px; color: var(--muted)"><span>Vos données restent sur cet appareil.</span><button type="button" class="lnk" onClick="{{pv.exportData}}" style="font-size: 14px">Copier mes données (JSON)</button><button type="button" class="lnk" onClick="{{pv.resetData}}" style="font-size: 14px">Tout effacer</button></div>
    </sc-if>
  </section>
</sc-if>

<!-- ================= CULTURE : ART, MÉMOIRE ET SPORT ================= -->
<sc-if value="{{isCulture}}" hint-placeholder-val="{{ false }}">
  <section style="position: relative; overflow: hidden; border-bottom: 1px solid var(--line)">
    <img src="assets/hero.jpg" alt="" style="position: absolute; top: 0; right: 0; width: 58%; height: 100%; object-fit: cover; object-position: center 35%; opacity: {{heroOpacity}}; filter: var(--img-filter)">
    <div class="veilL" style="position: absolute; inset: 0"></div>
    <div class="wrap" style="position: relative; padding-top: 2rem; padding-bottom: 2.5rem">
      <div class="eb" style="margin-bottom: .5rem">Culture</div>
      <h1 class="h1" style="font-size: clamp(2.6rem, 6vw, 5rem); max-width: 760px; margin-bottom: 1rem">Le sport, l’art et la <em class="bn-em">mémoire</em> du Cotentin</h1>
      <p style="max-width: 36rem; font-size: 1.1rem; line-height: 1.6; color: var(--text-2); margin: 0 0 1.5rem">Une exposition permanente, des parcours sportifs à travers le patrimoine, les lieux de culture de la Manche et un concours photo ouvert à tous.</p>
      <div role="tablist" aria-label="Rubriques culture" style="display: flex; gap: .4rem; flex-wrap: wrap">
        <sc-for list="{{cuTabs}}" as="ct" hint-placeholder-count="4"><button type="button" role="tab" aria-selected="{{ct.sel}}" class="chip" onClick="{{ct.pick}}" style="background: {{ct.bg}}; color: {{ct.fg}}; border: 1.5px solid {{ct.border}}">{{ct.label}}</button></sc-for>
      </div>
    </div>
  </section>

  <!-- EXPOSITION -->
  <sc-if value="{{cu.tExpo}}" hint-placeholder-val="{{ true }}">
    <section class="wrap" style="padding-top: 2.5rem; padding-bottom: 4rem">
      <sc-for list="{{cu.rooms}}" as="rm" hint-placeholder-count="4">
        <div style="margin-bottom: 3rem">
          <div style="display: flex; align-items: baseline; gap: 1rem; flex-wrap: wrap; border-bottom: 1px solid var(--line); padding-bottom: .6rem; margin-bottom: 1.25rem">
            <span class="cond" style="font-size: 13px; color: var(--gold-text)">Salle {{rm.n}}</span>
            <h2 class="h2" style="font-size: clamp(1.8rem, 3.4vw, 2.6rem)">{{rm.title}}</h2>
            <span style="font-size: 14px; color: var(--muted); flex: 1 1 260px">{{rm.intro}}</span>
          </div>
          <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, {{rm.min}}), 1fr)); gap: 1.5rem">
            <sc-for list="{{rm.works}}" as="wk" hint-placeholder-count="3">
              <figure style="margin: 0">
                <button type="button" onClick="{{wk.open}}" aria-label="Voir l’œuvre : {{wk.title}}" style="display: block; width: 100%; padding: 14px; border: 0; cursor: zoom-in; background: var(--surface); box-shadow: 0 0 0 1px var(--line), 0 22px 40px -28px var(--shadow); border-radius: 0">
                  <span class="{{wk.scope}}" style="display: block; aspect-ratio: {{wk.ratio}}; overflow: hidden; background: {{wk.bg}}"><img class="zimg" src="{{wk.img}}" alt="{{wk.alt}}" style="object-fit: {{wk.fit}}"></span>
                </button>
                <figcaption style="margin-top: .8rem; border-left: 2px solid var(--acc); padding-left: .75rem">
                  <span class="ttl" style="display: block; font-size: 19px; font-style: italic">{{wk.title}}</span>
                  <span style="display: block; font-size: 13px; color: var(--muted)">{{wk.author}} · {{wk.year}}</span>
                  <span class="cond" style="display: block; font-size: 11px; color: var(--gold-text); margin-top: .2rem">{{wk.technique}}</span>
                </figcaption>
              </figure>
            </sc-for>
          </div>
        </div>
      </sc-for>
    </section>
  </sc-if>

  <!-- PARCOURS SPORT & PATRIMOINE -->
  <sc-if value="{{cu.tParcours}}" hint-placeholder-val="{{ false }}">
    <section class="wrap" style="padding-top: 2.5rem; padding-bottom: 4rem">
      <p style="max-width: 44rem; color: var(--text-2); line-height: 1.6; margin: 0 0 1.5rem">Courir, pédaler ou marcher en traversant l’histoire. Chaque parcours relie des lieux de légende ; ajoutez la sortie à votre agenda ou enregistrez-la dans votre activité.</p>
      <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 520px), 1fr)); gap: 1.25rem">
        <sc-for list="{{cu.routes}}" as="ro" hint-placeholder-count="4">
          <article style="background: var(--surface); border: 1px solid var(--line); border-radius: 0; overflow: hidden; display: flex; flex-direction: column">
            <div style="position: relative; height: 150px; background: var(--surface-2)"><img src="{{ro.img}}" alt="" style="width: 100%; height: 100%; object-fit: cover; filter: var(--place-filter)"><span class="cond" style="position: absolute; left: 12px; top: 12px; font-size: 12px; background: #000000; color: #ffffff; padding: .3rem .55rem">{{ro.sport}}</span></div>
            <div style="padding: 1.1rem 1.25rem 1.25rem; display: flex; flex-direction: column; gap: .7rem; flex: 1">
              <div><h3 class="ttl" style="font-size: 26px; margin: 0">{{ro.name}}</h3><div style="font-size: 13.5px; color: var(--muted)">{{ro.area}} · {{ro.level}} · {{ro.dist}}</div></div>
              <p style="margin: 0; color: var(--text-2); line-height: 1.55; font-size: 14.5px">{{ro.desc}}</p>
              <ol style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: .35rem">
                <sc-for list="{{ro.steps}}" as="sp" hint-placeholder-count="3"><li style="display: flex; gap: .6rem; align-items: baseline; font-size: 14px; color: var(--text)"><span class="num" style="width: 22px; height: 22px; border-radius: 50%; background: var(--surface-2); color: var(--gold-text); display: inline-flex; align-items: center; justify-content: center; font-size: 12px; flex: none">{{sp.n}}</span><span><strong>{{sp.t}}</strong> <span style="color: var(--muted)">— {{sp.d}}</span></span></li></sc-for>
              </ol>
              <div style="display: flex; gap: .4rem; flex-wrap: wrap; margin-top: auto; padding-top: .5rem">
                <button type="button" class="btn btn-dark" onClick="{{ro.plan}}" style="min-height: 42px; font-size: 14px">Ajouter à mon agenda</button>
                <button type="button" class="btn btn-ghost" onClick="{{ro.log}}" style="min-height: 42px; font-size: 14px">C’est fait : enregistrer</button>
                <button type="button" class="btn btn-ghost" onClick="{{ro.meteo}}" style="min-height: 42px; font-size: 14px">Météo</button>
              </div>
            </div>
          </article>
        </sc-for>
      </div>
      <p style="font-size: 12.5px; color: var(--muted); margin-top: 1rem">Distances et tracés GPX à mesurer sur le terrain avant publication. Respectez les sentiers balisés et les consignes de sécurité sur le littoral.</p>
    </section>
  </sc-if>

  <!-- LIEUX DE CULTURE -->
  <sc-if value="{{cu.tLieux}}" hint-placeholder-val="{{ false }}">
    <section class="wrap" style="padding-top: 2.5rem; padding-bottom: 4rem">
      <div style="display: flex; gap: .4rem; flex-wrap: wrap; margin-bottom: 1.25rem"><sc-for list="{{cu.kinds}}" as="kd" hint-placeholder-count="4"><button type="button" class="chip" onClick="{{kd.pick}}" aria-pressed="{{kd.pressed}}" style="background: {{kd.bg}}; color: {{kd.fg}}; border: 1.5px solid {{kd.border}}">{{kd.label}}</button></sc-for></div>
      <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 1rem">
        <sc-for list="{{cu.venues}}" as="ve" hint-placeholder-count="6">
          <article style="background: var(--surface); border: 1px solid var(--line); border-radius: 0; padding: 1.1rem 1.2rem; display: flex; flex-direction: column; gap: .5rem">
            <span class="cond" style="font-size: 12px; color: var(--gold-text)">{{ve.kind}} · {{ve.city}}</span>
            <h3 class="ttl" style="font-size: 23px; margin: 0">{{ve.name}}</h3>
            <p style="margin: 0; font-size: 14.5px; color: var(--text-2); line-height: 1.55">{{ve.desc}}</p>
            <sc-if value="{{ve.hasLink}}" hint-placeholder-val="{{ false }}"><button type="button" class="lnk" onClick="{{ve.story}}" style="align-self: flex-start; font-size: 14px">{{ve.storyLabel}}</button></sc-if>
            <div style="font-size: 12.5px; color: var(--muted)">Horaires et tarifs : voir le site officiel du lieu.</div>
            <div style="display: flex; gap: .4rem; flex-wrap: wrap; margin-top: auto; padding-top: .4rem">
              <a class="btn btn-ghost" href="{{ve.map}}" target="_blank" rel="noopener" style="min-height: 40px; font-size: 14px">Itinéraire</a>
              <button type="button" class="btn btn-dark" onClick="{{ve.plan}}" style="min-height: 40px; font-size: 14px">Prévoir une visite</button>
            </div>
          </article>
        </sc-for>
      </div>
    </section>
  </sc-if>

  <!-- CONCOURS PHOTO -->
  <sc-if value="{{cu.tConcours}}" hint-placeholder-val="{{ false }}">
    <section class="wrap" style="padding-top: 2.5rem; padding-bottom: 4rem">
      <div style="display: flex; flex-wrap: wrap; gap: 2rem; align-items: flex-start; margin-bottom: 2rem">
        <div style="flex: 2 1 420px">
          <h2 class="h2" style="font-size: clamp(1.8rem, 3.4vw, 2.6rem); margin-bottom: .6rem">Regards sur le sport local</h2>
          <p style="color: var(--text-2); line-height: 1.6; margin: 0">Concours photo ouvert à tous : un geste, une tribune, un vestiaire, un paysage du Cotentin. Votez pour vos images préférées ; les lauréats sont exposés dans La Gazette et à la boutique Cherwood.</p>
        </div>
        <div style="flex: 1 1 260px; background: var(--note-bg); border: 1px solid var(--note-line); color: var(--note-fg); border-radius: 0; padding: .9rem 1rem; font-size: 14px; line-height: 1.5">Images de la rédaction. Votes enregistrés sur cet appareil.</div>
      </div>
      <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 280px), 1fr)); gap: 1.25rem; margin-bottom: 2.5rem">
        <sc-for list="{{cu.entries}}" as="en" hint-placeholder-count="6">
          <figure style="margin: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 0; overflow: hidden">
            <div style="position: relative; aspect-ratio: 4 / 3; overflow: hidden"><img class="zimg" src="{{en.img}}" alt="{{en.title}}"><sc-if value="{{en.isTop}}" hint-placeholder-val="{{ false }}"><span class="cond" style="position: absolute; top: 10px; left: 10px; font-size: 11px; background: var(--acc); color: var(--on-acc); padding: .3rem .55rem">En tête</span></sc-if></div>
            <figcaption style="padding: .8rem 1rem 1rem; display: flex; gap: .75rem; align-items: center">
              <span style="flex: 1"><span class="ttl" style="display: block; font-size: 19px; font-style: italic">{{en.title}}</span><span style="font-size: 13px; color: var(--muted)">{{en.author}}</span></span>
              <button type="button" onClick="{{en.vote}}" aria-pressed="{{en.pressed}}" aria-label="{{en.aria}}" style="display: inline-flex; align-items: center; gap: .35rem; min-height: 40px; padding: 0 .75rem; border-radius: 0; cursor: pointer; font-weight: 800; background: {{en.bg}}; color: {{en.fg}}; border: 1.5px solid {{en.border}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="{{en.fill}}" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"></path></svg><span class="num">{{en.votes}}</span></button>
            </figcaption>
          </figure>
        </sc-for>
      </div>
      <div style="max-width: 620px; background: var(--surface); border: 1px solid var(--line); border-radius: 0; padding: 1.25rem 1.4rem">
        <div class="ttl" style="font-size: 24px; margin-bottom: .8rem">Proposer une photo</div>
        <sc-if value="{{cu.notSent}}" hint-placeholder-val="{{ true }}">
          <label class="lbl" style="margin-bottom: .6rem">Titre de l’image<input class="field" value="{{cuf.title}}" onChange="{{cuf.onTitle}}" placeholder="Sous la pluie de Postaire…"></label>
          <label class="lbl" style="margin-bottom: .6rem">Votre nom<input class="field" value="{{cuf.author}}" onChange="{{cuf.onAuthor}}"></label>
          <div style="border: 1.5px dashed var(--line-2); border-radius: 0; padding: 1rem; text-align: center; color: var(--muted); margin-bottom: .8rem">Dépôt du fichier photo · [stockage à brancher]</div>
          <label class="lbl" style="flex-direction: row; align-items: center; gap: .6rem; margin-bottom: .9rem; cursor: pointer"><input type="checkbox" checked="{{cuf.rights}}" onChange="{{cuf.onRights}}" style="width: 20px; height: 20px; accent-color: var(--ink)">Je suis l’auteur de la photo et j’ai l’accord des personnes reconnaissables.</label>
          <button type="button" class="btn btn-dark" onClick="{{cu.submit}}">Envoyer ma participation</button>
        </sc-if>
        <sc-if value="{{cu.sent}}" hint-placeholder-val="{{ false }}"><p style="margin: 0; color: var(--success); font-weight: 700">Merci ! Votre photo sera publiée après validation par la rédaction.</p></sc-if>
      </div>
    </section>
  </sc-if>
</sc-if>


<!-- ================= CLUB HOUSE ================= -->
<sc-if value="{{isClubhouse}}" hint-placeholder-val="{{ false }}">
  <section style="position: relative; overflow: hidden; border-bottom: 1px solid var(--line)">
    <img src="assets/gz_scarf.jpg" alt="" style="position: absolute; top: 0; right: 0; width: 58%; height: 100%; object-fit: cover; opacity: {{heroOpacity}}; filter: var(--img-filter)">
    <div class="veilL" style="position: absolute; inset: 0"></div>

      <p style="max-width: 36rem; font-size: 1.08rem; line-height: 1.6; color: var(--text-2); margin: 0 0 1.25rem">Discuter, s’entraider, se retrouver au bord des terrains et gagner des points de fidélité.</p>
      <div style="display: flex; gap: .6rem; flex-wrap: wrap; align-items: center; margin-bottom: 1.25rem">
        <span class="chip" style="display: inline-flex; align-items: center; gap: .45rem; background: var(--surface); color: var(--text); border: 1.5px solid var(--line-2); text-transform: none; letter-spacing: 0; font-family: inherit; font-weight: 700; font-size: 14px"><span style="width: 9px; height: 9px; border-radius: 50%; background: {{chLevelColor}}"></span>{{chMe.level}} · {{chMe.points}} pts</span>
        <sc-if value="{{loggedOut}}" hint-placeholder-val="{{ true }}"><button type="button" class="btn btn-dark" onClick="{{openLogin}}" style="min-height: 44px; font-size: 15px">Rejoindre le Club House</button></sc-if>
      </div>
      <div role="tablist" aria-label="Rubriques du Club House" style="display: flex; gap: .4rem; flex-wrap: wrap">
        <sc-for list="{{chTabs}}" as="ct" hint-placeholder-count="5"><button type="button" role="tab" aria-selected="{{ct.sel}}" class="chip" onClick="{{ct.pick}}" style="background: {{ct.bg}}; color: {{ct.fg}}; border: 1.5px solid {{ct.border}}">{{ct.label}}</button></sc-for>
      </div>
