# Réglages Netlify (ignorés par les autres hébergeurs)
[build]
  publish = "."
  # Insère l'adresse réelle du site dans les balises de partage et le plan du site
  command = "sh outils/netlify-build.sh"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(self), geolocation=(self), microphone=()"
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"
[[headers]]
  for = "/contenus/*"
  [headers.values]
    Cache-Control = "public, max-age=300"
